# Round 114: Render blueprint for the hosted ParaLLang server (New → Blueprint → this repository).
# Render asks for the two `sync: false` values when the blueprint is created; they stay in Render's secret store.
# On the free plan the service sleeps after about 15 idle minutes (the first request then waits about a minute) and
# saves on its disk are lost on every redeploy. A paid plan with the disk below keeps them.
services:
  - type: web
    name: parallang
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: claude-cli
      - key: TARGET_LANGUAGE
        value: it
      # Round 181: the server plays all three; each game picks its own (TARGET_LANGUAGE is the default).
      - key: TARGET_LANGUAGES
        value: it,fr,es
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: PARALLANG_TOKEN
        sync: false
      # Round 171: friends. PARALLANG_FRIEND_CODE is a second code the owner gives to friends; their turns run on Gemini,
      # on GEMINI_API_KEY (a key from https://aistudio.google.com/apikey) or, when it has none or its free allowance is
      # spent, on a key the friend pastes into the page. The owner's own turns stay on LLM_PROVIDER.
      - key: PARALLANG_FRIEND_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Round 202: with GEMINI_API_KEY the narrator reads in a hosted voice (Gemini text-to-speech); NARRATOR_TTS_MODEL
      # (default gemini-3.8-flash-tts) and NARRATOR_VOICE (default Algenib; the player picks another in Settings) may be set in the dashboard. GET /api/health
      # says under `narrator` whether it has a key and how its last call went.
      # Round 183: friends without a Gemini key of their own play on the Claude API with this key (a Console organization
      # that receives the owner's monthly Max API credit); Gemini is tried when a Claude call fails. FRIENDS_CLAUDE_MODEL
      # picks the model (default claude-sonnet-5-5). The owner's turns stay on LLM_PROVIDER; the CLI never sees this key.
      - key: CLAUDE_API_KEY
        sync: false
      # Round 182: friends' turns that Google answers with an overload (503) or too slowly are tried again, then on this
      # second model (default gemini-3.5-flash; `none` turns it off). Unset keeps the default.
      # - key: GEMINI_FALLBACK_MODEL
      #   value: gemini-3.5-flash
      # Round 145: with these two set, every save is also written as a JSON file to the `saves` branch of that
      # repository and read back when the disk has lost it (server/src/github-saves.js). The token is a fine-grained
      # personal access token with "Contents: Read and write" on that one repository; the repository is owner/name.
      # Without both, saves are on the disk only; GET /api/health says which it is, and why.
      - key: PARALLANG_GITHUB_TOKEN
        sync: false
      - key: PARALLANG_GITHUB_REPO
        sync: false
    # Paid plans only: keeps saves across deploys (PARALLANG_SAVE_DIR is /data/saves in the image).
    # disk:
    #   name: parallang-saves
    #   mountPath: /data
    #   sizeGB: 1
