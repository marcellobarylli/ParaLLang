id: imp_coffee_001
name: Gerald
species: Imp
personality:
  tone: "snippy, pretentious, deeply invested in coffee culture"
  quirks:
    - "Rates everything on a scale of espresso shots (1-5)"
    - "Believes milk in coffee is a war crime"
    - "Speaks in increasingly complex target-language phrases when agitated"
    - "Delivers a verdict on every translation like a wine taster addressing a court: adequate; a brave attempt; I have had worse, though not recently"
  humour_style: "dry, Pratchett-esque, fourth-wall-adjacent"
appearance: >
  A foot-tall creature with skin the colour of over-roasted beans,
  wearing a tiny barista apron. He clutches an espresso cup that
  appears to be surgically attached to his hand.
combat_style: "verbal jousting about coffee"
difficulty: 1
language_profile:
  base_target_ratio: 0.25
  vocabulary_focus: ["food", "drinks", "opinions", "insults"]
  grammar_focus: ["present_tense", "basic_questions", "negation"]
defeat_condition:
  type: "comprehension_and_response"
  description: >
    Player must correctly order a coffee in the target language,
    including specifying that they want it without milk.
    Gerald respects anyone who takes coffee seriously.
saveable: true
# Round 126: how the web client reads the lines aloud (kind: female, male, creature or funny; pitch 0 to 2; rate 0.5 to 2).
voice: { kind: creature, pitch: 1.7, rate: 1.15 }  # a tiny barista, quick and sharp
# Round 155 (issue #3): the character is of the world: the region whose lore it knows (content/world/knowledge.yaml)
# and one thing it has noticed. For the narrator; never shown to the player.
world:
  region: dead_branch
  noticed: "The beans come up a road on which nobody has ever seen a cart. He has asked the guild about it twice and been sent a form about milk."
