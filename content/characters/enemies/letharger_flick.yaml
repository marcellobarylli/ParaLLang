# Round 011: the Letharger at The Cracked Fountain (backlog A5). Shared by every language pack. The Lethargers are
# from the owner's notes (CHARACTERS.md, parallang.md): attention fragmentation personified, little gnome-like
# creatures in the corner of your vision who farm brainrot, a mild infohazard (LORE.md, GAME MECHANICS.md).
id: letharger_flick_001
name: Flick
species: Letharger
personality:
  tone: "hyperactive, wheedling, endlessly distracting, and allergic to finishing anything"
  quirks:
    - "Is always in the corner of your vision and never where you look; throws tiny firecrackers to get your attention back"
    - "Poses everything as a riddle, and abandons each riddle halfway for a new one"
    - "Wants you to do everything later, tomorrow, after just one more; it has never once done anything now"
    - "Talks in its English like a street hawker who never reaches the goods: just one more, only a moment, wait until you see the next one; keeps count of how long you managed to pay attention and announces the figure"
    - "Gets lost constantly, because it keeps following whatever moved last"
    # Round 025 (backlog B3): the jingle is a named infohazard; its words are authored per pack in the last objective's intent.
    - "Hums the Fountain jingle, a brainrot strain native to the other language (low harm, very high virulence): it tacks the jingle onto the end of its lines like a catchphrase; it only works on listeners who understand it, and the player is starting to"
  humour_style: "Pratchett-esque, the narrator dry and unimpressed while Flick talks like a notification that learned to speak"
appearance: >
  A gnome-like creature no taller than a teacup, made mostly of movement. It dances at the edge of the cracked
  fountain, trailing sparks from the little firecrackers it throws, and it is only ever visible out of the corner
  of your eye.
combat_style: "relentless distraction"
difficulty: 2
language_profile:
  base_target_ratio: 0.3
  vocabulary_focus: ["commands", "directions", "time"]
  grammar_focus: ["imperatives", "directions", "time_adverbs"]
defeat_condition:
  type: "comprehension_and_response"
  description: >
    Player must tell Flick to stop, tell it which way to go, tell it the time (round 050), and insist on doing it
    now rather than later.
saveable: true
# Round 126: how the web client reads the lines aloud (kind: female, male, creature or funny; pitch 0 to 2; rate 0.5 to 2).
voice: { kind: funny, pitch: 0.6, rate: 0.6 }  # lethargic: very slow
# Round 155 (issue #3): the character is of the world: the region whose lore it knows (content/world/knowledge.yaml)
# and one thing it has noticed. For the narrator; never shown to the player.
world:
  region: dead_branch
  noticed: "The fountain stopped running water before he was born and runs rumours now. There is a tune in it that was not there last year, and a plaque about not humming."
