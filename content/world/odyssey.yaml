# Round 163 (issue #13): the voyage of Odysseus as tradition places it, for the chart the narrator shows beside its
# remark on a long walk ("on rails" play, drawn whole, looks like a random walk, and so does the Odyssey when it is
# mapped). Bundled by the web client (client/src/components/OdysseyChart.jsx); the server does not load it.
#
# This is a drawing made here, not a map taken from anywhere: a line through the stops in the poem's order, each at
# the place tradition most often gives it. Issue #13 asks for a royalty-free or public-domain map of the route if one
# exists; the session that built this could not reach Wikimedia Commons (or any page at all) to look for one and read
# its licence, so none was taken. To use a real map instead, see "The Odyssey's route" in
# client/public/models/ASSETS.md.
#
# Sources and their limits:
#   - The stops and their order are the poem's own (Odyssey, books 9 to 12 for the wanderings as Odysseus tells them,
#     5 to 13 for Calypso, the Phaeacians and the landing on Ithaca).
#   - The identifications are the common ones as a web search returned them on 2026-11-23, chiefly from Wikipedia's
#     "Geography of the Odyssey" (https://en.wikipedia.org/wiki/Geography_of_the_Odyssey): Djerba for the
#     Lotus-eaters, Sicily for the Cyclopes, the Aeolian Islands (Lipari) for Aeolus, Monte Circeo for Circe, the
#     Strait of Messina for Scylla and Charybdis with the Sirens at a headland near it, Sicily for Thrinacia, Gozo
#     for Ogygia, Corfu for Scheria. The same results call the Laestrygonians contested (south-east Sicily in one
#     source, Trapani and Erice in another) and give alternatives for most of the others. The page itself could not be
#     opened, only the search's summary of it.
#   - The coordinates are the well-known positions of those modern places, to a tenth of a degree, written from
#     memory and not checked against a gazetteer in this session. The chart is a sketch: nothing should be measured
#     on it.
#   - `disputed: true` marks a stop whose place the sources above call contested; `unplaced: true` one that tradition
#     itself puts off the map.
title: "The Odyssey, as tradition maps it"
caption: >-
  A sketch of the voyage home of Odysseus, each stop where tradition most often puts it. Nearly every place on it is
  disputed. Troy to Ithaca is a few days' sail; it took him ten years.
frame: { west: 8, east: 28, south: 32.5, north: 42.5 }
stops:
  - { name: Troy, place: "Hisarlik, in the Troad", lon: 26.2, lat: 40.0 }
  - { name: The Cicones, place: "Ismarus, in Thrace", lon: 25.5, lat: 40.9 }
  - { name: The Lotus-eaters, place: "Djerba", lon: 10.9, lat: 33.8, disputed: true }
  - { name: The Cyclopes, place: "Sicily", lon: 15.1, lat: 37.6, disputed: true }
  - { name: Aeolus, place: "Lipari, in the Aeolian Islands", lon: 14.9, lat: 38.5, disputed: true }
  - { name: The Laestrygonians, place: "the west of Sicily", lon: 12.6, lat: 38.0, disputed: true }
  - { name: Circe, place: "Monte Circeo", lon: 13.1, lat: 41.2, disputed: true }
  - { name: The Underworld, place: "beyond the stream of Ocean", lon: 9.2, lat: 41.9, unplaced: true }
  - { name: Circe again, place: "Monte Circeo", lon: 13.1, lat: 41.2, disputed: true, again: true }
  - { name: The Sirens, place: "a headland by the Strait of Messina", lon: 15.6, lat: 38.4, disputed: true }
  - { name: Scylla and Charybdis, place: "the Strait of Messina", lon: 15.7, lat: 38.1 }
  - { name: Thrinacia, place: "Sicily", lon: 15.2, lat: 37.3, disputed: true }
  - { name: Calypso, place: "Gozo", lon: 14.3, lat: 36.0, disputed: true }
  - { name: The Phaeacians, place: "Corfu", lon: 19.9, lat: 39.6 }
  - { name: Ithaca, place: "Ithaca", lon: 20.7, lat: 38.4 }
