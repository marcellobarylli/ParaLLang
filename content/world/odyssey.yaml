# Round 163 (issue #13), redrawn in round 165: the voyage of Odysseus as tradition places it, for the chart the narrator
# shows beside its remark on a long walk ("on rails" play, drawn whole, looks like a random walk, and so does the
# Odyssey when it is mapped). Bundled by the web client (client/src/components/OdysseyChart.jsx); the server does not
# load it.
#
# The chart has a real map under it since round 165: the coast is Natural Earth's land boundaries at 1:10m (public
# domain), cut to `frame` and thinned by client/scripts/make-odyssey-map.mjs into content/world/odyssey-map.json. The
# same script finds the line between two stops: the shortest way by sea. Run it again when a stop or the frame
# changes. Source, licence and checksum: "The Odyssey's route" in client/public/models/ASSETS.md.
#
# Sources and their limits:
#   - The stops and their order are the poem's own (Odyssey, books 9 to 12 for the wanderings as Odysseus tells them,
#     5 to 13 for Calypso, the Phaeacians and the landing on Ithaca).
#   - The identifications are the common ones as a web search returned them on 2026-11-23, chiefly from Wikipedia's
#     "Geography of the Odyssey" (https://en.wikipedia.org/wiki/Geography_of_the_Odyssey): Djerba for the
#     Lotus-eaters, Sicily for the Cyclopes, the Aeolian Islands (Lipari) for Aeolus, Monte Circeo for Circe, the
#     Strait of Messina for Scylla and Charybdis with the Sirens at a headland near it, Sicily for Thrinacia, Gozo
#     for Ogygia, Corfu for Scheria. The same results call the Laestrygonians contested (south-east Sicily in one
#     source, Trapani and Erice in another) and give alternatives for most of the others. The page itself could not be
#     opened, only the search's summary of it.
#   - The coordinates were first written from memory, to a tenth of a degree. Round 165 checked each against the
#     coast: the island stops (Djerba, Lipari, Gozo, Corfu, Ithaca) fall on islands of the right size at those
#     positions, and the others on or beside the coast they name. Two were wrong and are corrected: Scylla and
#     Charybdis stood inland in Calabria and now stand in the strait, and the Underworld stood on Corsica and now
#     stands in open sea. A test (client/src/components/__tests__/odyssey.test.jsx) keeps every placed stop on or
#     beside land. No gazetteer was read.
#   - The line between two stops is not the poem's: the poem names almost nothing between them. It is the shortest
#     way a ship could go, kept a little off the shore. Where the poem does name the way the line agrees with it:
#     Odysseus is blown off his course at Cape Malea, past Cythera, and carried nine days to the Lotus-eaters
#     (book 9, in A. T. Murray's translation at https://www.theoi.com/Text/HomerOdyssey9.html, read through a web
#     search on 2026-11-23), and the shortest way by sea from Thrace to Djerba rounds Malea too.
#   - `disputed: true` marks a stop whose place the sources above call contested; `unplaced: true` one that tradition
#     itself puts off the map (it is drawn in open sea at the chart's western edge, towards Ocean).
#   - `label: [right, down]` moves a stop's number off its place, in the chart's units, where stops crowd (around the
#     Strait of Messina, and where the line would run under the number); a thin line joins the number to the place.
#   - `labels` are the names written on the map (`turn` in degrees clockwise; `isle` is land, written smaller). A
#     test keeps each land name on land and each sea name on the sea. "The stream of Ocean" is the poem's: the ship comes to "the deep waters of the river
#     Oceanus" and the crew go "beside the stream of Oceanus" to the place of the dead (book 11, in Samuel Butler's
#     and Murray's translations, read through a web search on 2026-11-23). "Aegean Sea" is written north of Crete,
#     in the part also called the Sea of Crete, which the sources a search returned (Britannica, and Wikipedia
#     quoting the International Hydrographic Organization) count as the Aegean's southern end. `rose` is where the compass rose stands, `cartouche` the title drawn on the map.
title: "The Odyssey, as tradition maps it"
caption: >-
  The voyage home of Odysseus on the real coast, each stop where tradition most often puts it. Nearly every place on
  it is disputed, and the line between two stops is only the shortest way by sea. Troy to Ithaca is a few days' sail;
  it took him ten years.
credit: "Coast: Natural Earth, public domain."
