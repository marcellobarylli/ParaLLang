id: the_rift
name: The Rift
description: >
  Here the market simply stops, the way a sentence stops when the speaker forgets the end of it. The cobbles give
  way to a seam of light, and the roots of a dead branch push up through it. Something on the other side is
  talking, in a language made of both of yours and neither.
vocabulary_focus: [review of all learned vocabulary]
