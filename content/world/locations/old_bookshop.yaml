id: old_bookshop
name: The Old Bookshop
description: >
  A shop that sells books the way a cat sells affection: on its own terms, and only when you have stopped asking.
  The shelves lean inward to listen. Some of the spines are written in a language that is not quite either of
  yours, and the words shuffle when you look at them too long.
vocabulary_focus: [abstract nouns, reading comprehension]
encounter: old_bookshop_bookworm
