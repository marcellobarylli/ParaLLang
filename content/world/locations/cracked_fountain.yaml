id: cracked_fountain
name: The Cracked Fountain
description: >
  The fountain stopped running water some time ago and now runs mostly rumours. A split down its middle leaks a
  faint light, and something small keeps darting at the edge of your vision, just where you are not looking. A brass plaque, newer than the fountain, reads: PLEASE DO NOT HUM.
vocabulary_focus: [time, directions, commands]
encounter: cracked_fountain_letharger
map: { x: 0.5, y: 0.44 }
