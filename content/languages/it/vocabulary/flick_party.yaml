  - id: andiamo
    kind: word
    target: andiamo
    part_of_speech: verb
    accepted_translations:
      - let's go
      - we go
      - we are going
    surface_variants:
      - andiamo
    accent_insensitive: false
    example:
      target: Andiamo al mercato!
      english: Let's go to the market!
    note: 'From andare, to go: andiamo is both "we go" and "let''s go".'
