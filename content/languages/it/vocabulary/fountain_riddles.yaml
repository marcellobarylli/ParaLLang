  - id: treccani-fermo
    title: 'Treccani, Vocabolario: fermo'
    url: https://www.treccani.it/vocabolario/fermo/
  - id: treccani-bastare
    title: 'Treccani, Vocabolario: bastare'
    url: https://www.treccani.it/vocabolario/bastare/
  - id: treccani-guardare
    title: 'Treccani, Vocabolario: guardare'
    url: https://www.treccani.it/vocabolario/guardare/
  - id: treccani-destra
    title: 'Treccani, Vocabolario: destra'
    url: https://www.treccani.it/vocabolario/destra/
  - id: treccani-sinistra
    title: 'Treccani, Vocabolario: sinistra'
    url: https://www.treccani.it/vocabolario/sinistra/
  - id: treccani-dritto
    title: 'Treccani, Vocabolario: dritto'
