entries:
  - id: buono
    kind: word
    target: "buono"
    part_of_speech: adjective
    accepted_translations: ["good", "tasty", "nice"]
    surface_variants: ["buono", "buona", "buon", "buonissimo", "buonissima"]
    accent_insensitive: false
    example: { target: "Il caffè è buono.", english: "The coffee is good." }
    note: "Buono agrees with its noun: il caffè è buono, la tazza è buona. Buonissimo means 'very good'. Before most masculine nouns it shortens: un buon caffè."
    reference_ids: [treccani-buono, wiktionary-buono]
