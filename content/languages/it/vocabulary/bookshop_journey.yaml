  - id: treccani-anno
    title: 'Treccani, Vocabolario: anno'
    url: https://www.treccani.it/vocabolario/anno/
  - id: treccani-nome
    title: 'Treccani, Vocabolario: nome'
    url: https://www.treccani.it/vocabolario/nome/
