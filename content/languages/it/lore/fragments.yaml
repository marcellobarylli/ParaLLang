# Round 030 (backlog A9): fragments of The Journey, found after an encounter and kept in the Spellbook. Optional to
# translate (parallang_obsidian/CHARACTERS.md, Journathan). Authored, not generated. No fragment contains an
# objective target of the pack (server test), so the Spellbook may show them at any time. `title`, `found` and
# `translation` are the same English text in every pack (tested). Pending a native speaker's review.
# Round 032: `after_conversations` unlocks a fragment by party conversations with the found_after character.
fragments:
  - id: journey_first_stitch
    title: The first stitch
    found_after: old_bookshop_bookworm
    found: "Folded inside the battered copy of The Journey that Marginalia sold you, in a hand that changes language halfway through a word."
    text: >-
      Ogni volta che Journathan passava da un ramo all'altro, un filo restava dietro di lui. Venti inverni di traversate:
      venti inverni di fili. Dicono che i più antichi reggano tuttora la trama del mondo. Forse il primo punto fu suo.
    translation: >-
      Each time Journathan passed from one branch to another, a thread stayed behind him. Twenty winters of crossings:
      twenty winters of threads. They say the oldest still hold up the weave of the world. Perhaps the first stitch
      was his.
    glossary:
      - { word: "ramo", meaning: "branch" }
      - { word: "filo", meaning: "thread" }
      - { word: "traversate", meaning: "crossings" }
      - { word: "tuttora", meaning: "to this day" }
      - { word: "trama", meaning: "weave; also plot" }
      - { word: "punto", meaning: "stitch; also point" }
      - { word: "fu", meaning: "was (passato remoto of essere)" }
  - id: journey_sirens
    title: The Sirens
    found_after: cracked_fountain_letharger
    found: "Scratched into the rim of the fountain, under the plaque, at exactly the height of the corner of your eye."
    text: >-
      Le sirene cantavano ai margini della vista, dove l'occhio non arriva mai del tutto. Journathan si fece legare
      all'albero della nave: desiderava ascoltare senza sterzare verso di loro. I marinai, con la cera nelle orecchie,
      remavano e non sentivano niente. Il canto, dicono, era sempre lo stesso ritornello, ripetuto all'infinito.
    translation: >-
      The Sirens sang at the edges of sight, where the eye never quite reaches. Journathan had himself tied to the
      ship's mast: he wanted to listen without steering towards them. The sailors, wax in their ears, rowed and
      heard nothing. The song, they say, was always the same refrain, repeated forever.
    glossary:
      - { word: "margini", meaning: "edges" }
      - { word: "si fece legare", meaning: "had himself tied" }
      - { word: "albero", meaning: "mast; also tree" }
      - { word: "sterzare", meaning: "to steer" }
      - { word: "cera", meaning: "wax" }
      - { word: "remavano", meaning: "they rowed" }
      - { word: "ritornello", meaning: "refrain" }
  - id: journey_shroud
    title: The shroud
    found_after: the_rift_errata
    found: "Left behind when the Rift narrowed to a hairline: a loose thread, and the words that were stitched along it."
    text: >-
      Sulla sua isola, la moglie di Journathan tesseva un sudario di giorno e lo disfaceva di notte. I pretendenti
      credevano che prendesse tempo. In verità teneva separati i rami del mondo, punto per punto, finché lui non
      fosse tornato.
    translation: >-
      On her island, Journathan's wife wove a shroud by day and unpicked it by night. The suitors believed she was
      buying time. In truth she was holding the branches of the world apart, stitch by stitch, until he came
      back.
    glossary:
      - { word: "tesseva", meaning: "she wove" }
      - { word: "sudario", meaning: "shroud" }
      - { word: "disfaceva", meaning: "she unpicked, undid" }
      - { word: "pretendenti", meaning: "suitors" }
      - { word: "prendesse tempo", meaning: "she was buying time" }
      - { word: "separati", meaning: "apart, separated" }
      - { word: "finché", meaning: "until" }
  - id: journey_dead_branch
    title: The word for it
    found_after: imp_coffee_greeting
    after_conversations: 3
    found: "On your third coffee break, Gerald recites a passage he swears he learned as a barista in the Dead Branch."
    text: >-
      Nel Ramo Morto, Journathan bevve qualcosa di scuro e amaro, servito in tazze piccolissime. Chi lo assaggiava
      piangeva. La parola per dirlo non esiste più: è morta con il ramo, e oggi non la ricorda nemmeno un vocabolario.
    translation: >-
      In the Dead Branch, Journathan drank something dark and bitter, served in very small cups. Whoever tasted it
      wept. The word for it no longer exists: it died with the branch, and today not even a dictionary remembers it.
    glossary:
      - { word: "Ramo Morto", meaning: "Dead Branch" }
      - { word: "bevve", meaning: "he drank (passato remoto of bere)" }
      - { word: "amaro", meaning: "bitter" }
      - { word: "tazze", meaning: "cups" }
      - { word: "assaggiava", meaning: "tasted" }
      - { word: "piangeva", meaning: "wept" }
      - { word: "nemmeno", meaning: "not even" }
      - { word: "vocabolario", meaning: "dictionary" }
