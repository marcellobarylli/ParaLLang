id: flick_slow_walk
character: characters/enemies/letharger_flick.yaml
party_of: cracked_fountain_letharger
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: Player gets Flick moving and keeps it beside them, in Italian
max_turns: 20
resolved_message: Flick moves. Now. Together with you. Historians will doubt it.
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: minutes
    prompt: 'Flick, now in your party, has sat down and wants five more minutes. Bargain: tell it how many minutes it gets, using a Italian number.'
    intent: Flick, now travelling in the player's party, has sat down and asks, in one English sentence, for "five more minutes". In its greeting it does not introduce itself. The player answers with how many minutes Flick gets, as a Italian number. Before the player names a number, Flick says no Italian number itself, neither five nor any other; once the player has named one, Flick may haggle back with a different Italian number of minutes. Flick does not say "andiamo" or "insieme" itself before the player has.
    target_vocabulary_ids:
      - due
      - tre
      - quattro
      - cinque
      - sei
      - sette
      - otto
      - nove
      - dieci
      - undici
      - dodici
    required_target_groups:
      - - due
        - tre
        - quattro
        - cinque
        - sei
        - sette
        - otto
        - nove
        - dieci
        - undici
        - dodici
    grammar_constraints:
      - The player's own offer of a number of minutes from two to twelve, with the number as a Italian word, alone or with the word for minutes; a tentative question or a correction (not five, two) is an offer too.
      - Agreeing to five passes; an agreement slip in the word for minutes passes, and feedback may correct it in English.
      - Reject English-only numbers, digits, numbers outside two to twelve, a number that is not an offer of minutes, refusals, quotations and talk about the word.
    accepted_examples:
      - Due minuti!
      - Dieci minuti, non di più.
      - Tre.
      - Tre minuti?
      - Non cinque, due minuti!
    negative_examples:
      - text: Two minutes.
        reason: English-only; it does not use an Italian number.
      - text: 2 minuti.
        reason: A digit, not the Italian word.
      - text: Flick dice cinque.
        reason: It reports what Flick says rather than making an offer.
      - text: Sei stanco.
        reason: Sei here means you are; it is not an offer of minutes.
      - text: Cento minuti.
        reason: A hundred is outside two to twelve.
    reference_meaning: The player tells Flick how many minutes it gets.
    hint_limit: 2
    next_objective: lets_go
    assessment_reference_ids:
      - wiktionary-sei
  - id: lets_go
    prompt: 'Flick, now in your party, has had its minutes. Get it moving: say let''s go, using Italian.'
    intent: Flick, now travelling in the player's party, has had its minutes, and they are up. The player must get it moving. Flick does not say "andiamo" or "insieme" itself before the player has.
    target_vocabulary_ids:
      - andiamo
    required_target_groups:
      - - andiamo
    grammar_constraints:
      - The player tells Flick in Italian that they are going now.
      - Reject English-only answers, refusals, and quotations.
    accepted_examples:
      - Andiamo!
      - Andiamo, Flick!
      - Dai, andiamo adesso.
    negative_examples:
      - text: Let's go.
        reason: English-only; it does not use the Italian word.
      - text: Non andiamo.
        reason: It refuses to go.
      - text: Flick says andiamo.
        reason: It reports someone else's words.
    reference_meaning: The player says let's go.
    hint_limit: 2
    next_objective: together
    assessment_reference_ids:
      - treccani-andare
  - id: together
    prompt: Flick wanders off again. Tell it you go together, using Italian.
    intent: Flick keeps drifting away; the player says they go together.
    target_vocabulary_ids:
      - insieme
    required_target_groups:
      - - insieme
    grammar_constraints:
      - The player says in Italian that they go together.
      - Reject English-only answers, refusals, and talk about the word.
    accepted_examples:
      - Insieme.
      - Andiamo insieme!
      - Insieme, Flick.
    negative_examples:
      - text: Together.
        reason: English-only; it does not use the Italian word.
      - text: Non insieme.
        reason: It refuses to go together.
      - text: Insieme means together.
        reason: It discusses the word rather than saying it to Flick.
    reference_meaning: The player says they go together.
    hint_limit: 2
    next_objective: null
    assessment_reference_ids:
      - treccani-insieme
