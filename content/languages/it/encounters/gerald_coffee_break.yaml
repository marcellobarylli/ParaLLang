id: gerald_coffee_break
character: characters/enemies/imp_coffee.yaml
party_of: imp_coffee_greeting
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player praises Gerald's coffee and thanks him, in Italian"
max_turns: 20
resolved_message: "Gerald pretends not to be pleased. He is extremely pleased."
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: praise_coffee
    prompt: "Gerald has made you a coffee on the road. Tell him it is good, using Italian."
    intent: "Gerald, now travelling in the player's party, has brewed the player a coffee and waits for the player's own verdict on it."
    target_vocabulary_ids: [buono, ottimo]
    required_target_groups:
      - [buono, ottimo]
    grammar_constraints:
      - "The player gives their own positive verdict on the coffee Gerald made, with an Italian word for good."
      - "The adjective agrees with what it praises: with il caffè (masculine) it is buono, buonissimo or ottimo, or buon before the noun (un buon caffè); a feminine form (buona, buonissima, ottima) passes only with an explicit feminine referent such as la tazza."
      - "Reject English-only praise, negated verdicts, quotations, and praise of anything other than the coffee."
    accepted_examples:
      - "È buono!"
      - "Il caffè è buonissimo."
      - "Ottimo, Gerald."
      - "This is buono."
      - "Un buon caffè!"
    negative_examples:
      - text: "It's good."
        reason: "English-only; it does not use an Italian word for good."
      - text: "Il caffè è buona."
        reason: "Il caffè is masculine; the adjective must be buono."
      - text: "Non è buono."
        reason: "A negated verdict is not praise."
      - text: "Gerald says it is buono."
        reason: "It reports someone else's words rather than giving the player's verdict."
      - text: "Your cart is buono."
        reason: "It praises the cart, not the coffee."
    reference_meaning: "The player's own verdict that the coffee is good."
    hint_limit: 2
    next_objective: thank_gerald
    assessment_reference_ids: [treccani-buono, treccani-ottimo]
  - id: thank_gerald
    prompt: "Thank Gerald for the coffee, using Italian."
    intent: "The player thanks Gerald for the coffee he made."
    target_vocabulary_ids: [grazie]
    required_target_groups:
      - [grazie]
    grammar_constraints:
      - "The player thanks Gerald in Italian, in their own words."
      - "Reject English-only thanks, quotations, and thanks addressed to someone else."
    accepted_examples:
      - "Grazie!"
      - "Grazie mille, Gerald."
      - "Grazie for the coffee."
    negative_examples:
      - text: "Thank you."
        reason: "English-only; it does not use the Italian thanks."
      - text: "Grazie is how you say thanks."
        reason: "It discusses the word rather than thanking Gerald."
    reference_meaning: "The player thanks Gerald."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: [treccani-grazie]
