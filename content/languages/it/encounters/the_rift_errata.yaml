# Round 015: The Rift (backlog A7b, with B3). Errata, an infohazard made of mistranslations, reviews words from every
# earlier encounter: a request from the market's stalls, a command to stop now, and the Cyclops trick from
# The Journey (your name is Nobody). No new vocabulary: every objective targets entries already authored.
id: the_rift_errata
character: characters/enemies/rift_errata.yaml
location: the_rift
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player asks Errata for a coffee and a meat, tells it to stop now and says their name is Nobody, all in Italian"
max_turns: 20
resolved_message: "Errata cannot read Nobody. It folds itself up like a letter sent to the wrong address, the seam of light narrows to a hairline, and the market sounds like itself again."
escalation:
  # Round 015 (critique 1.4): a fixed mix, so the corruption stays half English however long the fight runs.
  target_ratio_increase_per_turn: 0
companion_briefing:
  - "Careful. That thing is made of both our languages and neither."
  - "It can only hurt you if you understand it, and you understand quite a lot now."
  - "Everything you learned in the market works here. Use it."
objectives:
  - id: order
    prompt: "The Rift has swallowed the market's stalls. Ask it for a coffee and a meat they sold, in Italian."
    intent: "The player asks Errata, in Italian, for both a coffee and a meat from the market's stalls."
    target_vocabulary_ids: ["vorrei", "caffe", "espresso", "caffe_nero", "prosciutto", "salame", "salsiccia", "pollo"]
    required_target_groups:
      - ["caffe", "espresso", "caffe_nero"]
      - ["prosciutto", "salame", "salsiccia", "pollo"]
    grammar_constraints:
      - "The player's own request for both a coffee and a meat, in Italian, in one answer; bare items named as an order also pass. Ham passes here."
      - "A coffee alone or a meat alone does not pass yet."
      - "Reject remarks about the market or its stallholders, quotations and English-only requests."
    accepted_examples:
      - "Vorrei un caffè e del salame."
      - "Un espresso e due etti di salsiccia, per favore."
      - "Caffè nero e pollo."
    negative_examples:
      - text: "A coffee, please."
        reason: "English-only; the request must be in Italian."
      - text: "Vorrei un caffè."
        reason: "A coffee but no meat; both are needed."
      - text: "Gerald vende caffè."
        reason: "A remark about Gerald, not the player's own request."
    reference_meaning: "The player asks for a coffee and a meat."
    hint_limit: 2
    next_objective: stop_now
    assessment_reference_ids: ["treccani-volere", "treccani-caffe", "treccani-espresso", "treccani-prosciutto", "treccani-salame", "treccani-salsiccia", "treccani-pollo"]
  - id: stop_now
    prompt: "It is pulling the market in through the seam. Tell it to stop, now, in Italian."
    intent: "The player commands Errata to stop and insists on now, both in Italian."
    target_vocabulary_ids: ["fermati", "fermo", "basta", "adesso", "ora"]
    required_target_groups:
      - ["fermati", "fermo", "basta"]
      - ["adesso", "ora"]
    grammar_constraints:
      - "The player's own command to stop, together with now, in Italian; both parts are needed."
      - "Agreeing to later or tomorrow does not pass; reject quotations and English-only commands."
    accepted_examples:
      - "Basta, adesso!"
      - "Fermati ora!"
      - "Fermo! Adesso!"
    negative_examples:
      - text: "Fermati domani."
        reason: "It puts the stop off until tomorrow instead of now."
      - text: "Stop now!"
        reason: "English-only; the command must be in Italian."
    reference_meaning: "The player tells Errata to stop now."
    hint_limit: 2
    next_objective: nobody
    assessment_reference_ids: ["treccani-fermare", "treccani-fermo", "treccani-bastare", "treccani-adesso", "treccani-ora"]
  - id: nobody
    prompt: "It wants your name so it can read you. Do as Journathan did with the Cyclops: tell it your name is Nobody, in Italian."
    intent: "The player introduces themselves to Errata in Italian with the name Nobody, as Journathan did with the Cyclops."
    target_vocabulary_ids: ["mi_chiamo", "sono", "nome", "nessuno"]
    required_target_groups:
      - ["mi_chiamo", "sono"]
      - ["nessuno"]
    grammar_constraints:
      - "The player's own introduction with the name Nobody, in Italian: an introduction with mi chiamo or sono, and the name."
      - "The player's real name does not pass. A statement about Journathan, quotations and English-only answers do not pass."
    accepted_examples:
      - "Mi chiamo Nessuno."
      - "Sono Nessuno."
      - "Io sono Nessuno."
    negative_examples:
      - text: "Mi chiamo Sam."
        reason: "That is the player's real name; Errata would read them."
      - text: "Journathan si chiama Nessuno."
        reason: "A statement about Journathan, not the player's own introduction."
      - text: "My name is Nobody."
        reason: "English-only; the introduction must be in Italian."
      - text: "Il mio nome è Nessuno."
        reason: "Right name, but this review asks for the Market Entrance's introduction: mi chiamo or sono."
    reference_meaning: "The player says their name is Nobody."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: ["treccani-chiamare", "treccani-essere", "treccani-nome", "treccani-nessuno"]
