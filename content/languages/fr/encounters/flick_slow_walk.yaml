# Round 181: French version authored by Claude; it awaits a native speaker's review.
id: flick_slow_walk
character: characters/enemies/letharger_flick.yaml
party_of: cracked_fountain_letharger
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: Player gets Flick moving and keeps it beside them, in French
max_turns: 20
resolved_message: Flick moves. Now. Together with you. Historians will doubt it.
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: minutes
    prompt: 'Flick, now in your party, has sat down and wants five more minutes. Bargain: tell it how many minutes it gets, using a French number.'
    intent: Flick, now travelling in the player's party, has sat down and asks, in one English sentence, for "five more minutes". In its greeting it does not introduce itself. The player answers with how many minutes Flick gets, as a French number. Before the player names a number, Flick says no French number itself, neither five nor any other; once the player has named one, Flick may haggle back with a different French number of minutes. Flick does not say "on y va", "allons-y" or "ensemble" itself before the player has.
    target_vocabulary_ids:
      - deux
      - trois
      - quatre
      - cinq
      - six
      - sept
      - huit
      - neuf
      - dix
      - onze
      - douze
    required_target_groups:
      - - deux
        - trois
        - quatre
        - cinq
        - six
        - sept
        - huit
        - neuf
        - dix
        - onze
        - douze
    grammar_constraints:
      - The player's own offer of a number of minutes from two to twelve, with the number as a French word, alone or with the word for minutes; a tentative question or a correction (not five, two) is an offer too.
      - Agreeing to five passes; an agreement slip in the word for minutes passes, and feedback may correct it in English.
      - Reject English-only numbers, digits, numbers outside two to twelve, a number that is not an offer of minutes, refusals, quotations and talk about the word.
    accepted_examples:
      - Deux minutes !
      - Dix minutes, pas plus.
      - Trois.
      - Trois minutes ?
      - Pas cinq, deux minutes !
    negative_examples:
      - text: Two minutes.
        reason: English-only; it does not use a French number.
      - text: 2 minutes.
        reason: A digit, not the French word.
      - text: Flick dit cinq.
        reason: It reports what Flick says rather than making an offer.
      - text: Mon chapeau est neuf.
        reason: Neuf here means new; it is not an offer of minutes.
      - text: Cent minutes.
        reason: A hundred is outside two to twelve.
    reference_meaning: The player tells Flick how many minutes it gets.
    hint_limit: 2
    next_objective: lets_go
    assessment_reference_ids:
      - wiktionary-six
  - id: lets_go
    prompt: 'Flick, now in your party, has had its minutes. Get it moving: say let''s go, using French.'
    intent: Flick, now travelling in the player's party, has had its minutes, and they are up. The player must get it moving. Flick does not say "on y va", "allons-y" or "ensemble" itself before the player has.
    target_vocabulary_ids:
      - on_y_va
    required_target_groups:
      - - on_y_va
    grammar_constraints:
      - The player tells Flick in French that they are going now.
      - Reject English-only answers, refusals, and quotations.
    accepted_examples:
      - On y va !
      - Allons-y, Flick !
      - Allez, on y va maintenant.
    negative_examples:
      - text: Let's go.
        reason: English-only; it does not use the French phrase.
      - text: On n'y va pas.
        reason: It refuses to go.
      - text: Flick says on y va.
        reason: It reports someone else's words.
    reference_meaning: The player says let's go.
    hint_limit: 2
    next_objective: together
    assessment_reference_ids:
      - larousse-aller
  - id: together
    prompt: Flick wanders off again. Tell it you go together, using French.
    intent: Flick keeps drifting away; the player says they go together.
    target_vocabulary_ids:
      - ensemble
    required_target_groups:
      - - ensemble
    grammar_constraints:
      - The player says in French that they go together.
      - Reject English-only answers, refusals, and talk about the word.
    accepted_examples:
      - Ensemble.
      - On y va ensemble !
      - Ensemble, Flick.
    negative_examples:
      - text: Together.
        reason: English-only; it does not use the French word.
      - text: Pas ensemble.
        reason: It refuses to go together.
      - text: Ensemble means together.
        reason: It discusses the word rather than saying it to Flick.
    reference_meaning: The player says they go together.
    hint_limit: 2
    next_objective: null
    assessment_reference_ids:
      - larousse-ensemble
