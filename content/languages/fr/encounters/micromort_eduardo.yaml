# Micromort Mountain, the minimal version: Eduardo has sprained his ankle halfway up. The player offers help, asks how far
# it is to the top and asks whether there is a festival up there.
# Round 180: French version authored by Claude; awaits a native speaker's review.
id: micromort_eduardo
character: characters/enemies/hiker_eduardo.yaml
location: micromort_trail
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player offers Eduardo help, asks how far it is to the top and asks whether there is a festival up there, in French"
max_turns: 20
resolved_message: "Eduardo drapes an arm over your shoulder, announces that the ankle is practically a decoration, and the two of you begin the climb. Above you, faintly, someone is already singing."
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: offer_help
    prompt: "Eduardo is sitting on a rock holding his ankle, insisting that it is fine. Offer to help him, using French."
    intent: "Eduardo greets the player cheerfully from his rock, insists that the sprained ankle is perfectly fine and reports the risk of the mountain in micromorts, and plainly could use a hand, while never asking for one. He never says \"aide\" or \"aider\" (in dialogue or narration) before the player has, and he does not tell the player what to say."
    target_vocabulary_ids: [aide]
    required_target_groups:
      - [aide]
    grammar_constraints:
      - "The player offers Eduardo help, in their own words, with the French word for help (aide, or the verb aider)."
      - "Reject English-only offers, quotations, definitions of the word, and lines that report someone else's offer."
    accepted_examples:
      - "Je t'aide, Eduardo."
      - "Je peux t'aider ?"
    negative_examples:
      - text: "Can I help you, Eduardo?"
        reason: "English-only; it does not use the French word."
      - text: "Aide means help."
        reason: "It discusses the word rather than offering help."
      - text: "Eduardo says aide."
        reason: "It reports someone else's words."
    reference_meaning: "The player offers Eduardo help."
    hint_limit: 2
    next_objective: ask_top
    assessment_reference_ids: [larousse-aide]
  - id: ask_top
    prompt: "Eduardo keeps glancing up at the very top of the mountain, where the festival is. Ask him how far it is to the top, using French."
    intent: "Grateful, Eduardo explains that he is on his way to a festival at the top of the mountain, past the snow, and keeps glancing upward, estimating the distance in micromorts. He never says the French word for the top or summit (\"sommet\"), in dialogue or narration, before the player has. He does not tell the player what to say."
    target_vocabulary_ids: [sommet]
    required_target_groups:
      - [sommet]
    grammar_constraints:
      - "The player asks Eduardo how far it is to the top of the mountain, in their own words, with the French word for the top (sommet)."
      - "Reject English-only questions, quotations, and talk about the word."
    accepted_examples:
      - "C'est encore loin, le sommet, Eduardo ?"
      - "Il est comment, le sommet ?"
    negative_examples:
      - text: "How far is the top, Eduardo?"
        reason: "English-only; it does not use the French word."
      - text: "Le sommet est blanc."
        reason: "It states a fact instead of asking Eduardo how far the top is."
    reference_meaning: "The player asks Eduardo how far it is to the top."
    hint_limit: 2
    next_objective: ask_party
    assessment_reference_ids: [larousse-sommet]
  - id: ask_party
    prompt: "Eduardo says the wine festival at the top is the whole reason for the climb. Ask him whether there is a festival up there, using French."
    intent: "Eduardo lights up and describes what waits at the summit: long tables in the snow, wine, music, and a great many people who have also ignored the risk table. He never says the French word for a festival or party (\"fête\"), in dialogue or narration, before the player has. He does not tell the player what to say."
    target_vocabulary_ids: [fete]
    required_target_groups:
      - [fete]
    grammar_constraints:
      - "The player asks Eduardo whether there is a festival at the top, in their own words, with the French word for festival or party (fête)."
      - "Reject English-only questions, quotations, and talk about the word."
    accepted_examples:
      - "Il y a une fête là-haut ?"
      - "C'est quelle fête ?"
    negative_examples:
      - text: "Is there a festival up there?"
        reason: "English-only; it does not use the French word."
      - text: "La fête est belle."
        reason: "It states a fact about the festival instead of asking Eduardo."
    reference_meaning: "The player asks Eduardo whether there is a festival at the top."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: [larousse-fete]
