# Round 181: French version authored by Claude; awaits a native speaker's review.
id: gerald_coffee_break
character: characters/enemies/imp_coffee.yaml
party_of: imp_coffee_greeting
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player praises Gerald's coffee and thanks him, in French"
max_turns: 20
resolved_message: "Gerald pretends not to be pleased. He is extremely pleased."
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: praise_coffee
    prompt: "Gerald has made you a coffee on the road. Tell him it is good, using French."
    intent: "Gerald, now travelling in the player's party, has brewed the player a coffee and waits for the player's own verdict on it."
    target_vocabulary_ids: [bon, excellent]
    required_target_groups:
      - [bon, excellent]
    grammar_constraints:
      - "The player gives their own positive verdict on the coffee Gerald made, with a French word for good."
      - "The adjective agrees with what it praises: with le café (masculine) it is bon, très bon or excellent, also before the noun (un bon café, un excellent café), and after c'est it is always bon (c'est bon, c'est très bon); a feminine form (bonne, très bonne, excellente) passes only with an explicit feminine referent such as la tasse."
      - "Reject English-only praise, negated verdicts (with or without ne: ce n'est pas bon, c'est pas bon), quotations, and praise of anything other than the coffee."
    accepted_examples:
      - "C'est bon!"
      - "Le café est très bon."
      - "Excellent, Gerald."
      - "This is bon."
      - "Un bon café!"
    negative_examples:
      - text: "It's good."
        reason: "English-only; it does not use a French word for good."
      - text: "Le café est bonne."
        reason: "Le café is masculine; the adjective must be bon."
      - text: "C'est pas bon."
        reason: "A negated verdict is not praise."
      - text: "Gerald says it is bon."
        reason: "It reports someone else's words rather than giving the player's verdict."
      - text: "Your cart is bon."
        reason: "It praises the cart, not the coffee."
    reference_meaning: "The player's own verdict that the coffee is good."
    hint_limit: 2
    next_objective: thank_gerald
    assessment_reference_ids: [larousse-bon, larousse-excellent]
  - id: thank_gerald
    prompt: "Thank Gerald for the coffee, using French."
    intent: "The player thanks Gerald for the coffee he made."
    target_vocabulary_ids: [merci]
    required_target_groups:
      - [merci]
    grammar_constraints:
      - "The player thanks Gerald in French, in their own words."
      - "Reject English-only thanks, quotations, and thanks addressed to someone else."
    accepted_examples:
      - "Merci!"
      - "Merci beaucoup, Gerald."
      - "Merci for the coffee."
    negative_examples:
      - text: "Thank you."
        reason: "English-only; it does not use the French thanks."
      - text: "Merci is how you say thanks."
        reason: "It discusses the word rather than thanking Gerald."
    reference_meaning: "The player thanks Gerald."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: [larousse-merci]
