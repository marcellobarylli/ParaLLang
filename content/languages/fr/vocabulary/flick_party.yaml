  - id: on_y_va
    kind: phrase
    target: on y va
    part_of_speech: phrase
    accepted_translations:
      - let's go
      - we're going
      - here we go
    surface_variants:
      - on y va
      - allons-y
      - allons y
    accent_insensitive: false
    example:
      target: On y va, au marché !
      english: Let's go to the market!
    note: 'From aller, to go: on y va (everyday) and allons-y (a little more formal) both mean "let''s go". On y va ? also asks "shall we go?".'
    reference_ids:
      - larousse-aller
      - wiktionary-on-y-va
