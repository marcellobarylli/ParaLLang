entries:
  - id: j_aime
    kind: phrase
    target: j'aime
    part_of_speech: phrase
    accepted_translations:
      - I like it
      - I like
      - I love it
    surface_variants:
      - j'aime
      - ça me plaît
    accent_insensitive: false
    example:
      target: J'aime le jambon.
      english: I like ham.
    note: 'J''aime bien: I like it (aimer bien is milder than aimer). Ça me plaît, literally "it pleases me", says the same of one thing.'
    reference_ids:
      - larousse-aimer
      - larousse-plaire
  - id: encore
    kind: word
    target: encore
    part_of_speech: adverb
    accepted_translations:
      - more
      - again
      - some more
    surface_variants:
      - encore
      - encore un peu
    accent_insensitive: false
    example:
      target: Encore un peu, s'il te plaît.
      english: A little more, please.
    note: 'Encore un peu: a little more. Encore also means still and again; pas encore is not yet.'
    reference_ids:
      - larousse-encore
