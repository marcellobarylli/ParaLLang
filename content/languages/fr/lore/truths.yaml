# Round 180: French version authored by Claude; awaits a native speaker's review.
# Round 158 (issue #4): the untranslatable texts of the French pack. Deep truths about the world exist only in the
# language being learned: these sentences are set into the narrator's written passages (content/narration/
# passages.yaml, as {truth:<id>}) in a colour of their own, and nothing in the game translates them. There is no
# English here on purpose: the server cannot send what it does not hold. What each one says, for the owner, is in
# parallang_obsidian/Understood Later.md.
#
#   id      the name a passage uses
#   level   how hard the language is (the stage of the curriculum at which a learner can read it)
#   text    the sentence, in French only
#
# The texts follow docs/lore-book.md, "What the book does not say". The deeper the truth, the harder the language.
truths:
  - id: wake_of_a_stitch
    level: A2
    text: "Reviens en arrière ! Au-delà gît le sillage d'un point."
  - id: not_a_road
    level: A1
    text: "La route n'est pas une route."
  - id: a_thread_passes
    level: A1
    text: "Ici passe un fil."
  - id: every_place_a_knot
    level: A1
    text: "Chaque lieu est un nœud."
  - id: walked_on_a_web
    level: A2
    text: "Tu n'as pas marché sur une route. Tu as marché sur une toile."
  - id: a_word_a_stitch
    level: A2
    text: "Qui apprend un mot fait un point."
  - id: sewn_not_built
    level: B1
    text: "Les routes ne furent pas construites : elles furent cousues."
  - id: sewn_to_another
    level: B1
    text: "La toile ne finit pas là où finit le monde : elle est cousue à une autre."
  - id: roots_and_roads
    level: B1
    text: "Là où tu vois une racine, il y avait autrefois une route ; là où tu vois une route, il y aura un jour une racine."
  - id: all_the_threads
    level: B1
    text: "Si tous les fils se tendaient ensemble, les deux mondes se toucheraient, et plus aucun mot n'aurait de sens."
  # Round 159 (issue #7): what three characters of the dead branch utter once the conversation is over (the
  # `revelation` of their encounters). They know more than the road's signs say.
  - id: journey_threads
    level: B1
    text: "Chaque traversée laisse un fil. Vingt ans de traversées font vingt ans de fils : ce sont les plus anciens de la toile, et ils la tiennent encore."
  - id: inflection
    level: B2
    text: "Quand la plus grande partie du monde sera racontée dans l'autre langue, le ramener en arrière sera comme écoper avec une tasse un navire qui sombre."
  - id: first_word_error
    level: B2
    text: "Au commencement était la Parole, et dans la Parole il y avait une erreur. Qui la corrigera aura raison, et ce sera la fin."
