# Authored, not generated. Pending a native speaker's review.
inscriptions:
  - id: keystone
    location: market_entrance
    where: "Carved on the keystone of the archway, half worn away by people looking up."
    text: "Qui entre prend la voix de la branche où il se trouve. Qui sort, s'il sort, en emporte des traces sous les ongles."
    translation: "Whoever enters takes on the voice of the branch they stand in. Whoever leaves, if they leave, takes some of it away under their fingernails."
    glossary:
      - { word: "qui", meaning: "whoever" }
      - { word: "prend la voix", meaning: "takes on the voice" }
      - { word: "branche", meaning: "branch" }
      - { word: "en emporte", meaning: "takes some of it away" }
      - { word: "ongles", meaning: "fingernails" }
  - id: menu_board
    location: coffee_cart
    where: "Chalked in a corner of the menu board, the one line nobody ever wipes off."
    text: "Les boissons d'hier seront servies le mois dernier. Nous nous excusons pour la gêne temporelle."
    translation: "Yesterday's orders will be served last month. We apologise for the temporal inconvenience."
    glossary:
      - { word: "boissons", meaning: "drinks; here the orders" }
      - { word: "hier", meaning: "yesterday" }
      - { word: "seront servies", meaning: "will be served" }
      - { word: "le mois dernier", meaning: "last month" }
      - { word: "nous nous excusons", meaning: "we apologise" }
      - { word: "gêne", meaning: "inconvenience" }
  - id: chopping_block
    location: butchers_stall
    where: "Burned into the chopping block, under a century of knife marks."
    text: "À cet étal, chaque chose se pèse, même les excuses. Il n'existe aucune excuse qui ait jamais pesé ce qu'elle prétendait."
    translation: "Everything is weighed at this stall, even excuses. There is no excuse that ever weighed what it claimed."
    glossary:
      - { word: "se pèse", meaning: "is weighed" }
      - { word: "il n'existe aucune", meaning: "there is no" }
      - { word: "même", meaning: "even" }
      - { word: "excuses", meaning: "excuses, apologies" }
      - { word: "étal", meaning: "stall, counter" }
      - { word: "prétendait", meaning: "it claimed" }
  - id: plaque_back
    location: cracked_fountain
    where: "On the back of the brass plaque, in letters someone has tried to file away."
    text: "On déconseille de lire jusqu'au bout. Le refrain débute là où s'achève la phrase, et la phrase ne s'achève jamais."
    translation: "Reading to the end is not advised. The refrain begins where the sentence ends, and the sentence never ends."
    glossary:
      - { word: "on déconseille", meaning: "it is not advised" }
      - { word: "jusqu'au bout", meaning: "to the end" }
      - { word: "refrain", meaning: "refrain" }
      - { word: "phrase", meaning: "sentence" }
      - { word: "ne s'achève jamais", meaning: "never ends" }
  - id: flyleaf
    location: old_bookshop
    where: "Pencilled on the flyleaf of a book that will not let itself be opened."
    text: "Chaque ouvrage de cette boutique a été écrit par qui l'a lu en dernier. Rendez-le soigneusement : on pourrait s'y trouver."
    translation: "Every book in this shop was written by whoever read it last. Return it with care: you may be inside it."
    glossary:
      - { word: "boutique", meaning: "shop" }
      - { word: "en dernier", meaning: "last" }
      - { word: "rendez-le", meaning: "give it back" }
      - { word: "on pourrait s'y trouver", meaning: "you may be inside it" }
  - id: seam
    location: the_rift
    where: "Stitched along the seam of light, in thread that hums when you lean close."
    text: "Ici la branche a péri, et pourtant ses racines continuent de parler. Les écouter jusqu'à comprendre, puis se boucher les oreilles."
    translation: "Here the branch is dead, yet its roots keep talking. Listen until you understand, then cover your ears."
    glossary:
      - { word: "pourtant", meaning: "and yet" }
      - { word: "racines", meaning: "roots" }
      - { word: "les écouter", meaning: "listen to them" }
      - { word: "jusqu'à comprendre", meaning: "until you understand" }
      - { word: "se boucher les oreilles", meaning: "cover your ears" }
