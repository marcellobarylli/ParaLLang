# Round 144: the words of curriculum stage A1.2 (the skeleton is content/curriculum/02_a1_2.yaml). The Italian
# original was authored by Claude from the functions of the A1 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. The vocabulary shares one namespace with the earlier stages: an id
# defined in 01_a1_1.yaml is reused here, never redefined, and no new entry repeats an earlier entry's form.
# Round 180: the French version, authored by Claude from the Italian file; it awaits a native speaker's review.
stage: a1_2
version: curriculum-a1-2-fr-v1
grammar:
  family: "avoir (j'ai, tu as, il a); mon, ma, mes, ton, ta, tes (mon amie before a vowel); adjectives that agree (grand, grande; gentil, gentille)."
  places: "il y a and il n'y a pas de; le, la, l' with places in town; à côté de, en face de, devant, derrière, entre, with de + article (du, de la, des)."
  directions: "The imperative for directions (tourne, va; with vous: tournez, allez); aller (je vais, tu vas, il va) and à + le = au; en train, en bus, à pied."
  time: "Quelle heure est-il ? Il est ... heures (il est une heure, il est midi); à with hours; aujourd'hui, demain and the days of the week, with le for every week (le lundi)."
  routine: "The present of -er verbs and of a few others (je lis, je dors, je sors); pronominal verbs (je me réveille, je me lève); toujours, souvent, and ne ... jamais."
  shopping: "celui-ci and celui-là; colours that agree (vert, verte) and ones that only take -s (rouge, jaune); le, la, les before the verb (je le prends)."
lessons:
  family_who:
    siblings: { say: [frere, soeur, fils], examples: ["J'ai un frère.", "J'ai deux sœurs.", "Je n'ai pas d'enfants."] }
    parents: { say: [ma_mere, mon_pere], examples: ["Ma mère s'appelle Anne.", "Mon père s'appelle Paul."] }
    ask_family: { say: [tu_as_des_freres], examples: ["Tu as des frères et sœurs ?", "Vous avez des enfants ?"] }
  family_describe:
    ask_like: { say: [comment_est], examples: ["Comment est ta sœur ?", "Ils sont comment, tes frères ?"] }
    looks: { say: [grand, petit, jeune, age], examples: ["Mon frère est grand.", "Ma mère est petite.", "Mon père est âgé."] }
    character: { say: [sympa, gentil, drole], examples: ["Elle est très sympa.", "Il est gentil et drôle."] }
  family_friend:
    my_friend: { say: [ami], examples: ["J'ai un ami qui s'appelle Luc.", "Mon amie s'appelle Sarah."] }
    friend_lives: { say: [habite], examples: ["Il habite à Paris.", "Mon ami vit à Londres."] }
    together: { say: [ensemble], examples: ["On étudie ensemble.", "Nous mangeons souvent ensemble."] }
  places_where:
    looking_for: { say: [[je_cherche], [gare, banque, pharmacie, place, supermarche]], examples: ["Je cherche la gare.", "Je cherche une pharmacie."] }
    where_is: { say: [[ou_est], [gare, banque, pharmacie, place, supermarche]], examples: ["Où est la banque ?", "Excusez-moi, où est la gare ?"] }
    near: { say: [pres_d_ici, pres, loin], examples: ["C'est près d'ici ?", "C'est loin ?"] }
  places_there:
    is_there: { say: [[il_y_a], [gare, banque, pharmacie, place, supermarche]], examples: ["Il y a une banque près d'ici ?", "Il y a un supermarché ?"] }
    in_my_town: { say: [il_y_a], examples: ["Dans ma ville, il y a une grande place.", "Il y a deux pharmacies."] }
    none: { say: [il_n_y_a_pas], examples: ["Il n'y a pas de gare.", "Il n'y a pas de supermarché."] }
  places_next_to:
    next_to: { say: [a_cote_de], examples: ["La banque est à côté de la pharmacie.", "Le café est à côté du supermarché."] }
    front_behind: { say: [devant, derriere], examples: ["La pharmacie est devant la gare.", "C'est derrière la banque."] }
    between: { say: [entre], examples: ["C'est entre la banque et la pharmacie."] }
  directions_ask:
    lost: { say: [je_suis_perdu], examples: ["Je suis perdu.", "Excusez-moi, je suis perdue."] }
    how_to_get: { say: [pour_aller], examples: ["Pour aller à la gare, s'il vous plaît ?", "Excusez-moi, comment on va au centre ?"] }
    right_road: { say: [chemin], examples: ["C'est le bon chemin ?", "C'est bien la route de la gare ?"] }
  directions_turn:
    turn: { say: [[tourne], [a_gauche, a_droite]], examples: ["Tourne à gauche.", "Tournez à droite, s'il vous plaît."] }
    straight: { say: [tout_droit], examples: ["Va tout droit.", "Allez tout droit."] }
    which_street: { say: [la_premiere], examples: ["Prends la première à droite.", "C'est la deuxième rue à gauche."] }
  directions_transport:
    ticket: { say: [billet], examples: ["Un billet pour Lyon, s'il vous plaît.", "Je voudrais deux billets pour Paris."] }
    by_what: { say: [en_train, en_bus, a_pied], examples: ["J'y vais en train.", "J'y vais à pied.", "Je prends le bus."] }
    how_long: { say: [combien_de_temps, a_quelle_distance], examples: ["Combien de temps en train ?", "La gare est à quelle distance ?"] }
  time_clock:
    what_time: { say: [quelle_heure_est_il], examples: ["Quelle heure est-il ?", "Excusez-moi, vous avez l'heure ?"] }
    tell_time: { say: [heures], examples: ["Il est trois heures.", "Il est dix heures.", "Il est une heure."] }
    half_quarter: { say: [et_demie, et_quart], examples: ["Il est deux heures et demie.", "Il est six heures et quart."] }
  time_days:
    what_day: { say: [on_est_quel_jour], examples: ["On est quel jour aujourd'hui ?", "Quel jour sommes-nous ?"] }
    today_is: { say: [[aujourd_hui], [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]], examples: ["Aujourd'hui, c'est lundi.", "Aujourd'hui, on est samedi."] }
    tomorrow: { say: [[demain], [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]], examples: ["Demain, c'est mardi.", "Demain, on est dimanche."] }
  time_when:
    at_what_time: { say: [a_quelle_heure], examples: ["À quelle heure ça ouvre ?", "À quelle heure part le train ?"] }
    at_hour: { say: [a_heure], examples: ["Je rentre à huit heures.", "À neuf heures.", "À midi."] }
    part_of_day: { say: [le_matin, l_apres_midi, le_soir], examples: ["Le matin.", "À huit heures du soir.", "L'après-midi."] }
  routine_day:
    wake: { say: [je_me_reveille, je_me_leve], examples: ["Je me réveille à sept heures.", "Je me lève à huit heures."] }
    work: { say: [je_travaille, j_etudie], examples: ["Je travaille dans un bureau.", "J'étudie à l'université."] }
    evening: { say: [je_dine, je_me_couche, je_dors], examples: ["Je dîne à huit heures.", "Je me couche à dix heures.", "Je dors huit heures."] }
  routine_often:
    always: { say: [toujours, souvent], examples: ["Je bois toujours un café.", "Je vais souvent au cinéma."] }
    never: { say: [jamais], examples: ["Je ne bois jamais de bière.", "Je ne regarde jamais la télé."] }
    sometimes: { say: [parfois, tous_les_jours], examples: ["Parfois, je fais la cuisine.", "Je travaille tous les jours."] }
  routine_free:
    ask_free: { say: [temps_libre, qu_est_ce_que_tu_fais], examples: ["Qu'est-ce que tu fais pendant ton temps libre ?", "Que faites-vous pendant votre temps libre ?"] }
    free_time: { say: [je_lis, je_regarde, j_ecoute, je_joue, je_sors], examples: ["Je lis beaucoup.", "Je regarde un film ou j'écoute de la musique.", "Je joue au foot."] }
    weekend: { say: [le_week_end], examples: ["Le week-end, je sors avec des amis.", "Le week-end, je dors beaucoup."] }
  shopping_ask:
    looking_for: { say: [chemise, chaussures, veste, chapeau], examples: ["Je cherche une chemise.", "Je voudrais une paire de chaussures."] }
    colour: { say: [rouge, bleu, vert, noir, blanc, jaune], examples: ["Je voudrais une chemise blanche.", "En noir, s'il vous plaît."] }
    other_colour: { say: [une_autre_couleur, vous_avez], examples: ["Vous avez une autre couleur ?", "Vous l'avez en vert ?"] }
  shopping_try:
    try_on: { say: [je_peux_essayer], examples: ["Je peux l'essayer ?", "Je peux essayer cette veste ?"] }
    wrong_size: { say: [trop_grand, trop_petit], examples: ["C'est trop grand.", "Elle est trop petite."] }
    take_it: { say: [je_le_prends], examples: ["D'accord, je le prends.", "Je la prends."] }
  shopping_this:
    this_that: { say: [celui_ci, celui_la], examples: ["Je voudrais celui-ci.", "Celle-là, s'il vous plaît."] }
    size: { say: [taille], examples: ["C'est quelle taille ?", "Je fais la taille M."] }
    bigger: { say: [plus_grand, plus_petit], examples: ["Vous avez une taille plus grande ?", "Vous en avez un plus petit ?"] }
vocabulary:
  # family
  frere: { t: "frère", pos: noun, en: ["brother"], forms: ["frère", "frères"], ex: ["J'ai un frère à Nantes.", "I have a brother in Nantes."] }
  soeur: { t: "sœur", pos: noun, en: ["sister"], forms: ["sœur", "sœurs"], ex: ["Ma sœur s'appelle Hélène.", "My sister is called Hélène."], n: "Typed soeur, it is the same word." }
  fils: { t: "fils", pos: noun, en: ["son", "child"], forms: ["fils", "fille", "filles", "enfant", "enfants"], ex: ["J'ai un fils et une fille.", "I have a son and a daughter."], n: "'Fille' is a daughter (or a girl); 'enfants' is children. Fils sounds like 'feess'." }
  ma_mere: { t: "ma mère", pos: phrase, en: ["my mother"], forms: ["ma mère", "maman", "ma maman"], ex: ["Ma mère est de Bordeaux.", "My mother is from Bordeaux."] }
  mon_pere: { t: "mon père", pos: phrase, en: ["my father"], forms: ["mon père", "papa", "mon papa"], ex: ["Mon père a soixante ans.", "My father is sixty."] }
  tu_as_des_freres: { t: "tu as des frères", pos: phrase, en: ["do you have brothers", "do you have any brothers or sisters"], forms: ["tu as des frères", "as-tu des frères", "as tu des frères", "vous avez des frères", "avez-vous des frères", "avez vous des frères", "tu as des sœurs", "vous avez des sœurs", "tu as des enfants", "as-tu des enfants", "vous avez des enfants", "avez-vous des enfants", "avez vous des enfants"], ex: ["Tu as des frères et sœurs ?", "Do you have brothers and sisters?"] }
  comment_est: { t: "comment est", pos: phrase, en: ["what is he like", "what is she like", "what is it like"], forms: ["comment est", "comment sont", "il est comment", "elle est comment", "ils sont comment", "elles sont comment"], ex: ["Comment est ton frère ?", "What is your brother like?"] }
  grand: { t: "grand", pos: adjective, en: ["tall", "big"], forms: ["grand", "grande", "grands", "grandes"], ex: ["Ma sœur est très grande.", "My sister is very tall."] }
  petit: { t: "petit", pos: adjective, en: ["short", "small"], forms: ["petit", "petite", "petits", "petites"], ex: ["Mon père est petit.", "My father is short."] }
  jeune: { t: "jeune", pos: adjective, en: ["young"], forms: ["jeune", "jeunes"], ex: ["Ma mère est encore jeune.", "My mother is still young."] }
  age: { t: "âgé", pos: adjective, en: ["old", "elderly"], forms: ["âgé", "âgée", "âgés", "âgées", "vieux", "vieille"], ex: ["Mon grand-père est âgé.", "My grandfather is old."], n: "Of a person, 'âgé' is kinder than 'vieux'." }
  sympa: { t: "sympa", pos: adjective, en: ["nice", "likeable"], forms: ["sympa", "sympas", "sympathique", "sympathiques"], ex: ["Ton frère est sympa.", "Your brother is nice."], n: "Sympa is short for sympathique and very common." }
  gentil: { t: "gentil", pos: adjective, en: ["kind"], forms: ["gentil", "gentille", "gentils", "gentilles"], ex: ["C'est une personne gentille.", "He is a kind person."] }
  drole: { t: "drôle", pos: adjective, en: ["funny", "fun"], forms: ["drôle", "drôles", "marrant", "marrante"], ex: ["Ma sœur est drôle.", "My sister is funny."] }
  ami: { t: "ami", pos: noun, en: ["friend"], forms: ["ami", "amie", "amis", "amies", "copain", "copine"], ex: ["Luc est un ami.", "Luc is a friend of mine."], n: "Before a vowel, mon even with a woman: mon amie." }
  habite: { t: "habite", pos: verb, en: ["he lives", "she lives"], forms: ["habite", "habitent", "vit", "vivent"], ex: ["Mon amie habite à Lille.", "My friend lives in Lille."] }
  ensemble: { t: "ensemble", pos: adverb, en: ["together"], ex: ["On mange ensemble.", "We eat together."], n: "On is the everyday 'we': on mange, 'we eat'." }
  # places
  je_cherche: { t: "je cherche", pos: verb, en: ["I am looking for", "I look for"], ex: ["Je cherche une banque.", "I am looking for a bank."] }
  gare: { t: "gare", pos: noun, en: ["station", "railway station"], forms: ["gare", "gares"], ex: ["La gare est loin.", "The station is far."] }
  banque: { t: "banque", pos: noun, en: ["bank"], forms: ["banque", "banques"], ex: ["La banque ouvre à neuf heures.", "The bank opens at nine."] }
  pharmacie: { t: "pharmacie", pos: noun, en: ["pharmacy", "chemist's"], forms: ["pharmacie", "pharmacies"], ex: ["Je cherche une pharmacie.", "I am looking for a pharmacy."], n: "Look for the green cross." }
  place: { t: "place", pos: noun, en: ["square"], forms: ["place", "places"], ex: ["La place est très belle.", "The square is very beautiful."] }
  supermarche: { t: "supermarché", pos: noun, en: ["supermarket"], forms: ["supermarché", "supermarchés"], ex: ["Le supermarché est ouvert.", "The supermarket is open."] }
  ou_est: { t: "où est", pos: phrase, en: ["where is"], forms: ["où est", "où sont", "où se trouve", "où se trouvent", "c'est où"], ex: ["Où est la pharmacie ?", "Where is the pharmacy?"], n: "With a plural: où sont les chaussures ?" }
  pres_d_ici: { t: "près d'ici", pos: phrase, en: ["near here", "nearby"], forms: ["près d'ici", "pas loin d'ici", "pas loin", "dans le coin"], ex: ["Il y a un café près d'ici ?", "Is there a café near here?"] }
  il_y_a: { t: "il y a", pos: phrase, en: ["there is", "there are", "is there"], forms: ["il y a", "est-ce qu'il y a", "est ce qu'il y a", "y a-t-il", "y a t il"], ex: ["Il y a une pharmacie sur la place.", "There is a pharmacy in the square."], n: "One form for one thing or several: il y a deux banques." }
  il_n_y_a_pas: { t: "il n'y a pas", pos: phrase, en: ["there is no", "there isn't"], forms: ["il n'y a pas", "il y a pas", "y a pas"], ex: ["Ici, il n'y a pas de banque.", "There is no bank here."], n: "After the negative, un and une become de: il n'y a pas de gare." }
  a_cote_de: { t: "à côté de", pos: phrase, en: ["next to", "beside"], forms: ["à côté de", "à côté du", "à côté des", "à côté"], ex: ["La banque est à côté du café.", "The bank is next to the café."], n: "De joins the article: à côté du café, à côté des magasins." }
  devant: { t: "devant", pos: preposition, en: ["in front of", "opposite"], forms: ["devant", "en face de", "en face du", "en face"], ex: ["Je suis devant la gare.", "I am in front of the station."], n: "'En face de' is opposite." }
  derriere: { t: "derrière", pos: preposition, en: ["behind"], ex: ["Le supermarché est derrière la place.", "The supermarket is behind the square."] }
  entre: { t: "entre", pos: preposition, en: ["between"], ex: ["Le café est entre la banque et la gare.", "The café is between the bank and the station."] }
  # directions
  je_suis_perdu: { t: "je suis perdu", pos: phrase, en: ["I am lost", "I got lost"], forms: ["je suis perdu", "je suis perdue", "je me suis perdu", "je me suis perdue"], ex: ["Excusez-moi, je suis perdu.", "Excuse me, I am lost."], n: "A woman says perdue; it sounds the same." }
  pour_aller: { t: "pour aller", pos: phrase, en: ["how do I get to", "to get to"], forms: ["pour aller", "comment aller", "comment on va", "comment je vais", "comment est-ce que je vais", "comment est ce que je vais", "comment est-ce qu'on va", "comment est ce qu'on va"], ex: ["Pour aller sur la place, s'il vous plaît ?", "How do I get to the square, please?"], n: "'Pour aller à ..., s'il vous plaît ?' is the classic way to ask." }
  chemin: { t: "chemin", pos: noun, en: ["way", "road", "path"], forms: ["chemin", "le bon chemin", "route", "la bonne route"], ex: ["C'est le chemin du centre.", "It is the way to the centre."] }
  tourne: { t: "tourne", pos: verb, en: ["turn"], forms: ["tourne", "tournez", "tu tournes", "vous tournez"], ex: ["Tourne à droite après la banque.", "Turn right after the bank."], n: "'Tourne' to a friend, 'tournez' to a stranger." }
  a_gauche: { t: "à gauche", pos: phrase, en: ["left", "on the left", "to the left"], forms: ["à gauche", "gauche"], ex: ["La pharmacie est à gauche.", "The pharmacy is on the left."] }
  a_droite: { t: "à droite", pos: phrase, en: ["right", "on the right", "to the right"], forms: ["à droite", "droite"], ex: ["Le café est à droite.", "The café is on the right."] }
  tout_droit: { t: "tout droit", pos: phrase, en: ["straight on", "straight ahead"], ex: ["Allez tout droit jusqu'à la place.", "Go straight on as far as the square."] }
  la_premiere: { t: "la première", pos: phrase, en: ["the first", "the first one"], forms: ["la première", "la deuxième", "la seconde", "la troisième", "la première rue", "la deuxième rue", "la troisième rue"], ex: ["Prenez la première à gauche.", "Take the first on the left."], n: "La première, la deuxième, la troisième: the first, second and third street." }
  billet: { t: "billet", pos: noun, en: ["ticket"], forms: ["billet", "billets", "un ticket"], ex: ["Un billet pour Marseille.", "A ticket to Marseille."], n: "A train ticket is un billet; a bus or metro ticket, un ticket." }
  en_train: { t: "en train", pos: phrase, en: ["by train"], forms: ["en train", "le train", "par le train"], ex: ["Je vais à Lyon en train.", "I am going to Lyon by train."] }
  en_bus: { t: "en bus", pos: phrase, en: ["by bus"], forms: ["en bus", "le bus", "en autobus", "autobus", "en car"], ex: ["Je vais au travail en bus.", "I go to work by bus."], n: "Un car is a coach between towns." }
  a_pied: { t: "à pied", pos: phrase, en: ["on foot"], ex: ["Je vais au centre à pied.", "I am going to the centre on foot."] }
  combien_de_temps: { t: "combien de temps", pos: phrase, en: ["how long does it take", "how long"], forms: ["combien de temps", "il faut combien de temps", "ça prend combien de temps"], ex: ["Il faut combien de temps à pied ?", "How long does it take on foot?"] }
  a_quelle_distance: { t: "à quelle distance", pos: phrase, en: ["how far is it", "how far is"], forms: ["à quelle distance", "c'est à quelle distance"], ex: ["Le centre est à quelle distance ?", "How far is the centre?"] }
  # time
  quelle_heure_est_il: { t: "quelle heure est-il", pos: phrase, en: ["what time is it"], forms: ["quelle heure est-il", "quelle heure est il", "il est quelle heure", "vous avez l'heure", "tu as l'heure"], ex: ["Excusez-moi, quelle heure est-il ?", "Excuse me, what time is it?"] }
  heures: { t: "heures", pos: noun, en: ["o'clock", "hours"], forms: ["heures", "heure", "midi", "minuit"], ex: ["Il est quatre heures.", "It is four o'clock."], n: "Il est une heure, il est deux heures; il est midi, il est minuit." }
  et_demie: { t: "et demie", pos: phrase, en: ["half past"], forms: ["et demie", "et demi"], ex: ["Il est sept heures et demie.", "It is half past seven."], n: "After midi and minuit: midi et demi." }
  et_quart: { t: "et quart", pos: phrase, en: ["a quarter past"], forms: ["et quart", "moins le quart", "moins quart"], ex: ["Il est neuf heures et quart.", "It is a quarter past nine."], n: "'Moins le quart' is a quarter to." }
  on_est_quel_jour: { t: "on est quel jour", pos: phrase, en: ["what day is it"], forms: ["on est quel jour", "quel jour on est", "quel jour sommes-nous", "quel jour sommes nous", "c'est quel jour", "quel jour est-ce"], ex: ["On est quel jour aujourd'hui ?", "What day is it today?"] }
  lundi: { t: "lundi", pos: noun, en: ["Monday"], ex: ["Aujourd'hui, c'est lundi.", "Today is Monday."] }
  mardi: { t: "mardi", pos: noun, en: ["Tuesday"], ex: ["Mardi, je travaille.", "On Tuesday I work."] }
  mercredi: { t: "mercredi", pos: noun, en: ["Wednesday"], ex: ["Demain, c'est mercredi.", "Tomorrow is Wednesday."] }
  jeudi: { t: "jeudi", pos: noun, en: ["Thursday"], ex: ["Le jeudi, j'étudie.", "On Thursdays I study."] }
  vendredi: { t: "vendredi", pos: noun, en: ["Friday"], ex: ["Vendredi, je sors.", "On Friday I am going out."] }
  samedi: { t: "samedi", pos: noun, en: ["Saturday"], ex: ["Samedi, je dors.", "On Saturday I sleep."] }
  dimanche: { t: "dimanche", pos: noun, en: ["Sunday"], ex: ["Le dimanche, je ne travaille pas.", "On Sundays I don't work."] }
  aujourd_hui: { t: "aujourd'hui", pos: adverb, en: ["today"], ex: ["Aujourd'hui, c'est vendredi.", "Today is Friday."] }
  demain: { t: "demain", pos: adverb, en: ["tomorrow"], ex: ["Demain, c'est samedi.", "Tomorrow is Saturday."] }
  a_quelle_heure: { t: "à quelle heure", pos: phrase, en: ["at what time", "what time"], ex: ["À quelle heure ferme la banque ?", "What time does the bank close?"] }
  # Round 180: "à" alone would also match the verb a (il a) and English "a"; the hour is part of the form.
  a_heure: { t: "à huit heures", pos: phrase, en: ["at eight", "at ... o'clock"], forms: ["à une heure", "à deux heures", "à trois heures", "à quatre heures", "à cinq heures", "à six heures", "à sept heures", "à huit heures", "à neuf heures", "à dix heures", "à onze heures", "à douze heures", "à midi", "à minuit"], ex: ["Le train part à six heures.", "The train leaves at six."], n: "'At' with an hour: à deux heures, à midi." }
  le_matin: { t: "le matin", pos: phrase, en: ["in the morning"], forms: ["le matin", "du matin", "ce matin", "matin"], ex: ["Je travaille le matin.", "I work in the morning."] }
  l_apres_midi: { t: "l'après-midi", pos: phrase, en: ["in the afternoon"], forms: ["l'après-midi", "après-midi", "après midi", "de l'après-midi", "cet après-midi"], ex: ["J'étudie l'après-midi.", "I study in the afternoon."] }
  le_soir: { t: "le soir", pos: phrase, en: ["in the evening"], forms: ["le soir", "du soir", "ce soir", "soir"], ex: ["Je sors le soir.", "I go out in the evening."] }
  # routine
