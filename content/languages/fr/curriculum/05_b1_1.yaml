stage: b1_1
version: curriculum-b1-1-fr-v1
grammar:
  opinions: "à mon avis + indicative; je pense que and je crois que also take the indicative (je pense que c'est vrai), but in the negative they take the subjonctif (je ne pense pas que ce soit vrai); je suis d'accord, je ne suis pas d'accord; parce que, c'est pour ça que, par exemple."
  advice: "Conditionnel of devoir and pouvoir: tu devrais, vous devriez, tu pourrais, vous pourriez; à ta place + conditionnel (à ta place, je parlerais avec lui); je te conseille de + infinitive."
  stories: "Imparfait for the scene (j'étais, j'étais en train de lire, il pleuvait) against passé composé for the events (j'ai vu, je suis rentré); pendant que, tout à coup, ensuite, finalement."
  problems: "Passé composé for what went wrong (j'ai perdu, j'ai oublié, j'ai raté le train); with a pronoun before avoir the participle agrees with the thing (ma valise, je l'ai laissée); il y a une erreur; qu'est-ce que je peux faire ?"
  feelings: "être and se sentir with adjectives that agree (je suis content, je suis inquiète); the negative imperative (ne t'inquiète pas, ne vous inquiétez pas)."
  polite_requests: "Conditionnel présent: pourriez-vous, ça vous dérangerait de, tu me prêterais, j'aimerais, je préférerais, ce serait."
lessons:
