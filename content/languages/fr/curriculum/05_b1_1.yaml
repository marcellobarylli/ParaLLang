  qu_en_penses_tu: { t: "qu'en penses-tu", pos: phrase, en: ["what do you think", "what do you think of it"], forms: ["qu'en penses-tu", "qu'en penses tu", "qu'est-ce que tu en penses", "tu en penses quoi", "t'en penses quoi", "qu'en pensez-vous", "qu'en pensez vous", "qu'est-ce que vous en pensez", "vous en pensez quoi", "qu'est-ce que tu penses", "qu'est-ce que vous pensez", "à ton avis", "à votre avis", "selon toi", "selon vous"], ex: ["Et toi, qu'en penses-tu ?", "And you, what do you think?"] }
  ca_depend: { t: "ça dépend", pos: verb, en: ["it depends"], forms: ["ça dépend", "cela dépend", "je ne suis pas sûr", "je ne suis pas sûre", "je suis pas sûr", "je suis pas sûre", "je ne sais pas trop", "je sais pas trop"], ex: ["Ça dépend du temps.", "It depends on the weather."], n: "'Je ne suis pas sûr' is 'I am not sure'." }
