# Round 180: the French version, authored by Claude from the Italian file; it awaits a native speaker's review.
stage: a2_2
version: curriculum-a2-2-fr-v1
grammar:
  invitations: "tu veux + infinitive, ça te dit de + infinitive; on y va, si on allait + imparfait for a suggestion; volontiers, avec plaisir; malheureusement, je ne peux pas."
  comparisons: "plus ... que and moins ... que (plus grand que toi); meilleur with a noun and mieux with a verb, pire; le meilleur, la meilleure; aussi ... que; pareil, différent."
  travel: "je voudrais with a noun (une chambre double); ça ne marche pas, il n'y a pas de; questions with à quelle heure and est compris."
  used_to: "Imparfait (the nous stem + -ais, -ait): j'étais, j'avais, j'habitais, j'allais, je jouais; il y avait; quand j'étais petit; maintenant, ne ... plus."
  future: "Futur simple (the infinitive + -ai, with irregular stems): j'irai, je ferai, ce sera, je reviendrai; l'année prochaine; peut-être, probablement; je te promets que."
  work: "je suis + a job with no article (je suis infirmier), je travaille comme; je commence à, je finis à; je voudrais devenir, j'aimerais devenir."
