  je_suis_rentre: { t: "je suis rentré", pos: phrase, en: ["I came back", "I came home", "I returned"], forms: ["je suis rentré", "je suis rentrée", "je suis revenu", "je suis revenue", "je suis retourné", "je suis retournée", "nous sommes rentrés", "on est rentrés"], ex: ["Je suis rentrée samedi.", "I came back on Saturday."], n: "'Rentrer' is to come back home; 'revenir' is to come back." }
  avec: { t: "avec", pos: preposition, en: ["with"], ex: ["Je suis allé avec mon frère.", "I went with my brother."] }
