  j_ai_ete: { t: "j'ai été", pos: phrase, en: ["I have been", "I went"], forms: ["j'ai été", "on a été", "nous avons été"], ex: ["J'ai été à Venise l'an dernier.", "I went to Venice last year."], n: "Everyday speech for 'I have been to'; the careful form is je suis allé." }
