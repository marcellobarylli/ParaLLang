  j_ai_rencontre: { t: "j'ai rencontré", pos: phrase, en: ["I met"], forms: ["j'ai rencontré", "on a rencontré", "nous avons rencontré", "j'ai croisé"], ex: ["J'ai rencontré Marie sur la place.", "I met Marie in the square."], n: "'J'ai croisé' is 'I ran into'." }
