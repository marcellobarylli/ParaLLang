# Round 144: the Italian words of curriculum stage A2.1 (the skeleton is content/curriculum/03_a2_1.yaml). Authored by
# Claude from the functions of the A2 syllabi read for the round; no source page was opened for a single entry. For
# the owner's review. The vocabulary shares one namespace with the earlier stages: an id defined in an earlier file is
# reused here, never redefined, and no new entry repeats an earlier entry's form.
stage: a2_1
version: curriculum-a2-1-it-v1
grammar:
  past_did: "Passato prossimo with avere: ho + participle (mangiato, bevuto, visto, fatto); ieri, la settimana scorsa."
  past_went: "Passato prossimo with essere: sono andato, sono andata (the participle agrees with the speaker); con."
  weather: "fa caldo, fa freddo, c'è il sole, piove; in estate, d'inverno; quando."
  restaurant: "vorrei with an infinitive (vorrei prenotare); come antipasto, come primo, come secondo; un altro, un'altra."
  health: "mi fa male and mi fanno male; avere with ailments (ho la febbre, ho mal di ...); devo with an infinitive."
  plans: "volere, dovere and potere with an infinitive (voglio, devo, posso); the present, penso di and sto per for the near future."
lessons:
  past_did_yesterday:
    ate: { say: [[ieri], [ho_mangiato, ho_bevuto]], examples: ["Ieri ho mangiato una pizza.", "Ieri sera ho bevuto un tè."] }
    worked: { say: [ho_lavorato, ho_studiato], examples: ["Ho lavorato molto.", "Non ho lavorato, ho studiato."] }
    ask_did: { say: [cosa_hai_fatto], examples: ["Cosa hai fatto ieri?", "Che cosa ha fatto ieri sera?"] }
  past_did_bought:
    bought: { say: [ho_comprato], examples: ["Ho comprato una giacca.", "Ho comprato il pane."] }
    paid: { say: [ho_pagato], examples: ["Ho pagato venti euro.", "Ho speso dieci euro."] }
    saw: { say: [ho_visto], examples: ["Ho visto un film.", "Ho visto mia sorella."] }
  past_did_week:
    last_week: { say: [la_settimana_scorsa], examples: ["La settimana scorsa ho lavorato molto.", "La settimana scorsa ho visto un amico."] }
    made: { say: [ho_fatto], examples: ["Ho fatto una torta.", "Ho fatto una passeggiata."] }
    met: { say: [ho_incontrato, ho_parlato], examples: ["Ho incontrato un amico.", "Ho parlato con mia madre."] }
  past_went_where:
    went: { say: [sono_andato], examples: ["Ieri sono andato al mare.", "Sono andata a Roma."] }
    stayed: { say: [sono_stato, sono_rimasto], examples: ["Sono stato a Milano.", "Sono rimasta a casa."] }
    ask_where: { say: [dove_sei_andato], examples: ["Dove sei andato?", "Dov'è andata ieri?"] }
  past_went_when:
    left: { say: [sono_partito], examples: ["Sono partito alle otto.", "Sono partita lunedì."] }
    arrived: { say: [sono_arrivato], examples: ["Sono arrivato ieri sera.", "Sono arrivata alle dieci."] }
    came_back: { say: [sono_tornato], examples: ["Sono tornato domenica.", "Sono tornata ieri."] }
  past_went_with:
    with_whom: { say: [con, da_solo], examples: ["Sono andato con un amico.", "Sono andata da sola."] }
    ask_with: { say: [con_chi], examples: ["Con chi sei andato?", "Con chi è andata?"] }
    how_was: { say: [mi_sono_divertito, e_stato_bello], examples: ["Mi sono divertito molto.", "È stato bellissimo."] }
  weather_today:
    ask_weather: { say: [che_tempo_fa], examples: ["Che tempo fa?", "Che tempo fa oggi?"] }
    hot_cold: { say: [fa_caldo, fa_freddo], examples: ["Oggi fa caldo.", "Fa molto freddo."] }
    sun_rain: { say: [c_e_il_sole, piove, c_e_vento, nevica], examples: ["C'è il sole.", "Piove.", "C'è vento."] }
  weather_seasons:
    ask_season: { say: [quale_stagione], examples: ["Quale stagione preferisci?", "Qual è la tua stagione preferita?"] }
    favourite: { say: [estate, inverno, primavera, autunno], examples: ["Preferisco l'estate.", "Mi piace la primavera."] }
    in_season: { say: [[estate, inverno, primavera, autunno], [fa_caldo, fa_freddo, piove, nevica, c_e_il_sole, c_e_vento]], examples: ["In inverno fa freddo.", "D'estate fa molto caldo.", "In autunno piove spesso."] }
  weather_rain:
    was: { say: [ha_fatto_freddo, ha_piovuto], examples: ["Ieri ha fatto freddo.", "Ieri ha piovuto."] }
    when_rains: { say: [quando_piove], examples: ["Quando piove resto a casa.", "Quando piove leggo un libro."] }
    fine_weather: { say: [bel_tempo], examples: ["Quando fa bel tempo vado al mare.", "Quando c'è bel tempo esco."] }
  restaurant_book:
    book: { say: [prenotare], examples: ["Vorrei prenotare un tavolo.", "Posso prenotare un tavolo?"] }
    how_many: { say: [persone], examples: ["Per due persone.", "Un tavolo per quattro persone."] }
    for_when: { say: [per_stasera], examples: ["Per stasera, alle otto.", "Per domani sera."] }
  restaurant_order:
    starter: { say: [come_antipasto, come_primo], examples: ["Come antipasto prendo il prosciutto.", "Come primo vorrei la pasta."] }
    main: { say: [[come_secondo], [carne, pesce, pollo]], examples: ["Come secondo prendo il pesce.", "Di secondo vorrei il pollo."] }
    dessert: { say: [dolce], examples: ["Come dolce prendo il tiramisù.", "Un dolce, per favore."] }
  restaurant_wrong:
    cold: { say: [freddo, salato], examples: ["La zuppa è fredda.", "È troppo salato."] }
    missing: { say: [[manca], [forchetta, coltello, bicchiere, pane]], examples: ["Manca una forchetta.", "Mancano i bicchieri.", "Manca il pane."] }
    another: { say: [un_altro], examples: ["Posso avere un'altra forchetta?", "Un altro bicchiere, per favore."] }
  health_hurts:
    not_well: { say: [non_sto_bene], examples: ["Non sto bene.", "Mi sento male."] }
    hurts: { say: [[mi_fa_male], [testa, stomaco, gola, dente, schiena]], examples: ["Mi fa male la testa.", "Ho mal di gola.", "Mi fanno male i denti."] }
    since: { say: [da_ieri], examples: ["Da ieri.", "Mi fa male da due giorni."] }
  health_cold:
    cold_fever: { say: [ho_il_raffreddore, ho_la_febbre, ho_la_tosse], examples: ["Ho il raffreddore.", "Ho la febbre.", "Ho la tosse."] }
    tired: { say: [sono_stanco], examples: ["Sono molto stanco.", "Sono stanca."] }
    must_rest: { say: [devo_riposare], examples: ["Devo riposare.", "Devo stare a letto."] }
  health_help:
    need: { say: [[ho_bisogno_di], [medico, farmacia]], examples: ["Ho bisogno di un medico.", "Ho bisogno di una farmacia.", "Mi serve un medico."] }
    something_for: { say: [qualcosa_per], examples: ["Ha qualcosa per il mal di testa?", "Vorrei qualcosa per la tosse."] }
    how_often: { say: [quante_volte], examples: ["Quante volte al giorno?", "Quante volte devo prenderlo?"] }
  plans_want:
    want: { say: [voglio], examples: ["Voglio andare al mare.", "Questo fine settimana voglio dormire."] }
    ask_want: { say: [cosa_vuoi_fare], examples: ["Cosa vuoi fare?", "Che cosa vuole fare domani?"] }
    can: { say: [posso, non_posso], examples: ["Sabato posso venire.", "Domenica non posso."] }
  plans_must:
    must: { say: [devo], examples: ["Devo lavorare sabato.", "Devo studiare."] }
    cannot_because: { say: [[non_posso], [devo]], examples: ["Non posso, devo lavorare.", "Non posso venire perché devo studiare."] }
    ask_must: { say: [devi], examples: ["Devi lavorare domani?", "Deve lavorare sabato?"] }
  plans_going:
    going_to: { say: [penso_di], examples: ["Domani penso di andare al mare.", "Penso di restare a casa."] }
    next_week: { say: [la_settimana_prossima], examples: ["La settimana prossima vado a Roma.", "La prossima settimana lavoro."] }
    about_to: { say: [sto_per], examples: ["Sto per partire.", "Sto per uscire."] }
vocabulary:
  # past_did
  ieri: { t: "ieri", pos: adverb, en: ["yesterday"], forms: ["ieri", "ieri sera", "ieri mattina"], ex: ["Ieri ho lavorato.", "Yesterday I worked."] }
  ho_mangiato: { t: "ho mangiato", pos: phrase, en: ["I ate", "I have eaten"], forms: ["ho mangiato", "abbiamo mangiato"], ex: ["Ho mangiato un panino.", "I ate a sandwich."], n: "The past of most verbs: ho + the participle, which does not change." }
  ho_bevuto: { t: "ho bevuto", pos: phrase, en: ["I drank", "I have drunk"], forms: ["ho bevuto", "abbiamo bevuto"], ex: ["Ho bevuto un caffè.", "I drank a coffee."] }
  ho_lavorato: { t: "ho lavorato", pos: phrase, en: ["I worked", "I have worked"], forms: ["ho lavorato", "abbiamo lavorato"], ex: ["Ieri ho lavorato fino alle otto.", "Yesterday I worked until eight."] }
  ho_studiato: { t: "ho studiato", pos: phrase, en: ["I studied", "I have studied"], forms: ["ho studiato", "abbiamo studiato"], ex: ["Ho studiato tutto il giorno.", "I studied all day."] }
  cosa_hai_fatto: { t: "cosa hai fatto", pos: phrase, en: ["what did you do"], forms: ["cosa hai fatto", "che cosa hai fatto", "che hai fatto", "cosa ha fatto", "che cosa ha fatto", "cosa avete fatto"], ex: ["Cosa hai fatto sabato?", "What did you do on Saturday?"] }
  ho_comprato: { t: "ho comprato", pos: phrase, en: ["I bought", "I have bought"], forms: ["ho comprato", "abbiamo comprato"], ex: ["Ho comprato un cappello.", "I bought a hat."] }
  ho_pagato: { t: "ho pagato", pos: phrase, en: ["I paid"], forms: ["ho pagato", "ho speso"], ex: ["Ho pagato dieci euro.", "I paid ten euros."], n: "'Ho speso' is 'I spent'." }
  ho_visto: { t: "ho visto", pos: phrase, en: ["I saw", "I have seen"], forms: ["ho visto", "abbiamo visto"], ex: ["Ho visto un bel film.", "I saw a good film."] }
  la_settimana_scorsa: { t: "la settimana scorsa", pos: phrase, en: ["last week"], forms: ["la settimana scorsa", "settimana scorsa", "la scorsa settimana"], ex: ["La settimana scorsa ho studiato molto.", "Last week I studied a lot."] }
  ho_fatto: { t: "ho fatto", pos: phrase, en: ["I did", "I made"], forms: ["ho fatto", "abbiamo fatto"], ex: ["Ho fatto la spesa.", "I did the shopping."] }
  ho_incontrato: { t: "ho incontrato", pos: phrase, en: ["I met"], forms: ["ho incontrato", "abbiamo incontrato"], ex: ["Ho incontrato Marta in piazza.", "I met Marta in the square."] }
  ho_parlato: { t: "ho parlato", pos: phrase, en: ["I spoke", "I talked"], forms: ["ho parlato", "abbiamo parlato"], ex: ["Ho parlato con il medico.", "I spoke to the doctor."] }
  # past_went
  sono_andato: { t: "sono andato", pos: phrase, en: ["I went"], forms: ["sono andato", "sono andata", "siamo andati", "siamo andate"], ex: ["Sono andato al supermercato.", "I went to the supermarket."], n: "Verbs of movement take essere, and the participle agrees: a woman says sono andata." }
  sono_stato: { t: "sono stato", pos: phrase, en: ["I was", "I have been"], forms: ["sono stato", "sono stata", "siamo stati", "siamo state"], ex: ["Sono stata a Venezia.", "I have been to Venice."] }
  sono_rimasto: { t: "sono rimasto", pos: phrase, en: ["I stayed"], forms: ["sono rimasto", "sono rimasta", "sono restato", "sono restata"], ex: ["Sono rimasto a casa.", "I stayed at home."] }
  dove_sei_andato: { t: "dove sei andato", pos: phrase, en: ["where did you go"], forms: ["dove sei andato", "dove sei andata", "dov'è andato", "dov'è andata", "dove siete andati"], ex: ["Dove sei andato ieri?", "Where did you go yesterday?"] }
  sono_partito: { t: "sono partito", pos: phrase, en: ["I left", "I set off"], forms: ["sono partito", "sono partita", "siamo partiti", "siamo partite", "sono uscito", "sono uscita"], ex: ["Sono partita alle sette.", "I left at seven."] }
  sono_arrivato: { t: "sono arrivato", pos: phrase, en: ["I arrived"], forms: ["sono arrivato", "sono arrivata", "siamo arrivati", "siamo arrivate"], ex: ["Sono arrivato alle nove.", "I arrived at nine."] }
  sono_tornato: { t: "sono tornato", pos: phrase, en: ["I came back", "I returned"], forms: ["sono tornato", "sono tornata", "siamo tornati", "siamo tornate"], ex: ["Sono tornata sabato.", "I came back on Saturday."] }
  con: { t: "con", pos: preposition, en: ["with"], ex: ["Sono andato con mio fratello.", "I went with my brother."] }
  da_solo: { t: "da solo", pos: phrase, en: ["alone", "on my own"], forms: ["da solo", "da sola"], ex: ["Sono andata da sola.", "I went on my own."] }
  con_chi: { t: "con chi", pos: phrase, en: ["who with", "with whom"], ex: ["Con chi sei andato?", "Who did you go with?"] }
  mi_sono_divertito: { t: "mi sono divertito", pos: phrase, en: ["I enjoyed myself", "I had fun"], forms: ["mi sono divertito", "mi sono divertita", "ci siamo divertiti", "ci siamo divertite"], ex: ["Mi sono divertita molto.", "I enjoyed myself a lot."] }
  e_stato_bello: { t: "è stato bello", pos: phrase, en: ["it was lovely", "it was nice"], forms: ["è stato bello", "è stata bella", "è stato bellissimo", "è stata bellissima", "è stato molto bello", "è stato fantastico"], ex: ["È stato bello, grazie.", "It was lovely, thank you."] }
  # weather
  che_tempo_fa: { t: "che tempo fa", pos: phrase, en: ["what is the weather like"], forms: ["che tempo fa", "com'è il tempo"], ex: ["Che tempo fa a Roma?", "What is the weather like in Rome?"] }
  fa_caldo: { t: "fa caldo", pos: phrase, en: ["it is hot", "it is warm"], forms: ["fa caldo", "fa molto caldo"], ex: ["Oggi fa caldo.", "It is hot today."] }
  fa_freddo: { t: "fa freddo", pos: phrase, en: ["it is cold"], forms: ["fa freddo", "fa molto freddo"], ex: ["Fa freddo stasera.", "It is cold this evening."] }
  c_e_il_sole: { t: "c'è il sole", pos: phrase, en: ["it is sunny", "the sun is out"], forms: ["c'è il sole", "c'è sole"], ex: ["Oggi c'è il sole.", "It is sunny today."] }
  piove: { t: "piove", pos: verb, en: ["it is raining", "it rains"], forms: ["piove", "sta piovendo"], ex: ["Piove da ieri.", "It has been raining since yesterday."] }
  c_e_vento: { t: "c'è vento", pos: phrase, en: ["it is windy"], forms: ["c'è vento", "tira vento"], ex: ["Oggi c'è vento.", "It is windy today."] }
  nevica: { t: "nevica", pos: verb, en: ["it is snowing", "it snows"], forms: ["nevica", "sta nevicando"], ex: ["In montagna nevica.", "It is snowing in the mountains."] }
  quale_stagione: { t: "quale stagione", pos: phrase, en: ["which season"], forms: ["quale stagione", "che stagione", "stagione preferita"], ex: ["Quale stagione ti piace?", "Which season do you like?"] }
  estate: { t: "estate", pos: noun, en: ["summer"], forms: ["estate", "l'estate", "in estate", "d'estate"], ex: ["In estate vado al mare.", "In summer I go to the sea."] }
  inverno: { t: "inverno", pos: noun, en: ["winter"], forms: ["inverno", "l'inverno", "in inverno", "d'inverno"], ex: ["In inverno nevica.", "In winter it snows."] }
  primavera: { t: "primavera", pos: noun, en: ["spring"], forms: ["primavera", "la primavera", "in primavera"], ex: ["La primavera è bella.", "Spring is lovely."] }
  autunno: { t: "autunno", pos: noun, en: ["autumn", "fall"], forms: ["autunno", "l'autunno", "in autunno"], ex: ["In autunno piove.", "In autumn it rains."] }
  ha_fatto_freddo: { t: "ha fatto freddo", pos: phrase, en: ["it was cold"], forms: ["ha fatto freddo", "ha fatto caldo", "faceva freddo", "faceva caldo", "ha fatto bel tempo", "ha fatto brutto tempo"], ex: ["Ieri ha fatto freddo.", "It was cold yesterday."], n: "'Ha fatto caldo' is 'it was hot'." }
  ha_piovuto: { t: "ha piovuto", pos: phrase, en: ["it rained"], forms: ["ha piovuto", "è piovuto", "pioveva", "ha nevicato", "è nevicato"], ex: ["Ha piovuto tutto il giorno.", "It rained all day."] }
  quando_piove: { t: "quando piove", pos: phrase, en: ["when it rains"], ex: ["Quando piove prendo l'autobus.", "When it rains I take the bus."] }
  bel_tempo: { t: "bel tempo", pos: phrase, en: ["fine weather", "good weather"], forms: ["bel tempo", "fa bel tempo", "c'è bel tempo", "quando fa bel tempo"], ex: ["Oggi fa bel tempo.", "The weather is fine today."] }
  # restaurant
  prenotare: { t: "prenotare", pos: verb, en: ["to book", "to reserve"], forms: ["prenotare", "prenotare un tavolo", "ho prenotato", "una prenotazione"], ex: ["Vorrei prenotare per domani.", "I would like to book for tomorrow."] }
  persone: { t: "persone", pos: noun, en: ["people"], forms: ["persone", "persona"], ex: ["Siamo quattro persone.", "There are four of us."] }
  per_stasera: { t: "per stasera", pos: phrase, en: ["for this evening", "for tonight"], forms: ["per stasera", "per questa sera", "per domani", "per domani sera", "per oggi"], ex: ["Un tavolo per stasera.", "A table for this evening."] }
  come_antipasto: { t: "come antipasto", pos: phrase, en: ["as a starter"], forms: ["come antipasto", "per antipasto", "di antipasto"], ex: ["Come antipasto prendo l'insalata.", "As a starter I'll have the salad."] }
  come_primo: { t: "come primo", pos: phrase, en: ["as a first course"], forms: ["come primo", "per primo", "di primo"], ex: ["Come primo prendo la pasta.", "As a first course I'll have the pasta."], n: "The 'primo' is pasta, rice or soup; the 'secondo' is meat or fish." }
  come_secondo: { t: "come secondo", pos: phrase, en: ["as a main course", "as a second course"], forms: ["come secondo", "per secondo", "di secondo"], ex: ["Come secondo vorrei la carne.", "As a main course I would like the meat."] }
  carne: { t: "carne", pos: noun, en: ["meat"], forms: ["carne", "la carne"], ex: ["Non mangio carne.", "I don't eat meat."] }
  pesce: { t: "pesce", pos: noun, en: ["fish"], forms: ["pesce", "il pesce"], ex: ["Il pesce è buono.", "The fish is good."] }
  pollo: { t: "pollo", pos: noun, en: ["chicken"], forms: ["pollo", "il pollo"], ex: ["Pollo con patate.", "Chicken with potatoes."] }
  dolce: { t: "dolce", pos: noun, en: ["dessert", "sweet"], forms: ["dolce", "il dolce", "un dolce", "come dolce", "dessert"], ex: ["Prendo un dolce.", "I'll have a dessert."], n: "Also the adjective 'sweet'." }
  freddo: { t: "freddo", pos: adjective, en: ["cold"], forms: ["freddo", "fredda", "freddi", "fredde"], ex: ["La pasta è fredda.", "The pasta is cold."] }
  salato: { t: "salato", pos: adjective, en: ["salty"], forms: ["salato", "salata", "troppo salato", "troppo salata"], ex: ["Il pesce è troppo salato.", "The fish is too salty."] }
  manca: { t: "manca", pos: verb, en: ["is missing", "there is no"], forms: ["manca", "mancano"], ex: ["Manca un coltello.", "A knife is missing."], n: "'Mancano' when several things are missing." }
  forchetta: { t: "forchetta", pos: noun, en: ["fork"], forms: ["forchetta", "forchette"], ex: ["Una forchetta, per favore.", "A fork, please."] }
  coltello: { t: "coltello", pos: noun, en: ["knife"], forms: ["coltello", "coltelli"], ex: ["Il coltello è qui.", "The knife is here."] }
  bicchiere: { t: "bicchiere", pos: noun, en: ["glass"], forms: ["bicchiere", "bicchieri"], ex: ["Un bicchiere di vino.", "A glass of wine."] }
  pane: { t: "pane", pos: noun, en: ["bread"], forms: ["pane", "il pane"], ex: ["Ancora un po' di pane?", "A little more bread?"] }
  un_altro: { t: "un altro", pos: phrase, en: ["another", "another one"], forms: ["un altro", "un'altra"], ex: ["Vorrei un altro caffè.", "I would like another coffee."] }
  # health
  non_sto_bene: { t: "non sto bene", pos: phrase, en: ["I don't feel well", "I am not well"], forms: ["non sto bene", "sto male", "mi sento male", "non mi sento bene"], ex: ["Oggi non sto bene.", "I don't feel well today."] }
  mi_fa_male: { t: "mi fa male", pos: phrase, en: ["it hurts", "my ... hurts"], forms: ["mi fa male", "mi fanno male", "ho mal di"], ex: ["Mi fa male la schiena.", "My back hurts."], n: "'Ho mal di testa' says the same with avere." }
  testa: { t: "testa", pos: noun, en: ["head"], forms: ["testa", "la testa"], ex: ["Ho mal di testa.", "I have a headache."] }
  stomaco: { t: "stomaco", pos: noun, en: ["stomach"], forms: ["stomaco", "lo stomaco", "pancia", "la pancia"], ex: ["Mi fa male lo stomaco.", "My stomach hurts."] }
  gola: { t: "gola", pos: noun, en: ["throat"], forms: ["gola", "la gola"], ex: ["Ho mal di gola.", "I have a sore throat."] }
  dente: { t: "dente", pos: noun, en: ["tooth"], forms: ["dente", "un dente", "denti", "i denti"], ex: ["Mi fa male un dente.", "I have toothache."] }
  schiena: { t: "schiena", pos: noun, en: ["back"], forms: ["schiena", "la schiena"], ex: ["Ho mal di schiena.", "I have backache."] }
  da_ieri: { t: "da ieri", pos: phrase, en: ["since yesterday"], forms: ["da ieri", "da ieri sera", "da oggi", "da stamattina", "da due giorni", "da tre giorni", "da qualche giorno", "da una settimana"], ex: ["Ho la febbre da ieri.", "I have had a fever since yesterday."], n: "Da with the present says how long: sto male da due giorni." }
  ho_il_raffreddore: { t: "ho il raffreddore", pos: phrase, en: ["I have a cold"], forms: ["ho il raffreddore", "il raffreddore", "raffreddore", "sono raffreddato", "sono raffreddata"], ex: ["Ho il raffreddore da lunedì.", "I have had a cold since Monday."] }
  ho_la_febbre: { t: "ho la febbre", pos: phrase, en: ["I have a fever", "I have a temperature"], forms: ["ho la febbre", "la febbre", "febbre"], ex: ["Ho la febbre alta.", "I have a high fever."] }
  ho_la_tosse: { t: "ho la tosse", pos: phrase, en: ["I have a cough"], forms: ["ho la tosse", "la tosse", "tosse"], ex: ["Ho la tosse da una settimana.", "I have had a cough for a week."] }
  sono_stanco: { t: "sono stanco", pos: phrase, en: ["I am tired"], forms: ["sono stanco", "sono stanca", "sono molto stanco", "sono molto stanca", "sono stanchissimo", "sono stanchissima"], ex: ["Stasera sono stanca.", "I am tired this evening."] }
