# Round 144: the words of curriculum stage A2.1 (the skeleton is content/curriculum/03_a2_1.yaml). The Italian
# original was authored by Claude from the functions of the A2 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. The vocabulary shares one namespace with the earlier stages: an id
# defined in an earlier file is reused here, never redefined, and no new entry repeats an earlier entry's form.
# Round 180: the French version, authored by Claude from the Italian file; it awaits a native speaker's review.
stage: a2_1
version: curriculum-a2-1-fr-v1
grammar:
  past_did: "Passé composé with avoir: j'ai + participle (mangé, bu, vu, fait, acheté); the participle does not agree with the subject; hier, la semaine dernière."
  past_went: "Passé composé with être for verbs of movement (je suis allé, parti, arrivé, rentré, resté): the participle agrees with the speaker (je suis allée, nous sommes partis); avec, tout seul."
  weather: "il fait chaud, il fait froid, il fait beau, il y a du soleil, il pleut, il neige; en été, en hiver, en automne but au printemps; quand."
  restaurant: "je voudrais with an infinitive (je voudrais réserver); en entrée, comme plat, en dessert; un autre, une autre; il manque."
  health: "avoir mal à with the article (j'ai mal à la tête, au ventre, aux dents); avoir with ailments (j'ai de la fièvre, j'ai un rhume); depuis with the present; je dois with an infinitive."
  plans: "vouloir, devoir and pouvoir with an infinitive (je veux, je dois, je peux); the futur proche, aller + infinitive (je vais partir); être sur le point de."
lessons:
