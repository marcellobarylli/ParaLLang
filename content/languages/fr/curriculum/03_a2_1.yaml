  j_ai_etudie: { t: "j'ai étudié", pos: phrase, en: ["I studied", "I have studied"], forms: ["j'ai étudié", "on a étudié", "nous avons étudié", "j'ai révisé"], ex: ["J'ai étudié toute la journée.", "I studied all day."], n: "'J'ai révisé' is 'I revised', for an exam." }
  qu_est_ce_que_tu_as_fait: { t: "qu'est-ce que tu as fait", pos: phrase, en: ["what did you do"], forms: ["qu'est-ce que tu as fait", "tu as fait quoi", "t'as fait quoi", "qu'as-tu fait", "qu'as tu fait", "qu'est-ce que vous avez fait", "vous avez fait quoi", "qu'avez-vous fait", "qu'avez vous fait"], ex: ["Qu'est-ce que tu as fait samedi ?", "What did you do on Saturday?"] }
  j_ai_achete: { t: "j'ai acheté", pos: phrase, en: ["I bought", "I have bought"], forms: ["j'ai acheté", "on a acheté", "nous avons acheté"], ex: ["J'ai acheté un chapeau.", "I bought a hat."] }
