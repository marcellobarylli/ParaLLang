  avec_qui: { t: "avec qui", pos: phrase, en: ["who with", "with whom"], ex: ["Avec qui es-tu allé ?", "Who did you go with?"] }
  je_me_suis_amuse: { t: "je me suis amusé", pos: phrase, en: ["I enjoyed myself", "I had fun"], forms: ["je me suis amusé", "je me suis amusée", "je me suis bien amusé", "je me suis bien amusée", "nous nous sommes amusés", "on s'est amusés", "on s'est bien amusés"], ex: ["Je me suis bien amusée.", "I enjoyed myself a lot."] }
