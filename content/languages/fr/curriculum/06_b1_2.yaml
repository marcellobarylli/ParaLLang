  qu_est_ce_qui_se_passe_si: { t: "qu'est-ce qui se passe si", pos: phrase, en: ["what happens if"], forms: ["qu'est-ce qui se passe si", "qu'est-ce qui se passe s'il", "qu'est-ce qui arrive si", "que se passe-t-il si", "que se passe t il si", "et si", "et s'il"], ex: ["Qu'est-ce qui se passe si j'arrive en retard ?", "What happens if I arrive late?"], n: "'Et si ... ?' is 'what if ...?'." }
