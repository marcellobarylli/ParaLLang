# Round 180: the French version, authored by Claude from the Italian file; it awaits a native speaker's review.
stage: b1_2
version: curriculum-b1-2-fr-v1
grammar:
  hopes: "j'espère que takes the indicative, often the future (j'espère qu'il fera beau); the subjonctif présent comes after je veux que, il faut que and il est important que (que tu viennes, qu'il fasse, que tu sois, que tu partes); j'espère + infinitive when the subject is the same; bon voyage, bonne chance."
  hypotheses: "si + present for real conditions (s'il pleut, je reste à la maison); si + imparfait + conditionnel for unreal ones (si je pouvais, si j'avais, si je gagnais ... j'achèterais, j'irais, je ferais); never the conditionnel after si."
  retelling: "il a dit que, il m'a demandé si, il m'a demandé de + infinitive; after a past verb the present becomes the imparfait (il a dit qu'il arrivait); j'ai entendu dire que, on dit que; je le crois, je n'y crois pas, j'en doute."
  customs: "on for people in general (on mange, on fête Noël); par contre and alors que for contrast; ça m'a frappé; être habitué à."
  persuading: "je propose de + infinitive; d'un côté ... de l'autre; mais, pourtant, de toute façon; allez, fais-moi confiance; là-dessus, tu as raison."
  life_story: "je suis né / née, j'ai grandi, j'ai déménagé; the present with depuis for what still goes on (j'habite ici depuis dix ans); ne ... jamais and ne ... pas encore with the passé composé."
lessons:
  hopes_hope:
    hope_that: { say: [j_espere_que], examples: ["J'espère qu'il fera beau demain.", "J'espère que le train arrivera bientôt."] }
    hope_to: { say: [j_espere], examples: ["J'espère revenir bientôt.", "J'espère te revoir."] }
    hope_so: { say: [j_espere_que_oui], examples: ["J'espère que oui.", "Espérons que non !"] }
  hopes_wish:
    good_luck: { say: [bonne_chance], examples: ["Bonne chance !", "Je croise les doigts pour toi !"] }
    good_journey: { say: [bon_voyage], examples: ["Bon voyage !", "Bonne journée !", "Bonnes vacances !"] }
    get_well: { say: [bon_retablissement], examples: ["Bon rétablissement !", "J'espère que tu iras vite mieux."] }
  hopes_want:
    hope_you_like: { say: [ca_te_plaira], examples: ["J'espère que ça te plaira.", "J'espère que le cadeau vous plaira."] }
    want_you_to: { say: [je_veux_que], examples: ["Je veux que tu viennes avec nous.", "Je ne veux pas que tu partes."] }
    important_that: { say: [il_est_important_que], examples: ["Il est important que tout le monde soit d'accord.", "Il faut que tu partes maintenant."] }
  hypotheses_real:
    if_weather: { say: [s_il_pleut], examples: ["S'il pleut, je reste à la maison.", "S'il fait beau, je vais à la mer."] }
    if_time: { say: [si_j_ai_le_temps], examples: ["Si j'ai le temps, je t'appelle.", "Si je peux, je viens demain."] }
    if_you_want: { say: [si_tu_veux], examples: ["Si tu veux, on y va ensemble.", "Si vous voulez, je vous aide."] }
  hypotheses_unreal:
