  bon_voyage: { t: "bon voyage", pos: phrase, en: ["have a good journey", "have a good trip"], forms: ["bon voyage", "bonne journée", "bonne soirée", "bonnes vacances", "bon week-end", "bon weekend", "bonne route", "bon appétit"], ex: ["Bon voyage et à bientôt !", "Have a good journey, and see you soon!"], n: "The same pattern wishes anything: bonne journée, bonnes vacances." }
  bon_retablissement: { t: "bon rétablissement", pos: phrase, en: ["get well soon"], forms: ["bon rétablissement", "prompt rétablissement", "remets-toi vite", "remets toi vite", "remettez-vous vite", "remettez vous vite", "soigne-toi bien", "soigne toi bien", "j'espère que tu iras mieux", "j'espère que tu iras vite mieux", "j'espère que vous irez mieux", "j'espère que vous irez vite mieux"], ex: ["Bon rétablissement, et repose-toi bien.", "Get well soon, and rest well."] }
