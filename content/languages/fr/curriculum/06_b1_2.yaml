  il_est_important_que: { t: "il est important que", pos: phrase, en: ["it is important that"], forms: ["il est important que", "c'est important que", "il faut que", "il faut qu", "il faudrait que", "il est nécessaire que", "il vaut mieux que"], ex: ["Il est important que tu te reposes.", "It is important that you rest."], n: "The subjonctif follows: il faut que tu partes, qu'il fasse, que tu sois." }
  # hypotheses
