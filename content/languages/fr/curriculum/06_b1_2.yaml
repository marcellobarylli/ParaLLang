  # retelling
  il_a_dit_que: { t: "il a dit que", pos: phrase, en: ["he said that", "she said that"], forms: ["il a dit que", "elle a dit que", "a dit que", "a dit qu", "il m'a dit que", "elle m'a dit que", "m'a dit que", "m'a dit qu", "m'a dit", "ils ont dit que", "on m'a dit que", "il dit que", "elle dit que"], ex: ["Paul a dit qu'il venait.", "Paul said that he was coming."], n: "After a past verb the present becomes the imparfait: il a dit qu'il venait." }
