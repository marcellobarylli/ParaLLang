    similar: { say: [semblable], examples: ["Chez nous aussi, c'est comme ça.", "C'est très semblable."] }
    prefer: { say: [[je_prefere], [parce_que]], examples: ["Je préfère dîner tôt, parce que je dors mieux après.", "Je préfère le café d'ici parce que c'est plus fort."] }
  customs_surprise:
