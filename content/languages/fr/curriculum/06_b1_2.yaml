    not_used: { say: [je_ne_suis_pas_habitue], examples: ["Je ne suis pas habitué à dîner si tard.", "Je commence à m'habituer."] }
    find_it: { say: [ca_me_semble], examples: ["Ça me semble être une bonne habitude.", "Je la trouve un peu étrange."] }
  persuading_propose:
