    however: { say: [cependant], examples: ["Oui, mais c'est loin.", "C'est beau, cependant ça coûte trop cher."] }
    anyway: { say: [de_toute_facon, ca_vaut_la_peine], examples: ["De toute façon, moi, j'y vais.", "Ça vaut la peine d'essayer."] }
  persuading_settle:
    concede: { say: [la_dessus_tu_as_raison], examples: ["Là-dessus, tu as raison, mais il est tard.", "En effet, c'est un peu cher."] }
    compromise: { say: [on_fait_comme_ca], examples: ["On fait comme ça : aujourd'hui le musée, demain la mer.", "Trouvons un compromis."] }
    settled: { say: [ca_me_va], examples: ["Pour moi, ça me va.", "Marché conclu !"] }
  life_story_born:
