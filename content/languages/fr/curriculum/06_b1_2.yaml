    moved: { say: [j_ai_demenage], examples: ["J'ai déménagé à Londres il y a dix ans.", "À vingt ans, je suis allée vivre à Paris."] }
  life_story_since:
    how_long: { say: [[depuis], [ans, mois]], examples: ["J'habite à Londres depuis dix ans.", "Je vis ici depuis six mois."] }
    learning: { say: [[depuis], [j_apprends, j_etudie]], examples: ["J'étudie le français depuis un an.", "J'apprends le français depuis trois mois."] }
