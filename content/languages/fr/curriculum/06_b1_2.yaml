vocabulary:
  # hopes
  j_espere_que: { t: "j'espère que", pos: phrase, en: ["I hope that"], forms: ["j'espère que", "j'espère qu", "on espère que", "nous espérons que", "espérons que", "espérons qu"], ex: ["J'espère que tu vas bien.", "I hope that you are well."], n: "The indicative follows, often the future: j'espère qu'il viendra." }
  j_espere: { t: "j'espère", pos: phrase, en: ["I hope to", "I hope"], forms: ["j'espère", "on espère", "nous espérons"], ex: ["J'espère arriver à l'heure.", "I hope to arrive in time."], n: "With an infinitive, when you hope something for yourself: j'espère partir." }
  j_espere_que_oui: { t: "j'espère que oui", pos: phrase, en: ["I hope so"], forms: ["j'espère que oui", "j'espère que non", "j'espère bien", "j'espère pas", "espérons que oui", "espérons que non", "espérons-le", "espérons le"], ex: ["Marie vient aussi ? J'espère que oui.", "Is Marie coming too? I hope so."], n: "'J'espère que non' is 'I hope not'." }
