    advantage: { say: [l_avantage, il_vaut_mieux], examples: ["L'avantage, c'est que ça coûte moins cher.", "Il vaut mieux y aller en train."] }
    come_on: { say: [allez], examples: ["Allez, viens avec nous !", "Fais-moi confiance, c'est très beau."] }
  persuading_argue:
