  hypotheses_then:
    what_if: { say: [qu_est_ce_qui_se_passe_si], examples: ["Qu'est-ce qui se passe si je rate le train ?", "Et si le train est en retard ?"] }
    in_that_case: { say: [dans_ce_cas], examples: ["Dans ce cas, je prends un taxi.", "Dans ce cas-là, je reste ici."] }
    otherwise: { say: [sinon], examples: ["Sinon, je rentre demain.", "Je dois partir maintenant, autrement je rate le train."] }
  retelling_said:
    said_that: { say: [il_a_dit_que], examples: ["Ma sœur a dit qu'elle arrivait demain.", "Il m'a dit que le musée était fermé."] }
    asked: { say: [il_m_a_demande], examples: ["Il m'a demandé si je parlais français.", "Elle m'a demandé d'attendre."] }
    answered: { say: [j_ai_repondu], examples: ["J'ai répondu que oui.", "Je lui ai dit que je ne savais pas."] }
  retelling_heard:
