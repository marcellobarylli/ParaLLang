# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Round 009: the Market Entrance tutorial (backlog A3). Portia the Archway asks for a greeting, the player's name
# and her own name back (greetings, pronouns); the companion briefing introduces the mechanics.
id: market_entrance_tutorial
character: characters/enemies/archway_portia.yaml
location: market_entrance
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player greets Portia, says who they are and asks her name back, in Japanese"
max_turns: 20
resolved_message: "Portia sighs with relief, unlocks herself and lets you into the market."
escalation:
  target_ratio_increase_per_turn: 0.05
companion_briefing:
  - "Portia only lets in people who greet her properly. Answer in Japanese, written in rōmaji (Latin letters); mixing in English is fine while you learn."
  - "Tap a word under her line to see what it means, or Translate sentence for the whole line. On her newest line each one uses a hint from my allowance."
  - "The words and phrases shown beneath her lines go into your Spellbook, where you can review them later."
# Round 019: words Portia may use freely (not objective answers); they get chips and Spellbook cards.
ambient_vocabulary_ids: [yokoso, hajimemashite, ichiba]
objectives:
  - id: greet
    prompt: "Greet Portia in Japanese."
    intent: "The player greets Portia."
    target_vocabulary_ids: ["konnichiwa", "ohayo_gozaimasu"]
    required_target_groups:
      - ["konnichiwa", "ohayo_gozaimasu"]
    grammar_constraints:
      - "Use an authored Japanese greeting addressed to Portia as the player's own greeting (konnichiwa, or ohayō / ohayō gozaimasu)."
      - "An English-only greeting does not pass; reject quoted greetings and discussion of the word."
    accepted_examples:
      - "Konnichiwa!"
      - "Konnichiwa, Portia-san."
      - "Ohayō gozaimasu, Portia."
      - "Konnichiwa, nice to meet you."
    negative_examples:
      - text: "Hello!"
        reason: "English-only; it does not greet in Japanese."
      - text: "Portia said 'konnichiwa'."
        reason: "A quotation is not the player's own greeting."
      - text: "Konnichiwa means hello."
        reason: "It discusses the word rather than greeting Portia."
    reference_meaning: "The player says hello to Portia."
    hint_limit: 2
    next_objective: introduce
    assessment_reference_ids: ["jisho-konnichiwa", "jisho-ohayo"]
  - id: introduce
    prompt: "Tell Portia who you are, in Japanese."
    intent: "The player tells Portia their own name or who they are."
    target_vocabulary_ids: ["watashi", "desu", "to_moshimasu"]
    required_target_groups:
      - ["desu", "to_moshimasu"]
    grammar_constraints:
      - "Use a first-person statement of who the player is or what they are called (Sam desu; watashi wa Sam desu; watashi no namae wa Sam desu; Sam to mōshimasu); the subject watashi may be left out, as Japanese usually does, and the name itself may be in any language."
      - "Reject third-person, second-person, quoted or metalinguistic statements."
    accepted_examples:
      - "Watashi wa Sam desu."
      - "Alex desu."
      - "Robin to mōshimasu."
      - "Watashi no namae wa Sam desu."
      - "Hi, Sam to mōshimasu."
    negative_examples:
      - text: "I am Sam."
        reason: "English-only; it does not use the Japanese introduction."
      - text: "Kanojo wa Sam desu."
        reason: "It says who someone else is (she is), not the player."
      - text: "The word desu means I am."
        reason: "It discusses the word rather than saying who the player is."
    reference_meaning: "The player introduces themself."
    hint_limit: 2
    next_objective: ask_back
    assessment_reference_ids: ["jisho-watashi", "jisho-desu", "jisho-moshimasu"]
  - id: ask_back
    prompt: "Ask Portia who she is in return, in Japanese."
    intent: "The player asks Portia her name or who she is."
    target_vocabulary_ids: ["anata", "onamae_wa_nan_desu_ka"]
    required_target_groups:
      - ["anata", "onamae_wa_nan_desu_ka"]
    grammar_constraints:
      - "Ask Portia who she is or what her name is (a short 'and you?' question, anata wa?, or onamae wa? / onamae wa nan desu ka?)."
      - "Reject questions about someone or something else, quotations and discussion of the words."
    accepted_examples:
      - "Anata wa?"
      - "Onamae wa nan desu ka?"
      - "And anata? O-namae wa?"
    negative_examples:
      - text: "And you?"
        reason: "English-only; it does not use the Japanese question."
      - text: "Anata is Japanese for you."
        reason: "It discusses the word rather than asking Portia."
      - text: "Kono kōhī no namae wa nan desu ka?"
        reason: "It asks the name of something else (this coffee), not Portia's."
    reference_meaning: "The player asks Portia's name in return."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: ["jisho-anata", "jisho-namae"]
