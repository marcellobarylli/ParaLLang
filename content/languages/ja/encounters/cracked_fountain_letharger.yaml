# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Round 011: The Cracked Fountain (backlog A5). Flick the Letharger distracts the player with riddles; the player
# takes control: tells it to stop, tells it which way to go, and insists on now rather than later.
# Round 050 (backlog G5): a fourth objective between direction and now, telling Flick the time.
id: cracked_fountain_letharger
character: characters/enemies/letharger_flick.yaml
location: cracked_fountain
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player tells Flick to stop, tells it which way to go, tells it the time and insists on now, all in Japanese"
max_turns: 20
resolved_message: "Flick holds still for almost a whole second, points the way you told it, and is gone before you can look straight at it. The fountain is quieter, and the jingle has almost left your head."
# Round 025 (backlog B3): a containment notice for the Fountain's infohazard, Flick's jingle.
companion_briefing:
  - "Containment notice, the Cracked Fountain: one brainrot strain. Harm: low. Virulence: very high."
  - "Vector: a jingle. It only works on people who understand it. If you understood it, congratulations."
  - "Containment procedure: do not hum along."
escalation:
  target_ratio_increase_per_turn: 0.05
# Round 028 (backlog B4): the Spellbook's containment file for the Fountain's infohazard (LORE.md: properties
# Virulence, Harm, Incubation, Vector, Containment, in the deadpan SCP voice). Shown once the Fountain is visited.
containment_file:
  designation: "CM-001"
  name: "Ato de, ato de, ashita!"
  class: "Brainrot (mild)"
  virulence: "Very high. It spreads from host to host faster than it can be filed."
  harm: "Low. Hosts put things off, beginning with reading this file."
  incubation: "Immediate on understanding. Listeners who do not understand it are unaffected, and slightly smug about it."
  vector: "Song: a three-word jingle, hummed at the end of every sentence by Flick the Letharger."
  containment: "Do not hum along. Do not translate it for anyone who has not asked. If humming begins, do the thing you were putting off."
  notes:
    - "Recovered at the Cracked Fountain, whose plaque reads PLEASE DO NOT HUM."
    - "Native speakers of the realm's language are immune. The author of this file is not."
  # Round 111 (backlog B8): the companion's redaction (LORE.md, Infohazards, "Gameplay hooks"). Read anyway, it costs
  # a hint per objective in the next conversation finished. The text holds no answer (server test). Authored, not
  # generated; pending a native speaker's review.
  annex:
    id: "cm001_second_verse"
    title: "Annex A: the second verse"
    redaction: "Your companion has blacked out every line of it. \"Trust me on this. If you read it, I will need a while to get over it: a hint fewer for each objective of the next conversation you finish.\""
    text: "Niban, utatte wa ikenai. Yonda mono wa kuchizusamu. Kuchizusanda mono wa oshieru. Oshieta mono wa wasurete, onaji yoru ni, tanin no kuchibiru no ue de futatabi mitsukeru. Kono uta ni owari wa naku, kaeri dake ga aru."
    translation: "Second verse, not to be sung. Whoever reads it hums it; whoever hums it teaches it; whoever teaches it forgets it, and finds it again that same night on the lips of a stranger. This verse has no end: it only has a return."
    glossary:
      - { word: "niban", meaning: "second verse" }
      - { word: "yonda mono", meaning: "whoever reads it" }
      - { word: "kuchizusamu", meaning: "hums" }
      - { word: "oshieru", meaning: "teaches" }
      - { word: "wasurete", meaning: "forgets" }
      - { word: "futatabi mitsukeru", meaning: "finds it again" }
      - { word: "onaji yoru ni", meaning: "that same night" }
      - { word: "kuchibiru", meaning: "lips" }
      - { word: "tanin", meaning: "a stranger" }
      - { word: "kaeri", meaning: "return" }
    exposure_note: "Exposure log: read in full by the bearer of this Spellbook, who has been added to the list of hosts. Containment of the reader is pending."
objectives:
  - id: stop
    prompt: "Flick will not hold still. Tell it to stop, in Japanese."
    intent: "The player tells Flick to stop or keep still, as a command in Japanese."
    target_vocabulary_ids: ["tomatte", "ugokanaide", "yamete"]
    required_target_groups:
      - ["tomatte", "ugokanaide", "yamete"]
    grammar_constraints:
      - "The player's own command or request to stop, keep still or stop it, in Japanese (tomatte, ugokanaide, yamete, with or without kudasai, or a blunter form such as tomare or yamero)."
      - "Other commands (look, listen) do not pass; reject quotations, remarks about Flick and English-only commands."
    accepted_examples:
      - "Tomatte!"
      - "Mō yamete, Flick!"
      - "Ugokanaide kudasai."
    negative_examples:
      - text: "Kiite!"
        reason: "A command, but it tells Flick to listen, not to stop."
      - text: "Stop moving!"
        reason: "English-only; the command must be in Japanese."
      - text: "Flick wa yamete to iimasen."
        reason: "A remark about Flick is not the player's own command."
    reference_meaning: "The player commands Flick to stop moving."
    hint_limit: 2
    next_objective: direction
    assessment_reference_ids: ["jisho-tomaru", "jisho-ugoku", "jisho-yameru"]
  - id: direction
    prompt: "Flick has lost its way again. Tell it which way to go, in Japanese."
    intent: "The player tells Flick a direction to go: left, right or straight on, in Japanese."
    target_vocabulary_ids: ["migi", "hidari", "massugu"]
    required_target_groups:
      - ["migi", "hidari", "massugu"]
    grammar_constraints:
      - "The player's own direction for Flick, in Japanese; any of left (hidari), right (migi) or straight on (massugu) passes."
      - "Reject a question back, quotations and English-only directions."
    accepted_examples:
      - "Hidari e!"
      - "Migi ni itte."
      - "Massugu itte, Flick."
    negative_examples:
      - text: "Left."
        reason: "English-only; the direction must be in Japanese."
      - text: "Migi desu ka, hidari desu ka?"
        reason: "A question back is not a direction for Flick."
    reference_meaning: "The player gives Flick a direction."
    hint_limit: 2
    next_objective: time
    assessment_reference_ids: ["jisho-migi", "jisho-hidari", "jisho-massugu"]
  - id: time
    prompt: "Flick swears it is far too early to do anything. Tell it what time it is, in Japanese."
    intent: "The fountain's clock stopped long ago, and Flick insists it is always far too early to do anything. The player tells Flick what time it is now, in Japanese: an hour, or midday, or midnight. Flick may ask what time it is, but never says a time itself."
    target_vocabulary_ids: ["ji", "shogo", "mayonaka"]
    required_target_groups:
      - ["ji", "shogo", "mayonaka"]
    grammar_constraints:
      - "The player's own statement of the current time, in Japanese, with one of: an hour and ji (sanji desu; han or minutes optional; gozen or gogo optional), shōgo or mayonaka. The hour is a Japanese number word or digits (3-ji, 15ji); a clear hour with a reading slip (yonji for yoji, kyūji for kuji) or without desu passes, and the feedback may name the slip in English."
      - "Fails: now without a time (that is the next objective), a question back, scheduling something for a time instead of saying what time it is, ji without an hour, an impossible hour, an English number, quotations and English-only times."
    accepted_examples:
      - "Sanji desu."
      - "Ima ichiji desu, Flick."
      - "Shōgo desu!"
      - "Jūji han desu."
    negative_examples:
      - text: "Ima!"
        reason: "It says now, not what time it is."
      - text: "Nanji desu ka?"
        reason: "A question back is not the time."
      - text: "Sanji desu ka?"
        reason: "A question back, even with a time in it, is not telling Flick the time."
      - text: "Shōgo ni yarimasu."
        reason: "It schedules something for midday; it does not say what time it is now."
      - text: "Three ji desu."
        reason: "The hour is an English number."
      - text: "Ji desu."
        reason: "Ji alone gives no hour."
      - text: "It is three o'clock."
        reason: "English-only; the time must be in Japanese."
    reference_meaning: "The player tells Flick what time it is."
    hint_limit: 2
    next_objective: now
    assessment_reference_ids: ["jisho-ji", "jisho-shogo", "jisho-mayonaka"]
  - id: now
    prompt: "Flick says you can do it later. Insist on now, in Japanese."
    intent: "The player refuses to put it off and says now, in Japanese. Flick keeps humming its jingle, \"Ato de, ato de, ashita!\" (later, later, tomorrow), a mild brainrot infohazard that makes listeners put things off. Repeating the jingle or agreeing to later does not pass; a refusal that names later or tomorrow and insists on now passes."
    target_vocabulary_ids: ["ima", "ima_sugu"]
    required_target_groups:
      - ["ima", "ima_sugu"]
    grammar_constraints:
      - "The player's own insistence on now, in Japanese (ima, ima sugu or sugu)."
      - "Agreeing to later or tomorrow does not pass; reject quotations and English-only answers."
    accepted_examples:
      - "Iya, ima!"
      - "Ima sugu, Flick."
      - "Ashita ja nakute, ima!"
    negative_examples:
      - text: "Ashita."
        reason: "It agrees to put it off until tomorrow, which is what Flick wants."
      - text: "Ii yo, ato de."
        reason: "It agrees to later."
      - text: "Now!"
        reason: "English-only; the answer must be in Japanese."
      - text: "Ato de, ato de, ashita!"
        reason: "Humming Flick's jingle back puts it off; it does not insist on now."
      - text: "Ima nanji desu ka?"
        reason: "It asks the time; here ima does not insist on doing it now."
    reference_meaning: "The player insists on doing it now."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: ["jisho-ima", "jisho-sugu"]
