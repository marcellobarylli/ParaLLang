# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
id: mortimer_oath
character: characters/enemies/charcutier_mortimer.yaml
party_of: butchers_stall_charcutier
# Round 048 (backlog G6): offered instead of the tasting once Mortimer has finished three conversations, after he has
# recited the forbidden herd passage.
after_conversations: 3
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player calms Mortimer down and promises him something, in Japanese"
max_turns: 20
resolved_message: "Mortimer puts the knife away, asks the ham's permission out loud, and is granted it. He is almost sure."
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: calm_him
    prompt: "Mortimer's knife is shaking over the hamper. Tell him to calm down, using Japanese."
    intent: "Mortimer has travelled with the player for several tastings, so in his greeting he does not introduce himself or describe the place: he greets the player as an old companion. Tonight his knife shakes over the hamper: in his greeting, in a line or two, he admits that he has never once asked a ham for its permission before slicing it, and that he fears he is no better than some hungry sailors in an old story who roasted beasts they had sworn not to touch. The player may not know the story. He never says \"ochitsuite\" or \"yakusoku\" (in dialogue or narration) before the player has, and he does not tell the player what to say."
    target_vocabulary_ids: [ochitsuite]
    required_target_groups:
      - [ochitsuite]
    grammar_constraints:
      - "The player tells Mortimer, in their own words, with the Japanese verb ochitsuku, to calm down (ochitsuite, as one says to an old companion; ochitsuite kudasai is also fine, and daijōbu may go with it)."
      - "Reject English-only lines, quotations, definitions of the word, and lines that say Mortimer is calm as a fact (Mortimer wa ochitsuite imasu) rather than calming him."
    accepted_examples:
      - "Ochitsuite, Mortimer."
      - "Daijōbu, ochitsuite kudasai."
      - "Ochitsuite, it's only a ham."
    negative_examples:
      - text: "Calm down, Mortimer."
        reason: "English-only; it does not use the Japanese word."
      - text: "Ochitsuite means calm down."
        reason: "It discusses the word rather than calming him."
      - text: "Mortimer says ochitsuite."
        reason: "It reports someone else's words."
      - text: "Mortimer wa ochitsuite imasu."
        reason: "It says Mortimer is calm as a fact rather than calming him."
    reference_meaning: "The player tells Mortimer to calm down."
    hint_limit: 2
    next_objective: promise
    assessment_reference_ids: [jisho-ochitsuku]
  - id: promise
    prompt: "Mortimer asks you to swear that you will never touch the sacred herds. Promise him, using Japanese."
    intent: "Calmer now, Mortimer asks the player, very solemnly, to swear that they will never touch the sacred herds, only the ordinary, consenting hams. He waits for the player's promise. He never says \"yakusoku\" (in dialogue or narration) before the player has."
    target_vocabulary_ids: [yakusoku_shimasu]
    required_target_groups:
      - [yakusoku_shimasu]
    grammar_constraints:
      - "The player promises Mortimer, in their own words, with yakusoku and the verb suru (yakusoku shimasu, yakusoku suru yo, or Yakusoku! alone); the I is left out, as usual."
      - "A bare \"Yakusoku shimasu.\" answers his request and passes, and so does a promise not to touch them (Sawaranai to yakusoku shimasu.). Reject English-only promises, promises to touch the herds, refusals (yakusoku shimasen), questions back to Mortimer, quotations, and talk about the word."
    accepted_examples:
      - "Yakusoku shimasu."
      - "Yakusoku suru yo, Mortimer."
      - "Yakusoku shimasu: only the ordinary hams."
      - "Zettai ni sawaranai to yakusoku shimasu."
    negative_examples:
      - text: "I promise."
        reason: "English-only; it does not use the Japanese verb."
      - text: "Yakusoku wa shimasen."
        reason: "It refuses to promise."
      - text: "Yakusoku shite kureru?"
        reason: "It asks Mortimer instead of promising."
      - text: "Zenbu ni sawaru to yakusoku shimasu."
        reason: "It promises the opposite of what Mortimer asks."
    reference_meaning: "The player promises Mortimer never to touch the sacred herds."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: [jisho-yakusoku]
