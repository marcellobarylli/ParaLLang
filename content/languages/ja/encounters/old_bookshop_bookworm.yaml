# Round 013: The Old Bookshop (backlog A6, with B2). Marginalia the Bookworm reads two passages of The Journey and
# asks about each; the player answers in Japanese. The passages are in each objective's intent, so they reach the
# narration prompt.
# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# The hero's false name is Daredemonai ("is not anyone"), as Japanese retellings of the Odyssey render Outis (Nobody):
# a Japanese ear hears it as "it is nobody", so the Cyclops' cry for help still says that nobody is hurting him.
id: old_bookshop_bookworm
character: characters/enemies/bookworm_marginalia.yaml
location: old_bookshop
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player shows, in Japanese, that they understood two passages of The Journey"
max_turns: 20
resolved_message: "Marginalia annotates you as 'promising', sells you a battered copy of The Journey, and goes back to eating the poetry section."
# Round 159 (issue #7): Marginalia has come to know more of the world than most. When the conversation is over the
# narrator tells what Marginalia then utters: a passage of lore, in untranslatable text (lore/truths.yaml).
revelation:
  text: "Before she goes back to the poetry, Marginalia takes off her spectacles, which nobody has seen her do, and for once does not read it from a book. She utters the following: {truth:journey_threads}"
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: home
    prompt: "Marginalia reads you the opening of The Journey. Where is Journathan going? Answer in Japanese."
    intent: >
      Marginalia reads this passage aloud, word for word, in her greeting, right after introducing herself: "Kore wa,
      ōku no kotoba o hanasu otoko, Journathan no monogatari desu. Ie ni kaeru made, kare no tabi wa nijūnen
      kakarimasu." Only then does she ask her question: where is Journathan going? The player answers in Japanese that
      he is going home.
    target_vocabulary_ids: ["ie"]
    required_target_groups:
      - ["ie"]
    grammar_constraints:
      - "Reading comprehension: an answer about Journathan, in the third person, reusing the passage's words or quoting the relevant part of it, is the player's own answer and passes when it says, in Japanese, that he is going home (ie, or the homely uchi, with ni or e: Ie ni kaerimasu, Uchi e kaeru)."
      - "Another detail (how long, a book), an unrelated quotation, English-only answers and questions do not pass."
    accepted_examples:
      - "Ie e."
      - "Ie ni kaerimasu."
      - "Kare wa uchi ni kaerimasu."
    negative_examples:
      - text: "Home."
        reason: "English-only; the answer must be in Japanese."
      - text: "Nijūnen."
        reason: "It says how long the journey lasts, not where he is going."
      - text: "Hon desu."
        reason: "It does not answer the question about the passage."
    reference_meaning: "Journathan is going home."
    hint_limit: 2
    next_objective: name
    assessment_reference_ids: ["jisho-ie"]
  - id: name
    prompt: "Marginalia reads the Cyclops episode. What name did Journathan give the Cyclops? Answer in Japanese."
    intent: >
      Marginalia first reads this passage aloud, word for word, in her dialogue: "Hitotsume no kyojin, Kyukurōpusu
      ga, kare no namae o tazunemasu. Journathan wa kotaemasu: 'Watashi no namae wa Daredemonai desu.'" Only then
      does she ask her question: what name did Journathan give the Cyclops? In the lore it was the first recorded
      translation trick: when the blinded giant cries out that Daredemonai is hurting him, his neighbours hear that
      nobody is. The player answers in Japanese: Daredemonai (Nobody).
    target_vocabulary_ids: ["daredemonai"]
    required_target_groups:
      - ["daredemonai"]
    grammar_constraints:
      - "Reading comprehension: an answer about Journathan, in the third person or as reported speech, reusing the passage's words or quoting the name, is the player's own answer and passes when it gives, in Japanese, the name Daredemonai (Nobody), joined or written apart (dare demo nai)."
      - "His real name, an unrelated quotation, English-only answers and questions do not pass."
    accepted_examples:
      - "Daredemonai."
      - "Namae wa Daredemonai desu."
      - "Kare no namae wa Daredemonai desu."
      - "'Daredemonai' to iimashita."
    negative_examples:
      - text: "Journathan."
        reason: "That is his real name; the passage says he gave the Cyclops a different one."
      - text: "Nobody."
        reason: "English-only; the answer must be in Japanese."
    reference_meaning: "He told the Cyclops his name was Nobody."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: ["jisho-dare-demo-nai"]
