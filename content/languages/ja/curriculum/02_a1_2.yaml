    other_colour: { say: [hoka_no_iro, arimasu_ka], examples: ["Hoka no iro wa arimasu ka?", "Midori wa arimasu ka?"] }
  shopping_try:
    try_on: { say: [shichaku], examples: ["Shichaku shite mo ii desu ka?", "Kono jaketto o kite mite mo ii desu ka?"] }
