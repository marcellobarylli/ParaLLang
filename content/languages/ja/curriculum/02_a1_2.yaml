# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Round 144: the words of curriculum stage A1.2 (the skeleton is content/curriculum/02_a1_2.yaml). The Italian
# original was authored by Claude from the functions of the A1 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. The vocabulary shares one namespace with the earlier stages: an id
# defined in 01_a1_1.yaml is reused here, never redefined, and no new entry repeats an earlier entry's form.
# Round 223: from 01_a1_1.yaml this stage reuses sunde_imasu, omoshiroi, chikai, toi, benkyo_shimasu, zenzen,
# ni_shimasu and kudasai. Long vowels are listed as typed without macrons too (kyō: kyou, kyoo).
stage: a1_2
version: curriculum-a1-2-ja-v1
grammar:
  family: "imasu for people (ani ga imasu; kodomo wa imasen); two sets of family words, your own (haha, chichi, ani, ane) and someone else's (okāsan, otōsan, onīsan, onēsan); no for 'my' and 'your' (watashi no tomodachi); i-adjectives and na-adjectives (se ga takai, shinsetsu na hito)."
  places: "arimasu for things and places (ginkō ga arimasu; eki wa arimasen); X wa doko desu ka; place words after no (eki no mae, ginkō no tonari, X to Y no aida), with ni for where a thing is (eki no mae ni arimasu)."
  directions: "A verb in -te with kudasai for directions (magatte kudasai, itte kudasai); ikimasu with e or ni (eki e ikimasu); de for the means (densha de, basu de) and aruite, 'on foot'; -me for the order (hitotsu-me, futatsu-me)."
  time: "Nan-ji desu ka? ... -ji desu (ichi-ji, but yo-ji, shichi-ji, ku-ji); han for half past and -fun or -pun for minutes; ni after a clock time or a day (hachi-ji ni, getsuyōbi ni) but not after kyō or ashita; the days of the week end in -yōbi."
  routine: "The -masu form for habits as well as the present (roku-ji ni okimasu); -masen for the negative; itsumo, yoku, tokidoki; zenzen with a negative for 'never' (zenzen nomimasen); the place of an action with de (kaisha de hatarakimasu)."
  shopping: "kore, sore, are (this one, that one by you, that one over there) and kono, sono, ano before a noun; colours as nouns and as adjectives (aka, akai; midori no); -te mo ii desu ka to ask leave (kite mite mo ii desu ka); -sugimasu for 'too' (ōkisugimasu); kore ni shimasu, 'I'll take this one'."
lessons:
