vocabulary:
  # family
  ani: { t: "ani", pos: noun, en: ["older brother", "brother"], forms: ["ani", "onīsan", "oniisan", "onii-san"], ex: ["Ani wa Ōsaka ni imasu.", "My older brother is in Osaka."], n: "Your own older brother is ani; someone else's, or yours when you call him, onīsan." }
  ane: { t: "ane", pos: noun, en: ["older sister", "sister"], forms: ["ane", "onēsan", "oneesan", "onē-san", "onee-san"], ex: ["Ane wa Yumi to iimasu.", "My older sister is called Yumi."], n: "Your own older sister is ane; someone else's, or yours when you call her, onēsan." }
  ototo: { t: "otōto", pos: noun, en: ["younger brother", "brother"], forms: ["otōto", "otouto", "otooto", "otōto-san", "otouto-san", "otooto-san", "otōtosan", "otoutosan", "otootosan"], ex: ["Otōto wa daigakusei desu.", "My younger brother is a student."], n: "Japanese has a word for each: older and younger, brother and sister. Someone else's younger brother is otōto-san." }
  imoto: { t: "imōto", pos: noun, en: ["younger sister", "sister"], forms: ["imōto", "imouto", "imooto", "imōto-san", "imouto-san", "imooto-san", "imōtosan", "imoutosan", "imootosan"], ex: ["Imōto ga futari imasu.", "I have two younger sisters."] }
  kyodai: { t: "kyōdai", pos: noun, en: ["brothers and sisters", "siblings"], forms: ["kyōdai", "kyoudai", "kyoodai", "go-kyōdai", "go-kyoudai", "go-kyoodai", "gokyōdai", "gokyoudai", "gokyoodai"], ex: ["Kyōdai wa imasen.", "I have no brothers or sisters."], n: "Someone else's are go-kyōdai." }
  kodomo: { t: "kodomo", pos: noun, en: ["child", "children"], forms: ["kodomo", "kodomo-san", "o-ko-san", "okosan"], ex: ["Kodomo ga futari imasu.", "I have two children."], n: "Someone else's children are o-ko-san. People are counted hitori, futari, then -nin: san-nin." }
  musuko: { t: "musuko", pos: noun, en: ["son"], forms: ["musuko", "musuko-san"], ex: ["Musuko wa jussai desu.", "My son is ten."] }
  musume: { t: "musume", pos: noun, en: ["daughter"], forms: ["musume", "musume-san"], ex: ["Musume wa Kyōto ni sunde imasu.", "My daughter lives in Kyoto."] }
  okasan: { t: "okāsan", pos: noun, en: ["mother", "my mother"], forms: ["okāsan", "okaasan", "o-kāsan", "o-kaasan", "kāsan", "kaasan", "haha wa", "haha ga", "haha no", "haha mo", "haha to"], ex: ["Haha wa Kōbe kara kimashita.", "My mother is from Kobe."], n: "Your own mother is haha; someone else's, or yours when you speak to her, okāsan. Haha alone is not listed: it reads as English laughter." }
  otosan: { t: "otōsan", pos: noun, en: ["father", "my father"], forms: ["otōsan", "otousan", "otoosan", "o-tōsan", "o-tousan", "o-toosan", "tōsan", "tousan", "toosan", "chichi"], ex: ["Chichi wa rokujussai desu.", "My father is sixty."], n: "Your own father is chichi; someone else's, or yours when you speak to him, otōsan." }
  imasu_ka: { t: "imasu ka", pos: phrase, en: ["do you have (brothers, children)", "is there (someone)"], forms: ["imasu ka", "irasshaimasu ka"], ex: ["Kodomo wa imasu ka?", "Do you have children?"], n: "Imasu, 'there is', for people and animals; arimasu for things." }
  donna_hito: { t: "donna hito", pos: phrase, en: ["what kind of person", "what is he like", "what is she like"], forms: ["donna hito", "donna kata", "donna kanji", "dō iu hito", "dou iu hito", "doo iu hito", "dō iu kata", "dou iu kata", "doo iu kata"], ex: ["Onīsan wa donna hito desu ka?", "What is your brother like?"] }
  se_ga_takai: { t: "se ga takai", pos: phrase, en: ["tall"], forms: ["se ga takai", "sei ga takai"], ex: ["Ani wa se ga takai desu.", "My brother is tall."], n: "Literally 'the height is high'." }
  se_ga_hikui: { t: "se ga hikui", pos: phrase, en: ["short"], forms: ["se ga hikui", "sei ga hikui", "hikui"], ex: ["Haha wa se ga hikui desu.", "My mother is short."], n: "Hikui alone is 'low'." }
  wakai: { t: "wakai", pos: adjective, en: ["young"], ex: ["Haha wa mada wakai desu.", "My mother is still young."] }
  nenpai: { t: "nenpai", pos: adjective, en: ["elderly", "old"], forms: ["nenpai", "go-nenpai", "toshiyori"], ex: ["Sofu wa nenpai desu.", "My grandfather is old."], n: "Of a person, nenpai is kinder than toshiyori; furui, 'old', is for things." }
  yasashii: { t: "yasashii", pos: adjective, en: ["kind", "gentle", "easy"], ex: ["Ane wa totemo yasashii desu.", "My sister is very kind."], n: "Also 'easy', of a task." }
  shinsetsu: { t: "shinsetsu", pos: adjective, en: ["kind", "helpful"], ex: ["Shinsetsu na hito desu.", "He is a kind person."], n: "A na-adjective: shinsetsu na hito, 'a kind person'." }
  ii_hito: { t: "ii hito", pos: phrase, en: ["a nice person", "nice"], forms: ["ii hito", "ii kata"], ex: ["Tanaka-san wa ii hito desu.", "Mr Tanaka is a nice person."] }
  tomodachi: { t: "tomodachi", pos: noun, en: ["friend"], forms: ["tomodachi", "yūjin", "yuujin"], ex: ["Ken wa watashi no tomodachi desu.", "Ken is a friend of mine."] }
  issho_ni: { t: "issho ni", pos: adverb, en: ["together"], forms: ["issho ni", "isshoni", "issho"], ex: ["Issho ni tabemashō.", "Let's eat together."] }
  # places
  sagashite_imasu: { t: "sagashite imasu", pos: verb, en: ["I am looking for"], forms: ["sagashite imasu", "sagashiteimasu", "sagashite masu", "sagashite iru", "sagashiteru", "sagashite"], ex: ["Ginkō o sagashite imasu.", "I am looking for a bank."] }
  eki: { t: "eki", pos: noun, en: ["station"], ex: ["Eki wa tōi desu.", "The station is far."], n: "Eki-mae, 'in front of the station', is the centre of most Japanese towns." }
  ginko: { t: "ginkō", pos: noun, en: ["bank"], forms: ["ginkō", "ginkou", "ginkoo"], ex: ["Ginkō wa ku-ji ni akimasu.", "The bank opens at nine."] }
  yakkyoku: { t: "yakkyoku", pos: noun, en: ["pharmacy", "chemist's"], forms: ["yakkyoku", "kusuriya", "doraggusutoa"], ex: ["Yakkyoku o sagashite imasu.", "I am looking for a pharmacy."], n: "A drugstore (doraggusutoa) sells medicine, cosmetics and snacks." }
  hiroba: { t: "hiroba", pos: noun, en: ["square", "plaza"], ex: ["Eki-mae no hiroba wa ōkii desu.", "The square in front of the station is big."] }
  supa: { t: "sūpā", pos: noun, en: ["supermarket"], forms: ["sūpā", "suupaa", "sūpā māketto", "suupaa maaketto"], ex: ["Sūpā wa aite imasu.", "The supermarket is open."] }
  konbini: { t: "konbini", pos: noun, en: ["convenience store"], forms: ["konbini", "kombini"], ex: ["Konbini wa nijūyo-jikan aite imasu.", "The convenience store is open twenty-four hours."] }
  koban: { t: "kōban", pos: noun, en: ["police box"], forms: ["kōban", "kouban", "kooban"], ex: ["Kōban de michi o kikimashō.", "Let's ask the way at the police box."], n: "The small police post on a corner, whose officers give directions all day." }
  doko: { t: "doko", pos: adverb, en: ["where", "where is"], forms: ["doko", "doko desu ka", "doko ni arimasu ka"], ex: ["Toire wa doko desu ka?", "Where is the toilet?"], n: "X wa doko desu ka? 'Where is X?'." }
  kono_chikaku: { t: "kono chikaku", pos: phrase, en: ["near here", "around here"], forms: ["kono chikaku", "kono hen", "kono atari", "koko kara chikai"], ex: ["Kono chikaku ni konbini wa arimasu ka?", "Is there a convenience store near here?"] }
  arimasu_ka: { t: "arimasu ka", pos: phrase, en: ["is there", "do you have"], ex: ["Kono chikaku ni ginkō wa arimasu ka?", "Is there a bank near here?"], n: "Arimasu for things and places, imasu for people and animals." }
  arimasu: { t: "arimasu", pos: verb, en: ["there is", "there are", "we have"], ex: ["Eki no mae ni kōban ga arimasu.", "There is a police box in front of the station."] }
  arimasen: { t: "arimasen", pos: verb, en: ["there is no", "there isn't", "we don't have"], forms: ["arimasen", "nai desu"], ex: ["Koko ni wa ginkō wa arimasen.", "There is no bank here."] }
  tonari: { t: "tonari", pos: noun, en: ["next to", "beside"], forms: ["tonari", "yoko"], ex: ["Ginkō wa eki no tonari desu.", "The bank is next to the station."], n: "X no tonari: 'next to X'. The place word comes after the thing, with no." }
  mae: { t: "mae", pos: noun, en: ["in front of", "opposite", "before"], forms: ["mae", "mukai", "mukaigawa"], ex: ["Eki no mae de aimashō.", "Let's meet in front of the station."], n: "Mukai is 'opposite, across the road'." }
  ushiro: { t: "ushiro", pos: noun, en: ["behind"], forms: ["ushiro", "ura"], ex: ["Sūpā wa hiroba no ushiro desu.", "The supermarket is behind the square."], n: "Ura is 'the back of' a building." }
  aida: { t: "aida", pos: noun, en: ["between"], ex: ["Kissaten wa ginkō to eki no aida desu.", "The café is between the bank and the station."], n: "X to Y no aida: 'between X and Y'." }
  # directions
  michi_ni_mayoimashita: { t: "michi ni mayoimashita", pos: phrase, en: ["I am lost", "I got lost"], forms: ["michi ni mayoimashita", "mayoimashita", "mayotte shimaimashita", "mayotchatta", "mayotte imasu"], ex: ["Sumimasen, michi ni mayoimashita.", "Excuse me, I am lost."], n: "The same for a man and a woman." }
  do_ikimasu_ka: { t: "dō ikimasu ka", pos: phrase, en: ["how do I get to", "how do I get there"], forms: ["dō ikimasu ka", "dou ikimasu ka", "doo ikimasu ka", "dō ikeba ii desu ka", "dou ikeba ii desu ka", "doo ikeba ii desu ka", "dō ikeba ii", "dou ikeba ii", "doo ikeba ii", "dō ittara ii", "dou ittara ii", "doo ittara ii", "dō yatte ikimasu ka", "dou yatte ikimasu ka", "doo yatte ikimasu ka", "dō yatte iku", "dou yatte iku", "doo yatte iku", "ikikata"], ex: ["Kōen made dō ikimasu ka?", "How do I get to the park?"], n: "X made dō ikeba ii desu ka? 'How should I go to X?'" }
  michi: { t: "michi", pos: noun, en: ["road", "street", "way"], forms: ["michi", "kono michi"], ex: ["Eki e no michi desu.", "It is the road to the station."] }
  magatte_kudasai: { t: "magatte kudasai", pos: verb, en: ["please turn", "turn"], forms: ["magatte kudasai", "magatte", "magarimasu", "magaru"], ex: ["Ginkō no kado o migi ni magatte kudasai.", "Turn right at the corner by the bank."], n: "A verb in -te with kudasai asks a stranger to do something; to a friend, magatte alone." }
  hidari: { t: "hidari", pos: noun, en: ["left", "on the left"], forms: ["hidari", "hidarigawa"], ex: ["Yakkyoku wa hidari desu.", "The pharmacy is on the left."] }
  migi: { t: "migi", pos: noun, en: ["right", "on the right"], forms: ["migi", "migigawa"], ex: ["Kōban wa migigawa ni arimasu.", "The police box is on the right."] }
  massugu: { t: "massugu", pos: adverb, en: ["straight on", "straight ahead"], forms: ["massugu", "zutto massugu"], ex: ["Hiroba made massugu itte kudasai.", "Go straight on as far as the square."] }
  hitotsume: { t: "hitotsu-me", pos: phrase, en: ["the first", "the first one"], forms: ["hitotsu-me", "hitotsume", "futatsu-me", "futatsume", "mittsu-me", "mittsume", "tsugi no"], ex: ["Hitotsu-me no kado o hidari desu.", "It's left at the first corner."], n: "-me gives the order: hitotsu-me, futatsu-me, mittsu-me, the first, second and third. Directions count corners (kado) and traffic lights (shingō) more than streets; tsugi no kado is 'the next corner'." }
  kippu: { t: "kippu", pos: noun, en: ["ticket"], forms: ["kippu", "jōshaken", "joushaken", "jooshaken"], ex: ["Kōbe made no kippu desu.", "A ticket to Kobe."], n: "Tickets are counted with -mai: ichi-mai, ni-mai." }
