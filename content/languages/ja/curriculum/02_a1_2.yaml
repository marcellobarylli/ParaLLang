  routine_day:
    wake: { say: [me_ga_samemasu, okimasu], examples: ["Shichi-ji ni me ga samemasu.", "Hachi-ji ni okimasu."] }
    work: { say: [hatarakimasu, shigoto, benkyo_shimasu], examples: ["Kaisha de hatarakimasu.", "Daigaku de benkyō shite imasu."] }
    evening: { say: [bangohan, tabemasu, nemasu], examples: ["Shichi-ji ni bangohan o tabemasu.", "Jū-ji ni nemasu.", "Hachi-jikan nemasu."] }
  routine_often:
    always: { say: [itsumo, yoku], examples: ["Itsumo kōhī o nomimasu.", "Yoku eigakan ni ikimasu."] }
    never: { say: [zenzen, ichido_mo], examples: ["Bīru wa zenzen nomimasen.", "Terebi wa zenzen mimasen."] }
    sometimes: { say: [tokidoki, mainichi], examples: ["Tokidoki ryōri o shimasu.", "Mainichi hatarakimasu."] }
  routine_free:
    ask_free: { say: [hima_na_toki, shumi, nani_o_shimasu_ka], examples: ["Hima na toki, nani o shimasu ka?", "Shumi wa nan desu ka?"] }
    free_time: { say: [yomimasu, mimasu, kikimasu, asobimasu, gemu, dekakemasu], examples: ["Hon o takusan yomimasu.", "Eiga o mimasu. Ongaku mo kikimasu.", "Tomodachi to gēmu o shimasu."] }
    weekend: { say: [shumatsu], examples: ["Shūmatsu wa tomodachi to dekakemasu.", "Shūmatsu wa yoku nemasu."] }
  shopping_ask:
