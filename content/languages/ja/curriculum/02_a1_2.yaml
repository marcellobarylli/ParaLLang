    front_behind: { say: [mae, ushiro], examples: ["Yakkyoku wa eki no mae desu.", "Ginkō no ushiro desu."] }
    between: { say: [aida], examples: ["Ginkō to yakkyoku no aida desu."] }
  directions_ask:
    lost: { say: [michi_ni_mayoimashita], examples: ["Michi ni mayoimashita.", "Sumimasen, mayotte shimaimashita."] }
    how_to_get: { say: [do_ikimasu_ka], examples: ["Eki made dō ikeba ii desu ka?", "Sumimasen, Shibuya e wa dō ikimasu ka?"] }
    right_road: { say: [michi], examples: ["Kono michi de ii desu ka?", "Eki wa kono michi desu ka?"] }
  directions_turn:
    turn: { say: [[magatte_kudasai], [hidari, migi]], examples: ["Hidari ni magatte kudasai.", "Migi e magatte kudasai."] }
    straight: { say: [massugu], examples: ["Massugu itte kudasai.", "Zutto massugu desu."] }
