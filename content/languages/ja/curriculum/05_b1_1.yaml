    surprised: { say: [bikkuri_shimashita], examples: ["Bikkuri shimashita!", "Zenzen yosō shite imasen deshita."] }
  feelings_ask:
    whats_wrong: { say: [do_shita_n_desu_ka], examples: ["Dō shita n desu ka?", "Nani ka atta n desu ka?"] }
    why_sad: { say: [kanashii_n_desu_ka], examples: ["Dōshite kanashii n desu ka?", "Genki ga nai desu ne."] }
    can_i_help: { say: [tetsudaimasho_ka], examples: ["Tetsudaimashō ka?", "Nani ka dekiru koto wa arimasu ka?"] }
  feelings_comfort:
