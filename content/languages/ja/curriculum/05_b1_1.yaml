stage: b1_1
version: curriculum-b1-1-ja-v1
grammar:
  opinions: "A plain form + to omoimasu (oishii to omoimasu, ii machi da to omoimasu); watashi to shite wa; dō omoimasu ka; sansei desu, sō wa omoimasen; kara desu and da kara for a reason (kara alone is a particle and is not enough), dakara for 'so', tatoeba."
  advice: "Plain past + hō ga ii desu for 'you should' (yasunda hō ga ii desu); ~ koto mo dekimasu and ~ to ii desu yo for other suggestions; watashi nara, 'if I were you'; dō shitara ii desu ka; osusume shimasu."
  stories: "The te imashita form for the scene (hon o yonde imashita, ame ga futte imashita) against the -mashita past for the events (mimashita, kaerimashita); ~ aida ni, totsuzen, sore kara, kekkyoku."
  problems: "The -mashita past and te shimaimashita for what went wrong (nakushite shimaimashita, wasuremashita); densha ni noriokuremashita for a missed train; machigai ga arimasu; dō sureba ii desu ka."
  feelings: "Adjectives of feeling for oneself (ureshii desu, kanashii desu, shinpai desu); n desu ka to ask after someone (dō shita n desu ka); the negative request -naide (shinpai shinaide kudasai)."
  polite_requests: "te-form + itadakemasen ka or kuremasen ka for requests (akete itadakemasen ka); -tai n desu ga to soften a wish; no hō ga ii n desu ga; ~ koto wa dekimasu ka; a refusal left unfinished: chotto muzukashii desu."
