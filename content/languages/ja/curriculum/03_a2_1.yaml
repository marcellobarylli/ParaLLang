    tired: { say: [tsukarete_imasu], examples: ["Totemo tsukarete imasu.", "Tsukaremashita."] }
    must_rest: { say: [yasumanakereba_narimasen], examples: ["Yasumanakereba narimasen.", "Nete inakereba narimasen."] }
  health_help:
    need: { say: [[hitsuyo], [isha, yakkyoku]], examples: ["Isha ga hitsuyō desu.", "Isha ka yakkyoku ga hitsuyō desu.", "Sumimasen, isha ga hitsuyō nan desu."] }
    something_for: { say: [kusuri], examples: ["Zutsū no kusuri wa arimasu ka?", "Seki no kusuri o kudasai."] }
