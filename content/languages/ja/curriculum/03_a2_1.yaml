# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Round 144: the words of curriculum stage A2.1 (the skeleton is content/curriculum/03_a2_1.yaml). The Italian
# original was authored by Claude from the functions of the A2 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. The vocabulary shares one namespace with the earlier stages: an id
# defined in an earlier file is reused here, never redefined, and no new entry repeats an earlier entry's form.
# Round 223: the A1 stages were written at the same time by another agent, so this file defines every word it uses
# (natural ids, so that a word the A1 stages define too has the same id and the merge keeps the earlier one).
stage: a2_1
version: curriculum-a2-1-ja-v1
grammar:
  past_did: "The polite past: -masu becomes -mashita (tabemashita, nomimashita, mimashita, kaimashita, shimashita) and -masen deshita in the negative; the object takes o (sushi o tabemashita); kinō, senshū."
  past_went: "The past of verbs of movement (ikimashita, demashita, tsukimashita, kaerimashita), with ni or e for the place and ni for the time (hachiji ni demashita); ... to issho ni, hitori de; tanoshikatta desu, the past of an i-adjective."
  weather: "Weather with desu and with ga (atsui desu, samui desu, hare desu, ame ga futte imasu, kaze ga tsuyoi desu); haru, natsu, aki, fuyu with wa; the past (samukatta desu, ame ga furimashita); ame no hi wa, ... toki wa for 'when'."
  restaurant: "Requests with ... o onegaishimasu and ... ni shimasu, 'I'll have' (mein wa sakana ni shimasu); yoyaku shitai n desu ga; people counted with hitori, futari, then -nin (sannin, yonin); ... ga arimasen for what is missing; mō hitotsu."
  health: "... ga itai desu with a part of the body (atama ga itai desu); kaze o hikimashita, netsu ga arimasu, seki ga demasu; ... kara for 'since'; must: the -nakereba form and narimasen (yasumanakereba narimasen)."
  plans: "Want to: the -masu stem + tai desu (ikitai desu); must: -nakereba narimasen; can: ikemasu, ikemasen, dekimasu; the plain form + tsumori desu for an intention and + tokoro desu for 'just about to'; the non-past with a time word for a plan (raishū Kyōto ni ikimasu)."
