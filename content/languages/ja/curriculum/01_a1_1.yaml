    i_dont_like: { say: [suki_ja_nai], examples: ["Bīru wa suki ja nai desu."] }
    do_you_like: { say: [suki_desu_ka], examples: ["Nihonshu wa suki desu ka?", "Kore, suki desu ka?"] }
