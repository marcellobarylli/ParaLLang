# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Round 144: the words of curriculum stage A1.1 (the skeleton is content/curriculum/01_a1_1.yaml). The Italian
# original was authored by Claude from the functions of the A1 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. A vocabulary entry is { t: target, pos, en: [meanings], forms: [...], ex: [example, English] };
# `forms` defaults to the target, and matching ignores case and accents. `say` is the words that meet an objective:
# one list means any of them, a list of lists means one from each.
# Round 223: modified Hepburn with macrons; each form with a long vowel is also listed as typed without them (kōhī:
# kouhii, koohii; the bare kohi is the fold). A word that would read as English or as a particle on its own (go, mama,
# haha, sore, are, aka, ni, san) is listed only inside a phrase; its note says so.
# Round 223 merge: omoshiroi takes omoshirokatta and sorekara sono ato (the B1 stages reuse them); no_ho_ga leaves hō ga
# ii to the B1 'you should' (ho_ga_ii); mata_ato_de is also plain 'later'.
stage: a1_1
version: curriculum-a1-1-ja-v1
grammar:
  greetings: "desu after a noun (Sam desu; watashi wa Sam desu) and to mōshimasu, the humble way to give your name; polite desu and masu forms with strangers, plain forms with friends; -san after another person's name, never your own, and the name in place of anata ('you')."
  origins: "X kara kimashita (I come from X), X shusshin desu; X ni sunde imasu (I live in X); doko (where), doko kara, doko ni; a country with -go is its language (eigo, nihongo) and with -jin its people (igirisujin)."
  courtesy: "Polite formulas; the negative in -masen (wakarimasen); a thing with o and onegaishimasu or kudasai (mizu o kudasai); a verb in -te with kudasai to ask for it to be done (mō ichido itte kudasai)."
  numbers: "Numbers to a hundred: ichi, ni, san, yon, go, roku, nana, hachi, kyū, jū, then nijū, sanjū, nijūgo; -sai for age (nijūgo-sai desu, with hatachi for twenty); ikutsu, ikura, and nan- with a counter (nan-sai, nan-nin)."
  cafe: "X o kudasai and X o onegaishimasu; X ni shimasu (I'll have X); no articles and no plural (kōhī is 'a coffee' and 'coffees'); mo in place of o for 'also' (kēki mo kudasai), sore kara for 'and then'."
  likes: "X ga suki desu and X wa suki ja nai desu; daisuki, kirai, daikirai, and the politer nigate; totemo, and zenzen with a negative; kara after the reason (amai kara desu), and dōshite to ask why; watashi mo for 'me too' and 'me neither'."
