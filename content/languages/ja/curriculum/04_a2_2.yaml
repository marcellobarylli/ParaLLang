# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Round 144: the words of curriculum stage A2.2 (the skeleton is content/curriculum/04_a2_2.yaml). The Italian
# original was authored by Claude from the functions of the A2 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. The vocabulary shares one namespace with the earlier stages: an id
# defined in an earlier file is reused here, never redefined, and no new entry repeats an earlier entry's form.
# Round 223: the A1 stages were written at the same time by another agent, so this file defines the A1 words it uses
# (natural ids: omoshiroi, kara_desu) and reuses those of 03_a2_1.yaml (ikemasen, yoyaku, isha, issho_ni).
# Round 223 merge: omoshiroi, benkyo_shimasu, hatarakimasu, shigoto and nani_o_shimasu_ka are the A1 entries (this
# file's copies removed) and kara_desu is A1's kara; no_ho_ga_ii takes the B1 forms (hō ga ii n desu ga); maitoshi leaves
# maiasa and maiban to mainichi (A1).
stage: a2_2
version: curriculum-a2-2-ja-v1
grammar:
  invitations: "Inviting with the negative question -masen ka, 'won't you' (eiga o mi ni ikimasen ka?); suggesting with -mashō, 'let's', and ... wa dō desu ka, 'how about'; zehi, mochiron to accept; zannen desu ga ... to decline, or a sumimasen and a trailing chotto ..., which says no without saying it."
  comparisons: "A wa B yori ... desu, 'A is more ... than B' (Tōkyō wa Ōsaka yori ōkii desu); A no hō ga ..., 'A is the more ...'; dochira ga ... desu ka for two things; ichiban for the most; ... to onaji gurai for 'as ... as'; onaji, chigaimasu. The adjective itself does not change."
  travel: "... o onegaishimasu with a noun (daburu no heya o onegaishimasu); nights counted with -haku (ippaku, nihaku, sanpaku); ... de yoyaku shite imasu; ... ga kowarete imasu, ... ga demasen; questions with nanji and tsuite imasu ka, 'is it included'."
  used_to: "Japanese has no imperfect: the past (-mashita, deshita) with kodomo no koro or mukashi, and -te imashita for what went on for a time or regularly (sunde imashita, shite imashita); ... ga arimashita for what there was; ima wa, mō arimasen."
  future: "Japanese has no future tense: the non-past -masu with a time word (rainen Nihon ni ikimasu); -ō to omoimasu for an intention; deshō for a prediction, tabun and kamoshiremasen for a less sure one; -ku narimasu and ni narimasu, 'it will be'; yakusoku shimasu."
  work: "A job with desu and no article (kyōshi desu, gakusei desu), or ... to shite hataraite imasu; ... de hataraite imasu for the place; hajimarimasu and owarimasu with a time and ni; ... ni naritai desu; ... kara desu for 'because'."
