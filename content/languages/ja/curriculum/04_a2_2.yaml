vocabulary:
  # invitations
  ikimasen_ka: { t: "ikimasen ka", pos: phrase, en: ["won't you go", "would you like to go", "shall we go"], forms: ["ikimasen ka", "tabemasen ka", "nomimasen ka", "mimasen ka", "shimasen ka", "dekakemasen ka"], ex: ["Konban, issho ni dekakemasen ka?", "Would you like to go out with me this evening?"], n: "The negative question, -masen ka, is the polite invitation: issho ni tabemasen ka?" }
  kimasen_ka: { t: "kimasen ka", pos: phrase, en: ["won't you come", "do you want to come"], forms: ["kimasen ka", "irasshaimasen ka"], ex: ["Issho ni umi ni kimasen ka?", "Do you want to come to the sea with us?"] }
  do_desu_ka: { t: "dō desu ka", pos: phrase, en: ["how about", "what about"], forms: ["dō desu ka", "doo desu ka", "dou desu ka", "ikaga desu ka"], ex: ["Doyōbi wa dō desu ka?", "What about Saturday?"], n: "'Ikaga desu ka' is the more polite way." }
  ikimasho: { t: "ikimashō", pos: verb, en: ["let's go", "shall we go"], forms: ["ikimashō", "ikimashoo", "ikimashou", "tabemashō", "tabemashoo", "tabemashou", "shimashō", "shimashoo", "shimashou", "nomimashō", "nomimashoo", "nomimashou", "mimashō", "mimashoo", "mimashou"], ex: ["Piza o tabe ni ikimashō ka?", "Shall we go and eat a pizza?"], n: "-mashō is 'let's'; -mashō ka, 'shall we'." }
  doko_de_aimasho_ka: { t: "doko de aimashō ka", pos: phrase, en: ["where shall we meet"], forms: ["doko de aimashō ka", "doko de aimashō", "doko de aimashoo", "doko de aimashou", "nanji ni aimashō", "nanji ni aimashoo", "nanji ni aimashou", "itsu aimashō", "itsu aimashoo", "itsu aimashou", "doko de au", "nanji ni au", "machiawase"], ex: ["Ashita wa doko de aimashō ka?", "Where shall we meet tomorrow?"], n: "'Machiawase' is the arranged meeting, its place and its time." }
  zehi: { t: "zehi", pos: adverb, en: ["I'd love to", "by all means", "gladly"], forms: ["zehi", "yorokonde"], ex: ["Hai, zehi!", "Yes, I'd love to!"], n: "'Yorokonde' is 'with pleasure'." }
  mochiron: { t: "mochiron", pos: adverb, en: ["of course", "certainly"], forms: ["mochiron"], ex: ["Mochiron, ikimasu.", "Of course, I'm coming."] }
  ii_kangae: { t: "ii kangae", pos: phrase, en: ["good idea"], forms: ["ii kangae", "ii aidea", "ii aidia"], ex: ["Ii kangae desu ne.", "That's a good idea."] }
  motte_iku: { t: "motte iku", pos: phrase, en: ["to bring", "shall I bring"], forms: ["motte iku", "motte ikimasu", "motte ikimashō", "motte ikimashoo", "motte ikimashou", "motte ikeba"], ex: ["Nomimono o motte ikimashō ka?", "Shall I bring something to drink?"], n: "Motte iku is to take something along; nani ka is 'something'." }
  zannen: { t: "zannen", pos: adjective, en: ["unfortunately", "what a pity"], forms: ["zannen", "zannen nagara", "ainiku"], ex: ["Zannen desu ga, shigoto ga arimasu.", "Unfortunately I am working."], n: "'Zannen desu ne!' is 'what a pity!'. A Japanese refusal is often only begun: doyōbi wa chotto ..." }
  isogashii: { t: "isogashii", pos: adjective, en: ["busy", "I am busy"], forms: ["isogashii", "yotei ga arimasu", "yotei ga aru", "yōji ga arimasu", "yooji ga arimasu", "youji ga arimasu", "yakusoku ga arimasu"], ex: ["Doyōbi wa isogashii desu.", "On Saturday I am busy."], n: "'Yotei ga arimasu' is 'I have plans'; 'yōji ga arimasu', 'I have something to do'." }
  mata_kondo: { t: "mata kondo", pos: phrase, en: ["another time", "next time"], forms: ["mata kondo", "kondo", "betsu no hi", "mata no kikai"], ex: ["Ja, mata kondo.", "Well, another time."] }
  # comparisons
  dochira: { t: "dochira", pos: pronoun, en: ["which", "which one"], forms: ["dochira", "dotchi"], ex: ["Dochira ga ii desu ka?", "Which one do you prefer?"], n: "Of two things. 'Dotchi' is the everyday form." }
  yori_okii: { t: "yori ōkii", pos: phrase, en: ["bigger than"], forms: ["yori ōkii", "yori ookii", "no hō ga ōkii", "no hoo ga ookii", "no hou ga ookii"], ex: ["Ōsaka wa Kyōto yori ōkii desu.", "Osaka is bigger than Kyoto."], n: "'Than' is yori, after the thing compared with: A wa B yori ōkii desu." }
  yori_chiisai: { t: "yori chiisai", pos: phrase, en: ["smaller than"], forms: ["yori chiisai", "no hō ga chiisai", "no hoo ga chiisai", "no hou ga chiisai"], ex: ["Shinshitsu wa daidokoro yori chiisai desu.", "The bedroom is smaller than the kitchen."] }
  yori_yasui: { t: "yori yasui", pos: phrase, en: ["cheaper than", "cheaper"], forms: ["yori yasui", "no hō ga yasui", "no hoo ga yasui", "no hou ga yasui"], ex: ["Basu wa densha yori yasui desu.", "The bus is cheaper than the train."] }
  yori_takai: { t: "yori takai", pos: phrase, en: ["more expensive than", "dearer"], forms: ["yori takai", "no hō ga takai", "no hoo ga takai", "no hou ga takai"], ex: ["Nihonshu wa bīru yori takai desu.", "Sake is more expensive than beer."] }
  no_ho_ga_ii: { t: "no hō ga ii", pos: phrase, en: ["better", "I would rather"], forms: ["no hō ga ii", "no hoo ga ii", "no hou ga ii", "no hō ga ii desu", "no hoo ga ii desu", "no hou ga ii desu", "yori ii", "yori ii desu", "hō ga ii n desu ga", "hoo ga ii n desu ga", "hou ga ii n desu ga", "hō ga ii n desu kedo", "hoo ga ii n desu kedo", "hou ga ii n desu kedo"], ex: ["Kyō no hō ga ii desu.", "Today is better."], n: "A no hō ga ii: A is better. 'Hō ga ii' after a verb is 'you had better'." }
  yori_warui: { t: "yori warui", pos: phrase, en: ["worse", "worse than"], forms: ["yori warui", "no hō ga warui", "no hoo ga warui", "no hou ga warui", "motto warui"], ex: ["Kyō wa kinō yori guai ga warui desu.", "Today I feel worse than yesterday."] }
  ichiban: { t: "ichiban", pos: adverb, en: ["the best", "the most", "number one"], forms: ["ichiban", "saikō", "saikoo", "saikou"], ex: ["Kono aisu ga ichiban oishii desu.", "This ice cream is the best."], n: "Ichiban before an adjective makes the most: ichiban ōkii, the biggest. 'Saikō' is 'the best ever'." }
  onaji_gurai: { t: "onaji gurai", pos: phrase, en: ["as ... as", "about the same"], forms: ["onaji gurai", "onaji kurai"], ex: ["Watashi wa haha to onaji gurai se ga takai desu.", "I am as tall as my mother."], n: "B to onaji gurai: as much as B." }
  onaji: { t: "onaji", pos: adjective, en: ["the same"], forms: ["onaji"], ex: ["Nedan wa onaji desu.", "The price is the same."] }
  chigaimasu: { t: "chigaimasu", pos: verb, en: ["it is different", "they are different"], forms: ["chigaimasu", "chigau", "kotonarimasu"], ex: ["Iro ga chigaimasu.", "The colour is different."], n: "Also 'that's not right': iie, chigaimasu." }
  # travel
  heya: { t: "heya", pos: noun, en: ["room", "bedroom"], forms: ["heya", "oheya", "shinguru", "daburu", "tsuin", "washitsu"], ex: ["Heya wa nikai desu.", "The room is on the first floor."], n: "Shinguru for one person, daburu or tsuin for two; a washitsu is a Japanese-style room with tatami." }
  ippaku: { t: "ippaku", pos: noun, en: ["one night", "night"], forms: ["ippaku", "nihaku", "sanpaku", "yonhaku", "gohaku", "nanpaku", "hitoban", "futaban"], ex: ["Ippaku ikura desu ka?", "How much is it for one night?"], n: "Nights are counted with -haku: ippaku, nihaku, sanpaku, yonhaku. 'Nanpaku desu ka?' is 'how many nights?'." }
  namae_de: { t: "namae de", pos: phrase, en: ["in the name of", "under the name"], forms: ["namae de", "to iu namae de"], ex: ["Suzuki no namae de yoyaku shite imasu.", "There is a booking in the name of Suzuki."], n: "Or with de alone: Suzuki de yoyaku shite imasu." }
  kowarete_imasu: { t: "kowarete imasu", pos: phrase, en: ["it is broken", "it doesn't work"], forms: ["kowarete imasu", "kowareteimasu", "kowarete iru", "kowaremashita", "ugokimasen", "tsukimasen"], ex: ["Denki ga tsukimasen.", "The light doesn't work."], n: "'Ugokimasen' is 'it won't go'; 'tsukimasen', 'it won't come on'." }
  oyu: { t: "oyu", pos: noun, en: ["hot water"], forms: ["oyu", "o-yu"], ex: ["Ofuro no oyu ga demasen.", "There is no hot water in the bath."], n: "Hot water has its own word; mizu is cold water. '... ga demasen' is '... does not come out'." }
  urusai: { t: "urusai", pos: adjective, en: ["noisy", "too much noise"], forms: ["urusai", "oto ga ōkii", "oto ga ookii"], ex: ["Yoru wa urusai desu.", "At night it is noisy."] }
  heya_o_kaeru: { t: "heya o kaeru", pos: phrase, en: ["to change rooms"], forms: ["heya o kaeru", "heya o kaete", "heya o kaetai", "heya o kaemasu", "betsu no heya", "hoka no heya"], ex: ["Heya o kaetai n desu ga.", "I would like to change rooms."] }
  choshoku: { t: "chōshoku", pos: noun, en: ["breakfast"], forms: ["chōshoku", "chooshoku", "choushoku", "asagohan", "asa gohan"], ex: ["Chōshoku wa hachiji desu.", "Breakfast is at eight."], n: "'Asagohan' is the everyday word; a hotel says chōshoku. 'Tsuite imasu ka?' is 'is it included?'." }
  chekkuauto: { t: "chekkuauto", pos: noun, en: ["check-out", "to leave the room"], forms: ["chekkuauto", "chekku auto", "chekku-auto"], ex: ["Chekkuauto wa jūji desu.", "Check-out is at ten."] }
  okurete_imasu: { t: "okurete imasu", pos: phrase, en: ["it is late", "it is delayed"], forms: ["okurete imasu", "okureteimasu", "okurete iru", "okuremasu", "okure"], ex: ["Basu ga okurete imasu.", "The bus is late."], n: "'Nanpun okurete imasu ka?' is 'how many minutes late is it?'." }
  # used_to
  kodomo_no_koro: { t: "kodomo no koro", pos: phrase, en: ["as a child", "when I was little"], forms: ["kodomo no koro", "kodomo no toki", "chiisai koro", "chiisai toki"], ex: ["Kodomo no koro, Fukuoka ni sunde imashita.", "As a child I lived in Fukuoka."] }
  deshita: { t: "deshita", pos: verb, en: ["I was", "it was"], forms: ["deshita", "datta"], ex: ["Shizuka na kodomo deshita.", "I was a quiet child."], n: "The past of desu. An i-adjective has its own past: chiisai, chiisakatta." }
  sunde_imashita: { t: "sunde imashita", pos: phrase, en: ["I lived", "I used to live"], forms: ["sunde imashita", "sundeimashita", "sunde ita"], ex: ["Umi no chikaku ni sunde imashita.", "I used to live near the sea."], n: "-te imashita says what went on for a time: sunde imashita, I was living there." }
  motte_imashita: { t: "motte imashita", pos: phrase, en: ["I had", "I used to have"], forms: ["motte imashita", "motteimashita", "motte ita", "katte imashita", "katteimashita", "katte ita"], ex: ["Kuroi neko o katte imashita.", "I had a black cat."], n: "A pet is kept: inu o katte imashita, I had a dog." }
  shite_imashita: { t: "shite imashita", pos: phrase, en: ["I used to do", "I used to play"], forms: ["shite imashita", "shiteimashita", "shite ita"], ex: ["Mainichi sakkā o shite imashita.", "I used to play football every day."], n: "Sports are done with suru: sakkā o shimasu, I play football." }
  asonde_imashita: { t: "asonde imashita", pos: phrase, en: ["I played", "I used to play"], forms: ["asonde imashita", "asondeimashita", "asonde ita", "asobimashita"], ex: ["Kōen de asonde imashita.", "I used to play in the park."] }
  maitoshi: { t: "maitoshi", pos: adverb, en: ["every year"], forms: ["maitoshi", "mainen", "maishū", "maishuu", "natsu ni naru to"], ex: ["Maitoshi natsu ni yama ni ikimashita.", "Every summer we went to the mountains."], n: "Mai- is 'every': maitoshi, every year; maishū, every week." }
