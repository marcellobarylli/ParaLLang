  future_promise:
    promise: { say: [yakusoku_shimasu], examples: ["Kanarazu mata kuru to yakusoku shimasu.", "Yakusoku shimasu!"] }
    will_return: { say: [mata_kimasu, kakimasu, denwa_shimasu], examples: ["Mata kimasu.", "Tegami o kakimasu.", "Ashita denwa shimasu."] }
    not_forget: { say: [wasuremasen], examples: ["Wasuremasen.", "Zettai ni wasuremasen."] }
  work_job:
    ask_job: { say: [oshigoto_wa_nan_desu_ka], examples: ["Oshigoto wa nan desu ka?", "Donna oshigoto o shite imasu ka?"] }
    my_job: { say: [to_shite, gakusei, kyoshi, kaishain, ryorinin, kangoshi, isha], examples: ["Ryōrinin desu.", "Kyōshi desu.", "Gakusei desu.", "Kangoshi to shite hataraite imasu."] }
