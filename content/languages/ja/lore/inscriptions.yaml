# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Round 082: inscriptions, lore hidden in plain sight (parallang_obsidian/GAME MECHANICS.md, "Dark souls-like
# storytelling"; prototype.md Phase 3, "discoverable items"). One per location, found by visiting it. Optional to
# translate: the map card shows only `where` and `text`; the Spellbook holds the translation and glossary, withheld
# during encounters. No inscription holds a vocabulary form of the pack or a party conversation's stem (server
# test), so the text may show at any time. `where` and `translation` are the same English in every pack (tested).
# Authored, not generated. Pending a native speaker's review.
# Round 223: carved and chalked texts are in the written plain style (da, de aru), and the menu board in a shop's
# humble keigo; neither holds desu / masu forms, koko (here) or a word starting hito (Marginalia's hitori).
inscriptions:
  - id: keystone
    location: market_entrance
    where: "Carved on the keystone of the archway, half worn away by people looking up."
    text: "Hairu mono wa, sono eda no koe o mi ni matou. Deru mono wa, derareru no nara, sono kakera o tsume no aida ni hasande mochisaru."
    translation: "Whoever enters takes on the voice of the branch they stand in. Whoever leaves, if they leave, takes some of it away under their fingernails."
    glossary:
      - { word: "hairu mono", meaning: "whoever enters" }
      - { word: "koe o mi ni matou", meaning: "takes on the voice (wears it like a garment)" }
      - { word: "eda", meaning: "branch" }
      - { word: "kakera", meaning: "fragments, a little of it" }
      - { word: "tsume", meaning: "fingernails" }
      - { word: "mochisaru", meaning: "carries away" }
  - id: menu_board
    location: coffee_cart
    where: "Chalked in a corner of the menu board, the one line nobody ever wipes off."
    text: "Kinō no gochūmon wa, sengetsu teikyō itashimasu. Jikanteki na gomeiwaku o okake shi, fukaku owabi itashimasu."
    translation: "Yesterday's orders will be served last month. We apologise for the temporal inconvenience."
    glossary:
      - { word: "gochūmon", meaning: "orders (in a café; honorific go-)" }
      - { word: "kinō", meaning: "yesterday" }
      - { word: "teikyō itashimasu", meaning: "will be served (humble keigo)" }
      - { word: "sengetsu", meaning: "last month" }
      - { word: "owabi itashimasu", meaning: "we apologise (humble keigo)" }
      - { word: "gomeiwaku", meaning: "inconvenience, trouble caused" }
  - id: chopping_block
    location: butchers_stall
    where: "Burned into the chopping block, under a century of knife marks."
    text: "Kono dai de wa, subete ga hakarareru. Iiwake sae mo. Nanotta dake no omosa ga atta iiwake nado, imada kono yo ni arazu."
    translation: "Everything is weighed at this stall, even excuses. There is no excuse that ever weighed what it claimed."
    glossary:
      - { word: "hakarareru", meaning: "is weighed" }
      - { word: "imada kono yo ni arazu", meaning: "there has never been (in this world)" }
      - { word: "sae mo", meaning: "even" }
      - { word: "iiwake", meaning: "excuses" }
      - { word: "dai", meaning: "stall, counter; a stand" }
      - { word: "nanotta", meaning: "it claimed, gave itself out as" }
  - id: plaque_back
    location: cracked_fountain
    where: "On the back of the brass plaque, in letters someone has tried to file away."
    text: "Saigo made yomu koto wa susumerarenai. Kurikaeshi wa bunshō ga owaru tokoro de umare, bunshō wa kesshite owaranai."
    translation: "Reading to the end is not advised. The refrain begins where the sentence ends, and the sentence never ends."
    glossary:
      - { word: "susumerarenai", meaning: "it is not advised" }
      - { word: "saigo made", meaning: "to the end" }
      - { word: "kurikaeshi", meaning: "refrain; a repetition" }
      - { word: "bunshō", meaning: "sentence" }
      - { word: "kesshite owaranai", meaning: "never ends" }
  - id: flyleaf
    location: old_bookshop
    where: "Pencilled on the flyleaf of a book that will not let itself be opened."
    text: "Kono mise no hon wa dore mo, saigo ni yonda mono ga kaita no da. Taisetsu ni kaeshinasai: sore ni wa jibun ga kakarete aru kamo shirenai."
    translation: "Every book in this shop was written by whoever read it last. Return it with care: you may be inside it."
    glossary:
      - { word: "mise", meaning: "shop" }
      - { word: "saigo ni yonda mono", meaning: "whoever read it last" }
      - { word: "taisetsu ni kaeshinasai", meaning: "give it back with care" }
      - { word: "jibun ga kakarete aru kamo shirenai", meaning: "you yourself may be written in it" }
  - id: seam
    location: the_rift
    where: "Stitched along the seam of light, in thread that hums when you lean close."
    text: "Kono basho de eda wa shinda. Soredemo, sono ne wa katari tsuzukeru. Wakaru made kike. Sore kara, mimi o fusage."
    translation: "Here the branch is dead, yet its roots keep talking. Listen until you understand, then cover your ears."
    glossary:
      - { word: "soredemo", meaning: "and yet" }
      - { word: "sono ne", meaning: "its roots" }
      - { word: "katari tsuzukeru", meaning: "keep talking" }
      - { word: "wakaru made", meaning: "until you understand" }
      - { word: "mimi o fusage", meaning: "cover your ears" }
