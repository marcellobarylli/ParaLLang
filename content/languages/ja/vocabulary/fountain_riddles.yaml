      - 21ji
      - 22ji
      - 23ji
      - 24ji
    accent_insensitive: true
    example:
      target: Sanji desu.
      english: It is three o'clock.
    note: "The hour and ji, then desu: ichiji, niji, sanji desu. Three hours have their own reading: yoji (4, not yonji), shichiji (7, also nanaji) and kuji (9, not kyūji). Half past is han (sanji han), minutes are fun or pun (sanji juppun); gozen and gogo are a.m. and p.m. (gogo sanji)."
    reference_ids:
      - jisho-ji
  - id: shogo
    kind: word
    target: shōgo
    part_of_speech: noun
    accepted_translations:
      - midday
      - noon
    surface_variants:
      - shōgo
      - shougo
      - shoogo
    accent_insensitive: true
    example:
      target: Shōgo desu.
      english: It is midday.
    note: Noon exactly, twelve o'clock in the day; in speech also hiru no jūniji. Ohiru is midday and lunch.
    reference_ids:
      - jisho-shogo
  - id: mayonaka
    kind: word
    target: mayonaka
    part_of_speech: noun
    accepted_translations:
      - midnight
      - the middle of the night
    surface_variants:
      - mayonaka
    accent_insensitive: false
    example:
      target: Mō mayonaka desu.
      english: It is already midnight.
    note: The middle of the night; midnight on the dot is yoru no jūniji or reiji (zero o'clock).
    reference_ids:
      - jisho-mayonaka
  - id: nanji
    kind: phrase
    target: nanji desu ka
    part_of_speech: question
    accepted_translations:
      - what time is it
    surface_variants:
      - nanji desu ka
      - nanji
      - nan-ji
      - nan ji
    accent_insensitive: false
    example:
      target: Ima nanji desu ka, Flick?
      english: What time is it now, Flick?
    note: Nan (what) and ji (o'clock); among friends, ima nanji? is enough.
    reference_ids:
      - jisho-nanji
