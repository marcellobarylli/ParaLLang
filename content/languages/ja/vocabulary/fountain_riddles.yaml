entries:
  - id: tomatte
    kind: word
    target: tomatte
    part_of_speech: verb
    accepted_translations:
      - stop
      - stop it
      - hold still
    surface_variants:
      - tomatte
      - tomare
      - tomarinasai
    accent_insensitive: false
    example:
      target: Tomatte, Flick!
      english: Stop, Flick!
    note: The te form of tomaru (to come to a stop), said to a friend as a request; tomatte kudasai is politer. Tomare is the blunt command written on stop signs; tomarinasai is a parent's or a teacher's.
    reference_ids:
      - jisho-tomaru
  - id: ugokanaide
    kind: word
    target: ugokanaide
    part_of_speech: verb
    accepted_translations:
      - keep still
      - hold still
      - don't move
      - stop
    surface_variants:
      - ugokanaide
      - ugoku na
      - jitto shite
    accent_insensitive: false
    example:
      target: Ugokanaide!
      english: Don't move!
    note: The negative te form of ugoku (to move), don't move; ugokanaide kudasai is politer, ugoku na is blunt. Jitto shite! (keep still) says the same.
    reference_ids:
      - jisho-ugoku
  - id: yamete
    kind: word
    target: yamete
    part_of_speech: verb
    accepted_translations:
      - stop it
      - stop
      - quit it
      - that is enough
    surface_variants:
      - yamete
      - yamero
      - yamenasai
    accent_insensitive: false
    example:
      target: Mō yamete!
      english: Stop it already!
    note: The te form of yameru (to stop doing something, to quit). Tomatte stops a movement; yamete stops what someone is doing. Yamero is rough; mō yamete is that's enough now.
    reference_ids:
      - jisho-yameru
  - id: kiite
    kind: word
    target: kiite
    part_of_speech: verb
    accepted_translations:
      - listen
    surface_variants:
      - kiite
    accent_insensitive: false
    example:
      target: Kiite, Flick!
      english: Listen, Flick!
    note: The te form of kiku (to listen, to hear, to ask), said to a friend as a request.
    reference_ids:
      - jisho-kiku
  - id: migi
    kind: word
    target: migi
    part_of_speech: noun
    accepted_translations:
      - right
      - the right
    surface_variants:
      - migi
    accent_insensitive: false
    example:
      target: Migi ni magatte.
      english: Turn right.
    note: 'Migi e or migi ni: to the right.'
    reference_ids:
      - jisho-migi
  - id: hidari
    kind: word
    target: hidari
    part_of_speech: noun
    accepted_translations:
      - left
      - the left
    surface_variants:
      - hidari
    accent_insensitive: false
    example:
      target: Hidari e itte.
      english: Go left.
    note: 'Hidari e or hidari ni: to the left.'
    reference_ids:
      - jisho-hidari
  - id: massugu
    kind: word
    target: massugu
    part_of_speech: adverb
    accepted_translations:
      - straight
      - straight on
      - straight ahead
    surface_variants:
      - massugu
    accent_insensitive: false
    example:
      target: Massugu itte.
      english: Go straight on.
    note: Massugu itte kudasai is the politer way to ask.
    reference_ids:
      - jisho-massugu
  - id: ima
    kind: word
    target: ima
    part_of_speech: adverb
    accepted_translations:
      - now
    surface_variants:
      - ima
    accent_insensitive: false
    example:
      target: Ima, ashita ja nakute.
      english: Now, not tomorrow.
    note: Ima also comes in the question ima nanji desu ka? (what time is it now?).
    reference_ids:
      - jisho-ima
  - id: ima_sugu
    kind: phrase
    target: ima sugu
    part_of_speech: adverb
    accepted_translations:
      - right now
      - right away
      - now
      - immediately
    surface_variants:
      - ima sugu
      - imasugu
      - sugu
    accent_insensitive: false
    example:
      target: Ima sugu yamete.
      english: Stop it right now.
    note: Sugu is at once, soon; ima sugu, right now, is more insistent than ima.
    reference_ids:
      - jisho-sugu
  - id: ato_de
    kind: phrase
    target: ato de
    part_of_speech: adverb
    accepted_translations:
      - later
      - afterwards
    surface_variants:
      - ato de
      - atode
    accent_insensitive: false
    example:
      target: Ato de yarimasu.
      english: I'll do it later.
    reference_ids:
      - jisho-ato
  - id: ashita
    kind: word
    target: ashita
    part_of_speech: noun
    accepted_translations:
      - tomorrow
    surface_variants:
      - ashita
    accent_insensitive: false
    example:
      target: Mata ashita!
      english: See you tomorrow!
    reference_ids:
      - jisho-ashita
  - id: ji
    kind: word
    target: ji
    part_of_speech: counter
    accepted_translations:
