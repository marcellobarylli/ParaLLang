# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Round 011: The Cracked Fountain (commands, directions, time). Reference URLs follow the existing patterns and
# were not opened from the build container; listed for the owner's content review.
# Round 050 (backlog G5): telling the time (the hour and ji, shōgo, mayonaka) and Flick's question (nanji desu ka).
