# Round 223: Japanese version authored by Claude (from the Italian, as the French pack adapted it), in rōmaji only; awaits a native speaker's review.
# Japanese counts minutes with the counter fun, which becomes pun after some numbers (sanpun, roppun, juppun); a bare
# number (go, ni, san) is never a form here, because it is an English word, a particle or the honorific -san. The
# minute counts are the entries.
