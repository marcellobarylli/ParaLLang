# Round 223: Chinese version authored by Claude (from the Italian, as the French pack adapted it), in pinyin only; awaits a native speaker's review.
# Round 011: The Cracked Fountain (commands, directions, time). Reference URLs follow the existing patterns and
# were not opened from the build container; listed for the owner's content review.
# Round 050 (backlog G5): telling the time (... diǎn, liǎng diǎn, zhōngwǔ, bànyè) and Flick's question.
# Round 223: bare forms that are English words or common homographs are not forms here: tíng (stop) and tīng
# (listen), zuǒ (left) and zuò (sit, do), bāng; directions are taught as phrases (wǎng zuǒ, yòu zhuǎn).
version: fountain-riddles-zh-v1
