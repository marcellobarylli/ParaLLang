entries:
  - id: zou_ba
    kind: phrase
    target: zǒu ba
    part_of_speech: phrase
    accepted_translations:
      - let's go
      - let's get going
      - we're going
    surface_variants:
      - zǒu ba
      - wǒmen zǒu
      - zánmen zǒu
    accent_insensitive: true
    example:
      target: Wǒmen qù shìchǎng ba! Zǒu ba!
      english: Let's go to the market! Let's go!
    note: 'Zǒu is to go, to leave (and to walk); the particle ba makes it a suggestion: zǒu ba, let''s go. Wǒmen zǒu ba says the same; zánmen, the inclusive we, is warmer and northern.'
    reference_ids:
      - mdbg-zou
      - mdbg-ba-particle
  - id: yiqi
    kind: word
    target: yìqǐ
    part_of_speech: adverb
    accepted_translations:
      - together
    surface_variants:
      - yìqǐ
      - yì qǐ
    accent_insensitive: true
    example:
      target: Wǒmen yìqǐ zǒu ba.
      english: Let's go together.
    note: 'Yìqǐ comes before the verb: wǒmen yìqǐ zǒu, we go together. With someone: gēn nǐ yìqǐ, together with you.'
    reference_ids:
      - mdbg-yiqi
  - id: liang
    kind: word
    target: "liǎng"
    part_of_speech: numeral
    accepted_translations:
      - two
    surface_variants:
      - "liǎng"
    accent_insensitive: true
    example:
      target: "Xiànzài liǎng diǎn."
      english: "It is two o'clock."
    note: "Two before a measure word or a counted thing is liǎng: liǎng fēnzhōng, liǎng diǎn, liǎng jīn. Èr is two when counting aloud and inside longer numbers (yī, èr, sān; shí'èr)."
    reference_ids:
      - wiktionary-liang
