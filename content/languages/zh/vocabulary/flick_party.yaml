  - id: ba_fenzhong
    kind: phrase
    target: "bā fēnzhōng"
    part_of_speech: phrase
    accepted_translations:
      - eight minutes
    surface_variants:
      - "bā fēnzhōng"
      - "bā fēn zhōng"
    accent_insensitive: true
    example:
      target: "Zài gěi nǐ bā fēnzhōng."
      english: "I give you eight more minutes."
    note: "Matched only with fēnzhōng (bā fēnzhōng, eight minutes): bā alone is written like the particle ba of zǒu ba."
    reference_ids:
      - wiktionary-ba
  - id: jiu
    kind: word
    target: "jiǔ"
    part_of_speech: numeral
    accepted_translations:
      - nine
    surface_variants:
      - "jiǔ"
    accent_insensitive: true
    example:
      target: "Xiànzài jiǔ diǎn."
      english: "It is nine o'clock."
    note: "Jiǔ, wine or alcohol, is spelled the same with a different character."
    reference_ids:
      - wiktionary-jiu
  - id: shi_fenzhong
    kind: phrase
    target: "shí fēnzhōng"
    part_of_speech: phrase
    accepted_translations:
      - ten minutes
    surface_variants:
      - "shí fēnzhōng"
      - "shí fēn zhōng"
    accent_insensitive: true
    example:
      target: "Zuì duō shí fēnzhōng."
      english: "Ten minutes at most."
    note: "Matched only with fēnzhōng (shí fēnzhōng, ten minutes): shí alone is written like shì, to be. Eleven to nineteen are ten and the unit: shíyī, shí'èr."
    reference_ids:
      - wiktionary-shi
  - id: shiyi
    kind: word
    target: "shíyī"
    part_of_speech: numeral
    accepted_translations:
      - eleven
    surface_variants:
      - "shíyī"
      - "shí yī"
    accent_insensitive: true
    example:
      target: "Xiànzài shíyī diǎn."
      english: "It is eleven o'clock."
    reference_ids:
      - wiktionary-shiyi
  - id: shier
    kind: word
    target: "shí'èr"
    part_of_speech: numeral
    accepted_translations:
      - twelve
    surface_variants:
      - "shí'èr"
      - "shí èr"
    accent_insensitive: true
    example:
      target: "Xiànzài shí'èr diǎn."
      english: "It is twelve o'clock."
    note: "Ten and two, with èr, as two is inside a number: shí'èr fēnzhōng. The apostrophe marks the break before a syllable that starts with a vowel."
    reference_ids:
      - wiktionary-shier
  - id: fenzhong
    kind: word
    target: fēnzhōng
    part_of_speech: noun
    accepted_translations:
      - minutes
      - minute
    surface_variants:
      - fēnzhōng
      - fēn zhōng
    accent_insensitive: true
    example:
      target: Zài gěi wǒ wǔ fēnzhōng.
      english: Give me five more minutes.
    note: 'Fēnzhōng counts minutes of time passing and never changes for the plural: yì fēnzhōng, wǔ fēnzhōng. On the clock the minute is fēn: liǎng diǎn shí fēn, ten past two.'
    reference_ids:
      - mdbg-fenzhong
