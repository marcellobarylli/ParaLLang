# Round 223: Chinese version authored by Claude (from the Italian, as the French pack adapted it), in pinyin only; awaits a native speaker's review.
# Round 013: The Old Bookshop (backlog A6, with B2). Marginalia the Bookworm reads two passages of The Journey and
# asks about each; the player answers in Chinese. The passages are in each objective's intent, so they reach the
# narration prompt.
# Round 223: the Cyclops trick is kept in Chinese with the name Wúrén ("no one"), the name the hero gives the Cyclops
# in Chinese translations of the Odyssey.
id: old_bookshop_bookworm
character: characters/enemies/bookworm_marginalia.yaml
location: old_bookshop
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player shows, in Chinese, that they understood two passages of The Journey"
max_turns: 20
resolved_message: "Marginalia annotates you as 'promising', sells you a battered copy of The Journey, and goes back to eating the poetry section."
# Round 159 (issue #7): Marginalia has come to know more of the world than most. When the conversation is over the
# narrator tells what Marginalia then utters: a passage of lore, in untranslatable text (lore/truths.yaml).
revelation:
  text: "Before she goes back to the poetry, Marginalia takes off her spectacles, which nobody has seen her do, and for once does not read it from a book. She utters the following: {truth:journey_threads}"
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: home
    prompt: "Marginalia reads you the opening of The Journey. Where is Journathan going? Answer in Chinese."
    intent: >
      Marginalia reads this passage aloud, word for word, in her greeting, right after introducing herself: "Zhè shì
      Journathan de gùshi, tā shì yí ge tōngxiǎo xǔduō zhǒng yǔyán de rén. Tā huí jiā de lǚtú zǒu le èrshí nián."
      Only then does she ask her question: where is Journathan going? The player answers in Chinese that he is going
      home.
    target_vocabulary_ids: ["jia"]
    required_target_groups:
      - ["jia"]
    grammar_constraints:
      - "Reading comprehension: an answer about Journathan, in the third person, reusing the passage's words or quoting the relevant part of it, is the player's own answer and passes when it says, in Chinese, that he is going home (huí jiā)."
      - "Another detail (how long, a book), an unrelated quotation, English-only answers and questions do not pass."
    accepted_examples:
      - "Huí jiā."
      - "Tā huí jiā."
      - "Tā yào huí zìjǐ de jiā."
    negative_examples:
      - text: "Home."
        reason: "English-only; the answer must be in Chinese."
      - text: "Èrshí nián."
        reason: "It says how long the journey lasts, not where he is going."
      - text: "Yì běn shū."
        reason: "It does not answer the question about the passage."
    reference_meaning: "Journathan is going home."
    hint_limit: 2
    next_objective: name
    assessment_reference_ids: ["mdbg-jia"]
  - id: name
    prompt: "Marginalia reads the Cyclops episode. What name did Journathan give the Cyclops? Answer in Chinese."
    intent: >
      Marginalia first reads this passage aloud, word for word, in her dialogue: "Dúyǎn Jùrén wèn tā jiào shénme
      míngzi. Journathan huídá: 'Wǒ de míngzi jiào Wúrén.'" Only then does she ask her question: what name did
      Journathan give the Cyclops? In the lore it was the first recorded translation trick. The player answers in
      Chinese: Nobody (Wúrén).
    target_vocabulary_ids: ["wuren"]
    required_target_groups:
      - ["wuren"]
    grammar_constraints:
      - "Reading comprehension: an answer about Journathan, in the third person or as reported speech, reusing the passage's words or quoting the name, is the player's own answer and passes when it gives, in Chinese, the name Nobody (Wúrén)."
      - "His real name, an unrelated quotation, English-only answers and questions do not pass."
    accepted_examples:
      - "Wúrén."
      - "Tā jiào Wúrén."
      - "Tā de míngzi jiào Wúrén."
      - "Tā shuō 'Wúrén'."
    negative_examples:
      - text: "Journathan."
        reason: "That is his real name; the passage says he gave the Cyclops a different one."
      - text: "Nobody."
        reason: "English-only; the answer must be in Chinese."
    reference_meaning: "He told the Cyclops his name was Nobody."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: ["mdbg-wuren"]
