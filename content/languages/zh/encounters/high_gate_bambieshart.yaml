# Round 113: The High Gate. Bambieshart from Zanzibart gives the player a brocade and a mountain to visit; the player
# thanks him and asks about Micromort Mountain.
# Round 223: Chinese version authored by Claude (from the Italian, as the French pack adapted it), in pinyin only; awaits a native speaker's review.
id: high_gate_bambieshart
character: characters/enemies/wanderer_bambieshart.yaml
location: the_high_gate
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player thanks Bambieshart for the Brocade and asks him about the mountain, in Chinese"
max_turns: 20
resolved_message: "Bambieshart points at the horizon, nods gravely, and is gone before the nod ends. You will find him later, he assures you, dying."
# Round 159 (issue #7): Bambieshart has come to know more of the world than most. When the conversation is over the
# narrator tells what Bambieshart then utters: a passage of lore, in untranslatable text (lore/truths.yaml).
revelation:
  text: "Bambieshart looks past you, at the gate that has never opened. When he speaks again it is quietly, and he utters the following: {truth:inflection}"
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: thank_him
    prompt: "Bambieshart has pressed a brocade into your hands. Thank him, using Chinese."
    intent: "Bambieshart greets the player as the Tarnished, in his half-invented English, and presses Bambieshart's Brocade into their hands with a long and solemn description of its virtues, then waits to be thanked. He never says \"xièxie\" (in dialogue or narration) before the player has, and he does not tell the player what to say."
    target_vocabulary_ids: [xiexie]
    required_target_groups:
      - [xiexie]
    grammar_constraints:
      - "The player thanks Bambieshart, in their own words, with the Chinese word for thanks (xièxie)."
      - "Reject English-only thanks, quotations, definitions of the word, and lines that report someone else's thanks."
    accepted_examples:
      - "Xièxie, Bambieshart."
      - "Xièxie for the brocade."
    negative_examples:
      - text: "Thank you, Bambieshart."
        reason: "English-only; it does not use the Chinese word."
      - text: "Xièxie means thank you."
        reason: "It discusses the word rather than thanking him."
      - text: "Bambieshart says xièxie."
        reason: "It reports someone else's words."
    reference_meaning: "The player thanks Bambieshart for the gift."
    hint_limit: 2
    next_objective: ask_mountain
    assessment_reference_ids: [mdbg-xiexie]
  - id: ask_mountain
    prompt: "Bambieshart insists you visit Micromort Mountain, one chance in a million of death per step. Ask him about the mountain, using Chinese."
    intent: "Pleased, Bambieshart tells the player that they must visit Micromort Mountain, where every step carries one chance in a million of death, and counts the steps in micromorts. He never says the Chinese word for mountain (\"shān\"), in dialogue or narration, before the player has. He does not tell the player what to say."
    target_vocabulary_ids: [shan]
    required_target_groups:
      - [shan]
    grammar_constraints:
      - "The player asks Bambieshart about the mountain, in their own words, with the Chinese word for mountain (shān)."
      - "Reject English-only questions, quotations, and talk about the word."
    accepted_examples:
      - "Gěi wǒ jiǎngjiang nà zuò shān ba, Bambieshart."
      - "Nà zuò shān zěnmeyàng?"
    negative_examples:
      - text: "Tell me about the mountain."
        reason: "English-only; it does not use the Chinese words."
      - text: "Nà zuò shān hěn gāo."
        reason: "It states a fact about the mountain instead of asking Bambieshart about it."
    reference_meaning: "The player asks Bambieshart about Micromort Mountain."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: [mdbg-shan]
