    something_for: { say: [de_yao], examples: ["Yǒu méiyǒu zhì tóu téng de yào?", "Wǒ xiǎng mǎi zhì késou de yào."] }
    how_often: { say: [ji_ci], examples: ["Yì tiān chī jǐ cì?", "Yì tiān yào chī jǐ cì?"] }
