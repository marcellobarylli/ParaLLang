    ate: { say: [[zuotian], [wo_chile, wo_hele]], examples: ["Zuótiān wǒ chīle yì wǎn miàntiáo.", "Zuótiān wǎnshang wǒ hēle yì bēi chá."] }
    worked: { say: [wo_gongzuole, wo_xuexile], examples: ["Zuótiān wǒ gōngzuòle shí ge xiǎoshí.", "Wǒ méi shàngbān, wǒ zài jiā xuéxí le."] }
    ask_did: { say: [ni_zuole_shenme], examples: ["Nǐ zuótiān zuò shénme le?", "Nín zuótiān wǎnshang zuòle shénme?"] }
  past_did_bought:
    bought: { say: [wo_maile], examples: ["Wǒ mǎile yí jiàn wàitào.", "Wǒ mǎile yì shuāng xiézi."] }
    paid: { say: [wo_fule], examples: ["Wǒ fùle èrshí kuài qián.", "Wǒ huāle yìbǎi kuài."] }
    saw: { say: [wo_kanle], examples: ["Wǒ kànle yí bù diànyǐng.", "Wǒ kànjiànle wǒ jiějie."] }
  past_did_week:
    last_week: { say: [shang_ge_xingqi], examples: ["Shàng ge xīngqī wǒ hěn máng.", "Shàng ge xīngqī wǒ jiànle yí ge péngyou."] }
    made: { say: [wo_zuole], examples: ["Wǒ zuòle yí ge dàngāo.", "Wǒmen zuòle hěn duō jiǎozi."] }
