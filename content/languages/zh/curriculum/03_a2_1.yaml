    arrived: { say: [dao_le], examples: ["Wǒ shì zuótiān wǎnshang dào de.", "Wǒ shí diǎn dào le."] }
    came_back: { say: [huilai], examples: ["Wǒ xīngqītiān huílái de.", "Wǒ zuótiān huí jiā le."] }
