    hot_cold: { say: [hen_re, hen_leng], examples: ["Jīntiān hěn rè.", "Jīntiān fēicháng lěng."] }
    sun_rain: { say: [qingtian, xia_yu, gua_feng, xia_xue], examples: ["Jīntiān shì qíngtiān.", "Xià yǔ le.", "Jīntiān guā fēng."] }
  weather_seasons:
    ask_season: { say: [na_ge_jijie], examples: ["Nǐ zuì xǐhuan nǎ ge jìjié?", "Nín zuì xǐhuan shénme jìjié?"] }
    favourite: { say: [xiatian, dongtian, chuntian, qiutian], examples: ["Wǒ zuì xǐhuan xiàtiān.", "Wǒ xǐhuan chūntiān."] }
    in_season: { say: [[xiatian, dongtian, chuntian, qiutian], [hen_re, hen_leng, xia_yu, xia_xue, qingtian, gua_feng]], examples: ["Dōngtiān hěn lěng.", "Xiàtiān fēicháng rè.", "Qiūtiān chángcháng xià yǔ."] }
  weather_rain:
    was: { say: [[zuotian], [hen_leng, hen_re, xia_yu, xia_xue, gua_feng, qingtian]], examples: ["Zuótiān hěn lěng.", "Zuótiān xià yǔ le."] }
    when_rains: { say: [xia_yu_de_shihou], examples: ["Xià yǔ de shíhou wǒ dāi zài jiā.", "Xià yǔ de shíhou wǒ kàn shū."] }
    fine_weather: { say: [tianqi_hao], examples: ["Tiānqì hǎo de shíhou wǒ qù gōngyuán.", "Tiānqì hǎo de shíhou wǒ chūqu wánr."] }
  restaurant_book:
    book: { say: [yuding], examples: ["Wǒ xiǎng dìng yì zhāng zhuōzi.", "Wǒ kěyǐ yùdìng yì zhāng zhuōzi ma?"] }
    how_many: { say: [wei, ge_ren], examples: ["Liǎng wèi.", "Wǒmen sì ge rén."] }
    for_when: { say: [jintian_wanshang], examples: ["Jīntiān wǎnshang qī diǎn.", "Míngtiān wǎnshang, liǎng wèi."] }
  restaurant_order:
    starter: { say: [xian_lai, liangcai], examples: ["Xiān lái yí ge liángcài.", "Wǒmen xiān lái yí ge tāng."] }
    main: { say: [[recai], [rou, yu, jirou]], examples: ["Rè cài wǒ yào yì tiáo yú.", "Zhǔcài lái yí ge gōngbǎo jīdīng."] }
    dessert: { say: [tianpin], examples: ["Tiánpǐn wǒ yào bīngqílín.", "Lái yí ge shuǐguǒ pán ba."] }
  restaurant_wrong:
    cold: { say: [liang_le, tai_xian_le], examples: ["Tāng liáng le.", "Zhè ge cài tài xián le."] }
    missing: { say: [kuaizi, chazi, daozi, beizi, mifan], examples: ["Méiyǒu kuàizi.", "Hái shǎo yí ge bēizi.", "Mǐfàn hái méi lái."] }
    another: { say: [zai_lai], examples: ["Zài lái yì shuāng kuàizi, xièxie.", "Néng zài gěi wǒ yí ge bēizi ma?"] }
  health_hurts:
    not_well: { say: [bu_shufu], examples: ["Wǒ jīntiān bù shūfu.", "Wǒ yǒudiǎn bù shūfu."] }
    hurts: { say: [[teng], [tou, duzi, sangzi, yachi, houbei]], examples: ["Wǒ tóu téng.", "Wǒ sǎngzi téng.", "Wǒ yáchǐ hěn téng."] }
