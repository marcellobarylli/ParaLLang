stage: a2_1
version: curriculum-a2-1-zh-v1
grammar:
  past_did: "No tenses: a finished action takes le straight after the verb (chīle, hēle, mǎile, kànle) and the verb never changes for person or time; le wants a number or a description on its object (wǒ mǎile yí jiàn wàitào); méi + verb, without le, for what did not happen (wǒ méi shàngbān); time words such as zuótiān and shàng ge xīngqī go before the verb."
  past_went: "qù, dào and huí with le (wǒ qùle Shànghǎi, wǒ qù hǎibiān le); guo for having been somewhere (wǒ qùguo Běijīng); shì ... de to tell when, how or with whom a past trip was made (wǒ shì bā diǎn chūfā de; nǐ gēn shéi qù de?); gēn ... yìqǐ for 'with', yí ge rén for 'alone'."
  weather: "Adjectives work as verbs and take hěn (jīntiān hěn rè, hěn lěng); rain and snow 'fall' (xià yǔ, xià xuě) and wind 'blows' (guā fēng); the seasons need no preposition (dōngtiān hěn lěng); ... de shíhou at the head of the sentence for 'when' (xià yǔ de shíhou ...). With zuótiān the same words tell the past: zuótiān hěn lěng."
  restaurant: "wǒ xiǎng + verb for a polite wish (wǒ xiǎng dìng yì zhāng zhuōzi); jǐ wèi? and liǎng wèi count the guests; the dishes are shared: liángcài to start, then rè cài with rice (mǐfàn), and fruit more often than a dessert; xiān lái for 'first bring', zài lái for 'another'; measure words: yì shuāng kuàizi, yí ge bēizi, yì tiáo yú."
  health: "Body part + téng, with no 'my' (wǒ tóu téng, wǒ sǎngzi téng); ailments are verbs (wǒ gǎnmào le, wǒ fāshāo le, wǒ késou); cóng zuótiān kāishǐ for 'since yesterday', liǎng tiān le for 'for two days'; děi with a verb for 'must' (wǒ děi xiūxi)."
  plans: "xiǎng, děi and kěyǐ (or néng) with a verb (wǒ xiǎng qù, wǒ děi gōngzuò, wǒ kěyǐ lái); bù néng or lái bu liǎo for 'cannot'; a time word with the plain verb for a plan (xià ge xīngqī wǒ qù Běijīng), dǎsuan for 'plan to'; mǎshàng and kuài yào ... le for 'about to'."
lessons:
