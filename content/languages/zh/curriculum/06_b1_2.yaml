# Round 144: the words of curriculum stage B1.2 (the skeleton is content/curriculum/06_b1_2.yaml). The Italian
# original was authored by Claude from the functions of the B1 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. The vocabulary shares one namespace with the earlier stages: an id
# defined in an earlier file is reused here, never redefined, and no new entry repeats an earlier entry's form.
# Round 223: the Chinese stages were written at the same time, so this file defines the words it takes from A1 and A2
# itself (geng_xihuan, nian, ge_yue, xuexi, under their natural ids; yinwei, chijing and wo_juede come from B1.1); a
