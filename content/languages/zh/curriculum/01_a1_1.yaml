# Round 223: Chinese (Mandarin) version authored by Claude (from the Italian, as the French pack adapted it), in pinyin only; awaits a native speaker's review.
# Round 144: the words of curriculum stage A1.1 (the skeleton is content/curriculum/01_a1_1.yaml). The Italian
# original was authored by Claude from the functions of the A1 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. A vocabulary entry is { t: target, pos, en: [meanings], forms: [...], ex: [example, English] };
# `forms` defaults to the target, and matching ignores case and accents. `say` is the words that meet an objective:
# one list means any of them, a list of lists means one from each.
# Round 223: matching also ignores tone marks, so pinyin typed without them is read the same. A word written joined
# and apart (kāfēi, kā fēi) and ü typed as v (lǜ chá, lv cha) are listed as forms. Syllables that are English words or
# particles on their own (hěn, yǒu, màn, hē, ma, ne) appear only inside phrases.
stage: a1_1
version: curriculum-a1-1-zh-v1
grammar:
  greetings: "shì (wǒ shì, nǐ shì) and jiào (wǒ jiào, nǐ jiào shénme míngzi); nǐ and the polite nín; ma turns a sentence into a question (nǐ hǎo ma?), ne asks it back (nǐ ne?)."
  origins: "Country plus rén for where you are from (wǒ shì Yīngguó rén); láizì; zhù zài with a place (wǒ zhù zài Lúndūn); questions with nǎr and nǎ guó, in the place the answer takes."
  courtesy: "Polite formulas; bù before a verb (wǒ bù dǒng), méi for what did not happen (wǒ méi tīng dǒng); qǐng and kěyǐ with a verb (qǐng zài shuō yí biàn)."
  numbers: "Numbers to a hundred (shí, èrshí, wǔshíwǔ); suì for age, with no verb (wǒ sānshí suì); duōshao, and jǐ for small numbers with a measure word (jǐ ge)."
  cafe: "wǒ yào and wǒ xiǎng yào with a noun; a number needs a measure word before the noun (yì bēi chá, yí ge bāozi, yì wǎn miàntiáo); hái yào and zài lái for 'also' and 'another'."
  likes: "xǐhuan with a noun or a verb (wǒ xǐhuan chá, wǒ xǐhuan hē chá); bù xǐhuan; fēicháng, and yìdiǎnr yě bù for 'not at all'; yīnwèi, and wèishénme to ask."
