    evening: { say: [chi_wanfan, shangchuang, shuijiao], examples: ["Wǒ qī diǎn chī wǎnfàn.", "Wǒ shí diǎn shuìjiào.", "Wǒ shíyī diǎn shàngchuáng."] }
