    tomorrow: { say: [[mingtian], [xingqiyi, xingqier, xingqisan, xingqisi, xingqiwu, xingqiliu, xingqitian]], examples: ["Míngtiān xīngqī'èr.", "Míngtiān xīngqītiān."] }
  time_when:
    at_what_time: { say: [ji_dian, shenme_shihou], examples: ["Yínháng jǐ diǎn kāimén?", "Huǒchē shénme shíhou kāi?"] }
    at_hour: { say: [dian], examples: ["Wǒ bā diǎn huílai.", "Jiǔ diǎn."] }
    part_of_day: { say: [zaoshang, xiawu, wanshang], examples: ["Zǎoshang.", "Wǎnshang bā diǎn.", "Xiàwǔ sān diǎn."] }
