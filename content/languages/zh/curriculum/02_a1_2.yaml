vocabulary:
  # family
  gege: { t: "gēge", pos: noun, en: ["older brother", "brother"], forms: ["gēge", "gē ge"], ex: ["Wǒ gēge zài Shànghǎi.", "My older brother is in Shanghai."], n: "Chinese says whether a brother or sister is older or younger: gēge, dìdi, jiějie, mèimei." }
  jiejie: { t: "jiějie", pos: noun, en: ["older sister", "sister"], forms: ["jiějie", "jiě jie"], ex: ["Wǒ jiějie jiào Lì.", "My older sister is called Li."] }
  didi: { t: "dìdi", pos: noun, en: ["younger brother", "brother"], forms: ["dìdi", "dì di"], ex: ["Wǒ dìdi shíwǔ suì.", "My younger brother is fifteen."] }
  meimei: { t: "mèimei", pos: noun, en: ["younger sister", "sister"], forms: ["mèimei", "mèi mei"], ex: ["Wǒ yǒu yí ge mèimei.", "I have a younger sister."] }
  haizi: { t: "háizi", pos: noun, en: ["child", "children"], forms: ["háizi", "hái zi"], ex: ["Tā yǒu liǎng ge háizi.", "She has two children."] }
  erzi: { t: "érzi", pos: noun, en: ["son"], forms: ["érzi", "ér zi"], ex: ["Wǒ yǒu yí ge érzi.", "I have a son."] }
  nuer: { t: "nǚ'ér", pos: noun, en: ["daughter"], forms: ["nǚ'ér", "nǚér", "nǚ ér", "nv'er", "nver"], ex: ["Wǒ nǚ'ér qī suì.", "My daughter is seven."] }
  wo_mama: { t: "wǒ māma", pos: phrase, en: ["my mother", "my mum"], forms: ["wǒ māma", "wǒ mā ma", "wǒ de māma", "wǒ mā", "wǒ mǔqīn", "wǒ de mǔqīn"], ex: ["Wǒ māma shì lǎoshī.", "My mother is a teacher."], n: "Close family takes no de: wǒ māma, but wǒ de péngyou. mǔqīn is the formal 'mother'." }
  wo_baba: { t: "wǒ bàba", pos: phrase, en: ["my father", "my dad"], forms: ["wǒ bàba", "wǒ bà ba", "wǒ de bàba", "wǒ bà", "wǒ fùqīn", "wǒ de fùqīn"], ex: ["Wǒ bàba liùshí suì.", "My father is sixty."] }
  ni_you_xiongdi_jiemei_ma: { t: "nǐ yǒu xiōngdì jiěmèi ma", pos: phrase, en: ["do you have brothers or sisters", "do you have any brothers or sisters"], forms: ["nǐ yǒu xiōngdì jiěmèi ma", "nǐ yǒu xiōngdì jiěmèi", "nín yǒu xiōngdì jiěmèi", "nǐ yǒu méiyǒu xiōngdì jiěmèi", "nǐ yǒu háizi ma", "nín yǒu háizi ma", "nǐ yǒu méiyǒu háizi", "nín yǒu méiyǒu háizi"], ex: ["Nǐ yǒu xiōngdì jiěmèi ma?", "Do you have brothers or sisters?"] }
  shenme_yang_de_ren: { t: "shénme yàng de rén", pos: phrase, en: ["what kind of person", "what is he like", "what is she like"], forms: ["shénme yàng de rén", "shénmeyàng de rén"], ex: ["Nǐ dìdi shì shénme yàng de rén?", "What is your younger brother like?"] }
  gao: { t: "gāo", pos: adjective, en: ["tall"], forms: ["gāo", "gèzi gāo"], ex: ["Wǒ jiějie hěn gāo.", "My older sister is tall."] }
  hen_ai: { t: "hěn ǎi", pos: adjective, en: ["short"], forms: ["hěn ǎi", "tǐng ǎi", "bǐjiào ǎi", "yǒudiǎnr ǎi", "gèzi ǎi", "bù gāo"], ex: ["Wǒ bàba hěn ǎi.", "My father is short."], n: "Of a person's height; 'bù gāo', 'not tall', is kinder." }
  nianqing: { t: "niánqīng", pos: adjective, en: ["young"], forms: ["niánqīng", "nián qīng"], ex: ["Wǒ māma hái hěn niánqīng.", "My mother is still young."] }
  lao: { t: "lǎo", pos: adjective, en: ["old", "elderly"], forms: ["lǎo", "niánjì dà", "niánjì hěn dà", "shàng le niánjì"], ex: ["Wǒ yéye niánjì dà le.", "My grandfather is old."], n: "Of a person, 'niánjì dà' is kinder than 'lǎo'." }
  ren_hen_hao: { t: "rén hěn hǎo", pos: phrase, en: ["nice", "a nice person"], forms: ["rén hěn hǎo", "rén tǐng hǎo", "rén bú cuò", "rén hǎo"], ex: ["Nǐ gēge rén hěn hǎo.", "Your older brother is nice."], n: "Literally 'as a person, very good'." }
  shanliang: { t: "shànliáng", pos: adjective, en: ["kind", "good-hearted"], forms: ["shànliáng", "shàn liáng"], ex: ["Tā shì yí ge shànliáng de rén.", "He is a kind person."] }
  youmo: { t: "yōumò", pos: adjective, en: ["funny", "humorous"], forms: ["yōumò", "yōu mò", "hěn dòu", "tǐng dòu", "yǒuqù", "hěn yǒuqù"], ex: ["Wǒ mèimei hěn yōumò.", "My younger sister is funny."], n: "'Hěn dòu', said of someone who makes you laugh, is everyday speech." }
  pengyou: { t: "péngyou", pos: noun, en: ["friend"], forms: ["péngyou", "péng you", "hǎo péngyou", "péngyoumen"], ex: ["Lǐ Míng shì wǒ de hǎo péngyou.", "Li Ming is a good friend of mine."] }
  zhu_zai: { t: "zhù zài", pos: phrase, en: ["lives in", "he lives", "she lives"], forms: ["zhù zài", "zhùzài", "jiā zài"], ex: ["Wǒ de péngyou zhù zài Chéngdū.", "My friend lives in Chengdu."] }
  yiqi: { t: "yìqǐ", pos: adverb, en: ["together"], forms: ["yìqǐ", "yì qǐ"], ex: ["Wǒmen yìqǐ chīfàn.", "We eat together."], n: "It goes before the verb, often after hé: wǒ hé tā yìqǐ qù." }
  # places
  zhao: { t: "zhǎo", pos: verb, en: ["look for", "I am looking for"], ex: ["Wǒ zài zhǎo yínháng.", "I am looking for a bank."], n: "zài before it, 'I am looking for': wǒ zài zhǎo." }
  chezhan: { t: "chēzhàn", pos: noun, en: ["station"], forms: ["chēzhàn", "chē zhàn", "huǒchēzhàn", "huǒchē zhàn", "dìtiězhàn", "dìtiě zhàn"], ex: ["Chēzhàn hěn yuǎn.", "The station is far."], n: "huǒchēzhàn is the railway station, dìtiězhàn an underground station." }
  yinhang: { t: "yínháng", pos: noun, en: ["bank"], forms: ["yínháng", "yín háng"], ex: ["Yínháng jiǔ diǎn kāimén.", "The bank opens at nine."] }
  yaodian: { t: "yàodiàn", pos: noun, en: ["pharmacy", "chemist's"], forms: ["yàodiàn", "yàofáng"], ex: ["Wǒ zài zhǎo yàodiàn.", "I am looking for a pharmacy."] }
  guangchang: { t: "guǎngchǎng", pos: noun, en: ["square"], forms: ["guǎngchǎng", "guǎng chǎng"], ex: ["Wǎnshang guǎngchǎng shàng hěn rènao.", "In the evening the square is lively."], n: "In the evening, squares fill with people dancing." }
  chaoshi: { t: "chāoshì", pos: noun, en: ["supermarket"], forms: ["chāoshì", "chāo shì"], ex: ["Chāoshì kāi dào shí diǎn.", "The supermarket is open until ten."] }
  zai_nar: { t: "zài nǎr", pos: phrase, en: ["where is", "where are"], forms: ["zài nǎr", "zài nǎlǐ", "zài shénme dìfang"], ex: ["Yàodiàn zài nǎr?", "Where is the pharmacy?"], n: "The thing comes first: chēzhàn zài nǎr?" }
  fujin: { t: "fùjìn", pos: noun, en: ["near here", "nearby", "the neighbourhood"], forms: ["fùjìn", "fù jìn", "zhè fùjìn"], ex: ["Fùjìn yǒu kāfēiguǎn ma?", "Is there a cafe near here?"] }
  zher_you: { t: "zhèr yǒu", pos: phrase, en: ["there is here", "is there", "there is"], forms: ["zhèr yǒu", "zhèlǐ yǒu", "nàr yǒu", "nàlǐ yǒu", "fùjìn yǒu", "zhè fùjìn yǒu", "chéngshì yǒu", "chéng lǐ yǒu", "chénglǐ yǒu", "wǒmen nàr yǒu", "wǒmen nàlǐ yǒu"], ex: ["Zhèr yǒu yí ge yínháng.", "There is a bank here."], n: "yǒu, 'have', is also 'there is': the place comes first, fùjìn yǒu yàodiàn." }
  you_meiyou: { t: "yǒu méiyǒu", pos: phrase, en: ["is there", "do you have"], forms: ["yǒu méiyǒu", "yǒu méi yǒu"], ex: ["Fùjìn yǒu méiyǒu chāoshì?", "Is there a supermarket nearby?"], n: "A question made of yes and no: 'have, not have'." }
  meiyou: { t: "méiyǒu", pos: verb, en: ["there is no", "there isn't", "don't have"], forms: ["méiyǒu", "méi yǒu"], ex: ["Zhèr méiyǒu yínháng.", "There is no bank here."], n: "yǒu is the one verb negated with méi, never bù." }
  pangbian: { t: "pángbiān", pos: noun, en: ["next to", "beside"], forms: ["pángbiān", "páng biān", "pángbiānr", "gébì", "gé bì"], ex: ["Yínháng zài chāoshì pángbiān.", "The bank is next to the supermarket."], n: "After the thing it is next to: zài yínháng pángbiān. gébì is 'next door'." }
  qianmian: { t: "qiánmiàn", pos: noun, en: ["in front of", "in front"], forms: ["qiánmiàn", "qián miàn", "qiánbian", "qiántou"], ex: ["Wǒ zài chēzhàn qiánmiàn.", "I am in front of the station."] }
  houmian: { t: "hòumiàn", pos: noun, en: ["behind", "at the back"], forms: ["hòumiàn", "hòu miàn", "hòubian", "hòutou"], ex: ["Chāoshì zài guǎngchǎng hòumiàn.", "The supermarket is behind the square."] }
  duimian: { t: "duìmiàn", pos: noun, en: ["opposite", "across from"], forms: ["duìmiàn", "duì miàn"], ex: ["Yàodiàn zài yínháng duìmiàn.", "The pharmacy is opposite the bank."] }
