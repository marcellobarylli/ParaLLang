    looks: { say: [gao, hen_ai, nianqing, lao], examples: ["Wǒ gēge hěn gāo.", "Wǒ māma hěn ǎi.", "Wǒ bàba niánjì dà le."] }
    character: { say: [ren_hen_hao, shanliang, youmo], examples: ["Tā rén hěn hǎo.", "Tā hěn shànliáng, yě hěn yōumò."] }
