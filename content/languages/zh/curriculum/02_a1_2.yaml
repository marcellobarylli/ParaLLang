# Round 223: Chinese (Mandarin) version authored by Claude (from the Italian, as the French pack adapted it), in pinyin only; awaits a native speaker's review.
# Round 144: the words of curriculum stage A1.2 (the skeleton is content/curriculum/02_a1_2.yaml). The Italian
# original was authored by Claude from the functions of the A1 syllabi read for the round; no source page was opened
# for a single entry. For the owner's review. The vocabulary shares one namespace with the earlier stages: an id
# defined in 01_a1_1.yaml is reused here, never redefined, and no new entry repeats an earlier entry's form.
# Round 223: as in 01_a1_1.yaml, tone marks are ignored in matching, joined and separate spellings are both forms, and
# a syllable that is an English word on its own (yǒu, yòu, ǎi, bàn, dǎ, wán) appears only inside a phrase.
stage: a1_2
version: curriculum-a1-2-zh-v1
grammar:
  family: "yǒu and méiyǒu (wǒ yǒu yí ge gēge, wǒ méiyǒu háizi), with a measure word (liǎng ge mèimei); wǒ de for 'my', left out with close family (wǒ māma); hěn before an adjective (tā hěn gāo); tā for 'he' and 'she' alike."
  places: "yǒu for 'there is', after the place (fùjìn yǒu yínháng ma?), méiyǒu for 'there is none'; zài for where a thing is (yínháng zài nǎr?); the place word comes after the thing it is placed by (zài yínháng pángbiān, zài A hé B zhōngjiān)."
  directions: "Directions are plain verbs (wǎng zuǒ guǎi, yìzhí zǒu); qù with a place (qù chēzhàn); zuò with a vehicle before the verb (wǒ zuò huǒchē qù), zǒulù for on foot; the measure words zhāng for tickets and tiáo for roads."
  time: "Jǐ diǎn le? Sān diǎn (two o'clock is liǎng diǎn); bàn and yí kè; jīntiān, míngtiān and xīngqī with a number (xīngqīyī to xīngqīliù, then xīngqītiān); the time comes before the verb (wǒ bā diǎn huílai)."
  routine: "A verb never changes for person or tense; time words before the verb (wǒ qī diǎn qǐchuáng); zǒngshì, chángcháng, yǒushíhou, měi tiān dōu; cónglái bù for 'never'."
  shopping: "zhège and nàge, with the measure word of the thing (zhè jiàn chènshān, nà shuāng xié); a colour with de stands for the thing (hóngsè de); tài ... le (tài dà le); 'I'll take it' is wǒ mǎi le or jiù yào zhè jiàn."
lessons:
  family_who:
    siblings: { say: [gege, jiejie, didi, meimei, haizi, erzi, nuer], examples: ["Wǒ yǒu yí ge gēge.", "Wǒ yǒu liǎng ge mèimei.", "Wǒ méiyǒu háizi."] }
    parents: { say: [wo_mama, wo_baba], examples: ["Wǒ māma jiào Lǐ Hóng.", "Wǒ bàba jiào Wáng Míng."] }
