stage: b1_1
version: curriculum-b1-1-zh-v1
grammar:
  opinions: "wǒ juéde and wǒ rènwéi take a whole clause, and the verb after them does not change (wǒ juéde zhèr de cài hěn hǎochī); wǒ tóngyì, wǒ bù tóngyì, nǐ shuō de duì; yīnwèi ..., suǒyǐ ... (often as a pair); bǐrú."
  advice: "yīnggāi (should) and kěyǐ (could) stand before the verb (nǐ yīnggāi xiūxi yíxià; nǐ yě kěyǐ zuò huǒchē); zuìhǎo for 'you had better'; rúguǒ wǒ shì nǐ, wǒ huì ... ; wǒ jiànyì nǐ + verb."
  stories: "Chinese has no past tense: a time word sets the scene (yǒu yì tiān, jǐ nián qián), zhèngzài says what was going on (wǒ zhèngzài kàn shū), ... de shíhou is 'while', and le after the verb marks each event (wǒ kànjiàn le yì zhī gǒu); tūrán, ránhòu, zuìhòu."
  problems: "le for what went wrong (wǒ de qiánbāo diū le); the bǎ construction puts the thing before the verb (wǒ bǎ bāo wàng zài huǒchē shang le); méi, with no le, for what did not happen (wǒ méi gǎnshàng huǒchē; wǒ méi diǎn zhège cài)."
  feelings: "Adjectives are predicates without shì, usually with hěn (wǒ hěn gāoxìng, tā hěn dānxīn); yǒudiǎnr for 'a little' (wǒ yǒudiǎnr lèi); bié or búyào + verb for 'don't' (bié dānxīn); zěnme le? for 'what is wrong?'."
  polite_requests: "Chinese is polite with words, not with a verb form: nín, qǐng, máfan nín (may I trouble you), questions with néng bu néng and kě bu kěyǐ, yíxià to soften a verb (děng yíxià); wǒ xiǎng and wǒ hěn xiǎng (I would like), wǒ gèng xiǎng (I would rather); ... jiù tài hǎo le (it would be great)."
