vocabulary:
  # opinions
  wo_juede: { t: "wǒ juéde", pos: phrase, en: ["I think", "I feel", "in my opinion"], forms: ["wǒ juéde", "juéde", "wǒ jué de", "zài wǒ kànlái", "duì wǒ lái shuō"], ex: ["Wǒ juéde tài guì le.", "I think it is too expensive."], n: "The everyday way to give a view; the clause after it is said as usual. 'Duì wǒ lái shuō' is 'for me'." }
  wo_renwei: { t: "wǒ rènwéi", pos: phrase, en: ["I think that", "I believe that", "I consider that"], forms: ["wǒ rènwéi", "rènwéi", "wǒ rèn wéi"], ex: ["Wǒ rènwéi zhè shì zhēn de.", "I think that it is true."], n: "A little more considered than wǒ juéde; the clause after it does not change." }
  ni_juede_zenmeyang: { t: "nǐ juéde zěnmeyàng", pos: phrase, en: ["what do you think", "what do you think of it"], forms: ["nǐ juéde zěnmeyàng", "nín juéde zěnmeyàng", "nǐ juéde ne", "nín juéde ne", "nǐ juéde", "nín juéde", "nǐ zěnme kàn", "nín zěnme kàn", "nǐ de kànfǎ ne", "nín de kànfǎ ne"], ex: ["Nǐ ne, nǐ juéde zěnmeyàng?", "And you, what do you think?"], n: "'Nín zěnme kàn?' is 'how do you see it?', to a stranger." }
  kan_qingkuang: { t: "kàn qíngkuàng", pos: phrase, en: ["it depends", "it depends on the situation"], forms: ["kàn qíngkuàng", "nà yào kàn qíngkuàng", "bù yídìng", "wǒ bù quèdìng", "bù quèdìng"], ex: ["Kàn tiānqì de qíngkuàng.", "It depends on the weather."], n: "'Wǒ bù quèdìng' is 'I am not sure'; 'bù yídìng' is 'not necessarily'." }
  wo_tongyi: { t: "wǒ tóngyì", pos: phrase, en: ["I agree"], forms: ["wǒ tóngyì", "tóngyì", "nǐ shuō de duì", "nín shuō de duì", "shuō de duì", "nǐ shuō de yǒu dàolǐ", "yǒu dàolǐ"], ex: ["Wǒ tóngyì nǐ de kànfǎ.", "I agree with your view."], n: "'Nǐ shuō de duì' is 'you are right' (what you say is right)." }
  wo_bu_tongyi: { t: "wǒ bù tóngyì", pos: phrase, en: ["I don't agree", "I disagree"], forms: ["wǒ bù tóngyì", "bù tóngyì", "wǒ bú tài tóngyì", "bú tài tóngyì", "wǒ bú zhème xiǎng", "wǒ bú zhème juéde", "bú duì"], ex: ["Bù hǎo yìsi, wǒ bù tóngyì.", "I'm sorry, I don't agree."], n: "'Wǒ bú tài tóngyì' (I don't quite agree) is the gentler way." }
  you_yiding_daoli: { t: "yǒu yídìng dàolǐ", pos: phrase, en: ["there is something in it", "partly right"], forms: ["yǒu yídìng dàolǐ", "yǒu yìdiǎn dàolǐ", "yǒu yìdiǎnr dàolǐ", "yí bùfen", "yěxǔ ba", "yěxǔ nǐ shuō de duì"], ex: ["Zhè zhǐ yǒu yídìng dàolǐ.", "It is only partly right."], n: "'Yěxǔ ba' is 'perhaps', 'it may be so'." }
  yinwei: { t: "yīnwèi", pos: conjunction, en: ["because"], forms: ["yīnwèi", "yīn wèi"], ex: ["Wǒ bú qù, yīnwèi wǒ hěn lèi.", "I'm not going, because I am tired."], n: "Often paired with suǒyǐ: yīnwèi xià yǔ, suǒyǐ wǒ bú qù." }
  suoyi: { t: "suǒyǐ", pos: conjunction, en: ["so", "that is why", "therefore"], forms: ["suǒyǐ", "suǒ yǐ", "yīncǐ"], ex: ["Xià yǔ le, suǒyǐ wǒ dāi zài jiā lǐ.", "It is raining, so I am staying at home."] }
  biru: { t: "bǐrú", pos: phrase, en: ["for example"], forms: ["bǐrú", "bǐ rú", "bǐrú shuō", "bǐfang shuō", "lìrú", "jǔ ge lìzi"], ex: ["Bǐrú, xīngqītiān shāngdiàn dōu guān mén.", "For example, on Sundays the shops are all shut."], n: "'Jǔ ge lìzi' is 'to give an example'." }
  zui_zhongyao_de_shi: { t: "zuì zhòngyào de shì", pos: phrase, en: ["the most important thing is"], forms: ["zuì zhòngyào de shì", "zuì zhòngyào de", "zuì zhòngyào", "zhòngyào de shì", "zhòngyào"], ex: ["Zuì zhòngyào de shì jiànkāng.", "The most important thing is health."] }
  # advice
  bu_zhidao_zenme_ban: { t: "bù zhīdào zěnme bàn", pos: phrase, en: ["I don't know what to do"], forms: ["bù zhīdào zěnme bàn", "wǒ bù zhīdào zěnme bàn", "bù zhīdào gāi zěnme bàn", "wǒ bù zhīdào gāi zěnme bàn", "wǒ yǒu yí ge wèntí", "yǒu yí ge wèntí", "wǒ yǒu ge wèntí"], ex: ["Wǒ de yàoshi diū le, wǒ bù zhīdào zěnme bàn.", "I have lost my keys and I don't know what to do."], n: "'Zěnme bàn' is 'what is to be done'." }
  wo_gai_zenme_ban: { t: "wǒ gāi zěnme bàn", pos: phrase, en: ["what should I do"], forms: ["wǒ gāi zěnme bàn", "gāi zěnme bàn", "wǒ yīnggāi zěnme bàn", "wǒ yīnggāi zuò shénme", "zěnme bàn", "nǐ yǒu shénme jiànyì", "nín yǒu shénme jiànyì", "nǐ jiànyì wǒ zěnme zuò", "nín jiànyì wǒ zěnme zuò"], ex: ["Nǐ shuō, wǒ gāi zěnme bàn?", "Tell me, what should I do?"], n: "'Nín yǒu shénme jiànyì?' is 'what do you advise?'." }
  ruguo_ni_shi_wo: { t: "rúguǒ nǐ shì wǒ", pos: phrase, en: ["if you were me", "in my place"], forms: ["rúguǒ nǐ shì wǒ", "rúguǒ nín shì wǒ", "huànchéng nǐ", "nǐ huì zěnme zuò", "nín huì zěnme zuò", "nǐ huì zěnme bàn", "nín huì zěnme bàn"], ex: ["Rúguǒ nǐ shì wǒ, nǐ huì zěnme bàn?", "What would you do in my place?"], n: "Chinese has no conditional form: huì (would, will) before the verb does the work." }
  yinggai: { t: "yīnggāi", pos: verb, en: ["should", "ought to"], forms: ["yīnggāi", "yīng gāi", "zuìhǎo", "nǐ zuìhǎo", "nín zuìhǎo"], ex: ["Nǐ yīnggāi duō shuì yìdiǎnr.", "You should sleep more."], n: "Before the verb; 'nǐ zuìhǎo ...' is 'you had better ...'." }
  ni_keyi: { t: "nǐ kěyǐ", pos: phrase, en: ["you could", "you can"], forms: ["nǐ kěyǐ", "nín kěyǐ", "nǐ yě kěyǐ", "nín yě kěyǐ", "bùfáng", "nǐ bùfáng", "nín bùfáng"], ex: ["Nǐ kěyǐ zuò huǒchē qù.", "You could go by train."], n: "'Bùfáng' is 'you might as well', a light suggestion." }
  ruguo_wo_shi_ni: { t: "rúguǒ wǒ shì nǐ", pos: phrase, en: ["if I were you"], forms: ["rúguǒ wǒ shì nǐ", "rúguǒ wǒ shì nín", "huànchéng wǒ"], ex: ["Rúguǒ wǒ shì nǐ, wǒ jiù dāi zài jiā lǐ.", "If I were you, I would stay at home."], n: "Followed by wǒ huì ... or wǒ jiù ... ." }
  wo_jianyi_ni: { t: "wǒ jiànyì nǐ", pos: phrase, en: ["I advise you to", "I suggest you"], forms: ["wǒ jiànyì nǐ", "wǒ jiànyì nín", "wǒ jiànyì", "jiànyì nǐ", "jiànyì nín"], ex: ["Wǒ jiànyì nǐ zǎo diǎnr chūfā.", "I advise you to leave early."] }
  hao_zhuyi: { t: "hǎo zhǔyi", pos: phrase, en: ["good idea", "good advice"], forms: ["hǎo zhǔyi", "zhǔyi bú cuò", "zhège zhǔyi bú cuò", "zhǔyi hěn hǎo", "hǎo jiànyì", "hěn hǎo de jiànyì"], ex: ["Xièxie, zhè shì ge hǎo zhǔyi.", "Thank you, that is good advice."] }
  wo_shishi: { t: "wǒ shìshi", pos: phrase, en: ["I will try", "I'll give it a try"], forms: ["wǒ shìshi", "shìshi", "shì shi", "shìshi kàn", "wǒ jìnlì", "jìnlì"], ex: ["Bù róngyì, búguò wǒ shìshi kàn.", "It is not easy, but I will try."], n: "A doubled verb makes it a quick try; 'wǒ jìnlì' is 'I'll do my best'." }
  bu_rongyi: { t: "bù róngyì", pos: phrase, en: ["it is not easy"], forms: ["bù róngyì", "méi nàme róngyì", "méi zhème róngyì", "bú nàme róngyì", "bù jiǎndān", "méi nàme jiǎndān", "wǒ yǐjīng shìguo le", "yǐjīng shìguo le", "wǒ shìguo"], ex: ["Duì wǒ lái shuō bù róngyì.", "For me it is not easy."], n: "'Wǒ yǐjīng shìguo le' is 'I have already tried'." }
  # stories
