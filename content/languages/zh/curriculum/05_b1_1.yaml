  zhengzai: { t: "zhèngzài", pos: adverb, en: ["was doing", "in the middle of"], forms: ["zhèngzài", "zhèng zài"], ex: ["Wǒ zhèngzài děng gōngjiāochē.", "I was waiting for the bus."], n: "Before the verb, for what was going on; the time comes from the story, not the verb." }
  dangshi: { t: "dāngshí", pos: adverb, en: ["at the time", "back then"], forms: ["dāngshí", "dāng shí", "nà shíhou"], ex: ["Dāngshí wǒ zài fàndiàn lǐ.", "At the time I was in the restaurant."] }
  de_shihou: { t: "de shíhou", pos: phrase, en: ["while", "when"], forms: ["de shíhou", "de shí hou"], ex: ["Wǒ chī fàn de shíhou, Xiǎo Wáng lái le.", "While I was eating, Xiao Wang arrived."], n: "It follows what was going on: děng chē de shíhou, while waiting for the bus." }
  yibian: { t: "yìbiān", pos: adverb, en: ["while", "at the same time"], forms: ["yìbiān", "yì biān", "yìbiānr"], ex: ["Tā yìbiān zǒu, yìbiān chàng gē.", "He sang as he walked."], n: "Doubled for two things done at once: yìbiān ..., yìbiān ... ." }
  turan: { t: "tūrán", pos: adverb, en: ["suddenly", "all of a sudden"], forms: ["tūrán", "tū rán", "hūrán", "jiù zài zhè shíhou", "zhè shíhou"], ex: ["Tūrán xià qǐ yǔ lái le.", "Suddenly it began to rain."], n: "'Jiù zài zhè shíhou' is 'just at that moment'." }
  diu_le: { t: "diū le", pos: phrase, en: ["I lost", "it is lost", "I have lost"], forms: ["diū le", "diūle", "nòngdiū le", "nòng diū le", "bú jiàn le"], ex: ["Wǒ de piào diū le.", "I have lost my ticket."], n: "With bǎ the thing comes first: wǒ bǎ qiánbāo nòngdiū le. 'Bú jiàn le' is 'it has gone'." }
  zhaodao_le: { t: "zhǎodào le", pos: phrase, en: ["I found", "I have found"], forms: ["zhǎodào le", "zhǎo dào le", "zhǎodào", "jiǎndào le", "jiǎn dào le", "jiǎndào"], ex: ["Wǒ zài guǎngchǎng shang jiǎndào le yì dǐng màozi.", "I found a hat in the square."], n: "'Jiǎndào' is to find a thing lying about, to pick it up." }
  wang_le: { t: "wàng le", pos: phrase, en: ["I forgot", "I have forgotten"], forms: ["wàng le", "wàngle", "wàngjì le", "wàngjì"], ex: ["Wǒ wàng le dài piào.", "I forgot to bring my ticket."] }
  ranhou: { t: "ránhòu", pos: adverb, en: ["then", "afterwards"], forms: ["ránhòu", "rán hòu", "hòulái", "hòu lái", "jiēzhe", "zhīhòu"], ex: ["Ránhòu wǒmen qù chī wǎnfàn le.", "Then we went to dinner."], n: "'Hòulái' is 'later on', for the past only." }
  zuihou: { t: "zuìhòu", pos: adverb, en: ["in the end", "finally"], forms: ["zuìhòu", "zuì hòu", "zuìzhōng", "zhōngyú", "jiéguǒ"], ex: ["Zuìhòu wǒmen dào le.", "In the end we arrived."], n: "'Zhōngyú' is 'at last'." }
  xinghao: { t: "xìnghǎo", pos: adverb, en: ["luckily", "fortunately"], forms: ["xìnghǎo", "xìng hǎo", "xìngkuī", "yùnqi hǎo", "yùnqi zhēn hǎo"], ex: ["Xìnghǎo wǒ dài le yǔsǎn.", "Luckily I had an umbrella."] }
  kexi: { t: "kěxī", pos: adverb, en: ["unfortunately", "what a pity"], forms: ["kěxī", "kě xī", "zhēn kěxī", "bùxìng de shì", "yíhàn de shì"], ex: ["Kěxī tā bú zài jiā.", "Unfortunately he was not at home."], n: "'Bùxìng de shì' is 'the unlucky thing is'." }
  qiguai: { t: "qíguài", pos: adjective, en: ["strange", "odd"], forms: ["qíguài", "qí guài", "hěn qíguài", "zhēn qíguài", "tèbié qíguài"], ex: ["Zhè shì ge hěn qíguài de gùshi.", "It is a strange story."] }
  zaogao: { t: "zāogāo", pos: adjective, en: ["terrible", "awful", "a disaster"], forms: ["zāogāo", "zāo gāo", "tài zāogāo le", "kěpà", "hěn kěpà", "zāotòu le"], ex: ["Zhè cì lǚxíng zhēn zāogāo.", "The journey was terrible."], n: "'Kěpà' is 'frightening, dreadful'." }
  you_yisi: { t: "yǒu yìsi", pos: phrase, en: ["fun", "interesting", "amusing"], forms: ["yǒu yìsi", "yǒuyìsi", "hěn yǒu yìsi", "zhēn yǒu yìsi", "tài yǒu yìsi le", "tǐng yǒu yìsi"], ex: ["Zhè ge diànyǐng hěn yǒu yìsi.", "This film is a lot of fun."] }
  # problems
  xiangzi: { t: "xiāngzi", pos: noun, en: ["suitcase"], forms: ["xiāngzi", "xiāng zi", "xínglixiāng", "xíngli"], ex: ["Wǒ de xiāngzi shì hóngsè de.", "My suitcase is red."], n: "'Xíngli' is luggage in general." }
  bao: { t: "bāo", pos: noun, en: ["bag"], forms: ["bāo", "bēibāo", "shūbāo", "shǒutíbāo"], ex: ["Wǒ de bāo zài nǎr?", "Where is my bag?"], n: "A 'bēibāo' is a rucksack; measure word gè." }
  qianbao: { t: "qiánbāo", pos: noun, en: ["wallet", "purse"], forms: ["qiánbāo", "qián bāo"], ex: ["Qiánbāo zài bāo lǐ.", "The wallet was in the bag."] }
  huzhao: { t: "hùzhào", pos: noun, en: ["passport"], forms: ["hùzhào", "hù zhào", "zhèngjiàn", "shēnfènzhèng"], ex: ["Wǒ zhǎo bu dào hùzhào.", "I can't find my passport."], n: "'Zhèngjiàn' are your papers, 'shēnfènzhèng' an identity card." }
  limian_you: { t: "lǐmiàn yǒu", pos: phrase, en: ["inside there was", "inside it there was"], forms: ["lǐmiàn yǒu", "lǐbian yǒu", "lǐtou yǒu", "lǐmiàn hái yǒu"], ex: ["Lǐmiàn yǒu wǒ de shǒujī.", "Inside it was my telephone."], n: "No past form: lǐmiàn yǒu serves for 'there is' and 'there was'." }
  wang_zai: { t: "wàng zài", pos: phrase, en: ["I left it", "left it behind at"], forms: ["wàng zài", "là zài", "liú zài", "diū zài"], ex: ["Wǒ bǎ tā wàng zài fángjiān lǐ le.", "I left it in the room."], n: "With bǎ and le: wǒ bǎ bāo là zài chē shang le. 'Là' is the everyday word for leaving a thing behind." }
  mei_ganshang: { t: "méi gǎnshàng", pos: phrase, en: ["I missed", "I didn't make it in time for"], forms: ["méi gǎnshàng", "méi gǎn shàng", "gǎn bu shàng", "cuòguò le", "cuòguò"], ex: ["Wǒ méi gǎnshàng bā diǎn de huǒchē.", "I missed the eight o'clock train."], n: "Losing a thing is diū; missing a train is méi gǎnshàng (not catching up with it) or cuòguò." }
  wandian: { t: "wǎndiǎn", pos: verb, en: ["it was late", "it was delayed"], forms: ["wǎndiǎn", "wǎndiǎn le", "chídào", "chídào le", "lái wǎn le", "dào wǎn le"], ex: ["Gōngjiāochē wǎndiǎn le.", "The bus was late."], n: "Wǎndiǎn is said of trains, buses and flights; chídào of people." }
  xia_yi_ban: { t: "xià yì bān", pos: phrase, en: ["the next one", "the next train", "the next bus"], forms: ["xià yì bān", "xià yì bān huǒchē", "xià yì bān chē", "xià yí tàng", "xià yí tàng huǒchē"], ex: ["Xià yì bān huǒchē shí diǎn kāi.", "The next train leaves at ten."], n: "Bān and tàng are the measure words for a scheduled run." }
  suan_cuo_le: { t: "suàn cuò le", pos: phrase, en: ["it has been added up wrong", "there is a mistake"], forms: ["suàn cuò le", "suàncuò le", "yǒu cuòwù", "yǒu ge cuòwù", "yǒu yí ge cuòwù", "cuòwù", "zhàngdān bú duì"], ex: ["Bù hǎo yìsi, zhèr yǒu ge cuòwù.", "Excuse me, there is a mistake here."] }
  wo_mei_dian: { t: "wǒ méi diǎn", pos: phrase, en: ["I didn't order"], forms: ["wǒ méi diǎn", "wǒmen méi diǎn", "méi diǎn", "wǒ méiyǒu diǎn", "wǒmen méiyǒu diǎn", "wǒ méi yào", "wǒmen méi yào"], ex: ["Wǒ méi diǎn yú.", "I didn't order the fish."], n: "Diǎn (cài) is to order a dish; méi denies a past event, with no le." }
  you_shenme_banfa: { t: "yǒu shénme bànfǎ", pos: phrase, en: ["what can be done", "what can I do"], forms: ["yǒu shénme bànfǎ", "yǒu méiyǒu bànfǎ", "yǒu bànfǎ ma", "nǐ néng bāng wǒ ma", "nín néng bāng wǒ ma", "néng bāng wǒ ma"], ex: ["Xiànzài yǒu shénme bànfǎ?", "And now what can be done?"], n: "'Nín néng bāng wǒ ma?' is 'can you help me?'." }
  # feelings
  gaoxing: { t: "gāoxìng", pos: adjective, en: ["happy", "glad"], forms: ["gāoxìng", "hěn gāoxìng", "wǒ hěn gāoxìng", "kāixīn", "hěn kāixīn", "wǒ hěn kāixīn"], ex: ["Jiàndào nǐ wǒ hěn gāoxìng.", "I am happy to see you."], n: "An adjective is a predicate without shì: wǒ hěn gāoxìng." }
  danxin: { t: "dānxīn", pos: verb, en: ["worried", "to worry"], forms: ["dānxīn", "hěn dānxīn", "yǒudiǎn dānxīn", "zháojí", "hěn zháojí"], ex: ["Wǒ hěn dānxīn wǒ dìdi.", "I am worried about my brother."], n: "'Zháojí' is anxious, in a flap." }
  nanguo: { t: "nánguò", pos: adjective, en: ["sad", "upset"], forms: ["nánguò", "hěn nánguò", "shāngxīn", "hěn shāngxīn", "bù kāixīn"], ex: ["Wǒ jīntiān hěn nánguò.", "I am sad today."] }
  wuliao: { t: "wúliáo", pos: adjective, en: ["bored", "boring"], forms: ["wúliáo", "hěn wúliáo", "wúliáo sǐ le"], ex: ["Xià yǔ de shíhou wǒ juéde hěn wúliáo.", "When it rains I am bored."] }
  hen_lei: { t: "hěn lèi", pos: phrase, en: ["I am tired", "very tired"], forms: ["hěn lèi", "tài lèi le", "lèi sǐ le", "fēicháng lèi", "hǎo lèi", "wǒ lèi le", "tǐng lèi de"], ex: ["Wǒ jīntiān hěn lèi.", "I am tired today."], n: "'Lèi sǐ le' is 'dead tired'." }
  chijing: { t: "chījīng", pos: verb, en: ["surprised", "astonished"], forms: ["chījīng", "chī jīng", "hěn chījīng", "chī le yì jīng", "jīngyà", "hěn jīngyà", "méi xiǎngdào", "zhēn méi xiǎngdào"], ex: ["Zài zhèr jiàndào nǐ, wǒ hěn chījīng.", "I am surprised to see you here."], n: "'Méi xiǎngdào' is 'I didn't expect it'." }
  zenme_le: { t: "zěnme le", pos: phrase, en: ["what is wrong", "what is the matter", "what happened"], forms: ["zěnme le", "nǐ zěnme le", "nín zěnme le", "chū shénme shì le", "fāshēng le shénme shì", "zěnme huí shì", "yǒu shénme wèntí"], ex: ["Nǐ zěnme le? Méi shì ba?", "What is wrong? Are you all right?"] }
  weishenme_nanguo: { t: "wèishénme nánguò", pos: phrase, en: ["why are you sad"], forms: ["wèishénme nánguò", "wèishénme zhème nánguò", "wèishénme bù gāoxìng", "wèishénme bù kāixīn", "wèishénme dānxīn", "zěnme bù gāoxìng", "nǐ nánguò ma", "nǐ dānxīn ma"], ex: ["Nǐ jīntiān wèishénme nánguò?", "Why are you sad today?"], n: "Wèishénme (why) stands after the subject: nǐ wèishénme ...?" }
  wo_bang_ni: { t: "wǒ bāng nǐ", pos: phrase, en: ["I'll help you", "can I help you"], forms: ["wǒ bāng nǐ", "wǒ bāng nín", "yào wǒ bāngmáng ma", "yào wǒ bāng máng ma", "wǒ kěyǐ bāng nǐ", "wǒ kěyǐ bāng nín", "wǒ néng bāng nǐ", "wǒ néng bāng nín", "xūyào bāngzhù ma", "wǒ néng zuò diǎnr shénme"], ex: ["Wǒ bāng nǐ ná xiāngzi ba.", "Let me help you with the suitcase."], n: "'Yào wǒ bāngmáng ma?' is 'do you want me to help?'." }
  wo_lijie: { t: "wǒ lǐjiě", pos: phrase, en: ["I understand", "I understand you"], forms: ["wǒ lǐjiě", "lǐjiě", "wǒ lǐjiě nǐ", "wǒ néng lǐjiě", "zhēn nánwéi nǐ le", "zhēn yíhàn"], ex: ["Wǒ lǐjiě, zhè hěn nán.", "I understand, it is hard."], n: "'Zhēn nánwéi nǐ le' is 'that must be hard for you'." }
  bie_danxin: { t: "bié dānxīn", pos: phrase, en: ["don't worry"], forms: ["bié dānxīn", "búyào dānxīn", "bú yào dānxīn", "búyòng dānxīn", "bú yòng dānxīn", "bié zháojí", "fàngxīn ba", "fàngxīn", "qǐng fàngxīn"], ex: ["Bié dānxīn, wǒ lái bàn.", "Don't worry, I'll see to it."], n: "To a stranger: nín fàngxīn (rest easy)." }
  yiqie_dou_hui_hao_de: { t: "yíqiè dōu huì hǎo de", pos: phrase, en: ["everything will be all right"], forms: ["yíqiè dōu huì hǎo de", "yíqiè dōu huì hǎo qǐlai de", "huì hǎo de", "huì hǎo qǐlai de", "méi wèntí de", "huì guòqu de", "dōu huì guòqu de"], ex: ["Nǐ kàn ba, yíqiè dōu huì hǎo de.", "You'll see, everything will be all right."], n: "'Huì guòqu de' is 'it will pass'." }
  # polite_requests
  nin_neng_bu_neng: { t: "nín néng bu néng", pos: phrase, en: ["could you", "would you be able to"], forms: ["nín néng bu néng", "nǐ néng bu néng", "néng bu néng", "kě bu kěyǐ", "nín kě bu kěyǐ", "nǐ kě bu kěyǐ", "néng bu néng qǐng nín"], ex: ["Bù hǎo yìsi, nín néng bu néng bāng wǒ yíxià?", "Excuse me, could you help me?"], n: "The yes-or-no question makes the request; yíxià after the verb softens it." }
  bang_ge_mang: { t: "bāng ge máng", pos: phrase, en: ["do a favour", "give a hand"], forms: ["bāng ge máng", "bāng wǒ ge máng", "bāng wǒ yí ge máng", "bāngmáng", "bāng máng"], ex: ["Nǐ néng bāng wǒ ge máng ma? Guān yíxià mén.", "Will you do me a favour? Shut the door."] }
  qing: { t: "qǐng", pos: verb, en: ["please", "would you mind"], forms: ["qǐng", "máfan nǐ", "máfan nín"], ex: ["Máfan nín shuō màn yìdiǎnr.", "Would you mind speaking more slowly?"], n: "Máfan nín (may I trouble you) + verb is the usual way to ask a stranger for something; qǐng comes before the verb." }
  jieyi: { t: "jièyì", pos: verb, en: ["to mind", "do you mind"], forms: ["jièyì", "nín jièyì ma", "nǐ jièyì ma", "bú jièyì"], ex: ["Nín jièyì wǒ zuò zhèr ma?", "Do you mind if I sit here?"], n: "Jièyì asks whether the other minds what you do: nín jièyì wǒ ... ma?" }
  jie_wo: { t: "jiè wǒ", pos: phrase, en: ["lend me", "would you lend me"], forms: ["jiè wǒ", "jiè gěi wǒ", "jiègěi wǒ", "jiè wǒ yíxià", "gēn nǐ jiè", "gēn nín jiè", "xiàng nín jiè", "xiàng nǐ jiè"], ex: ["Nǐ néng jiè wǒ shí kuài qián ma?", "Would you lend me ten yuan?"], n: "Jiè is both to lend and to borrow: jiè wǒ (lend me), gēn nǐ jiè (borrow from you)." }
  wo_hen_xiang: { t: "wǒ hěn xiǎng", pos: phrase, en: ["I would love to", "I would really like to"], forms: ["wǒ hěn xiǎng", "wǒ zhēn xiǎng", "wǒ hǎo xiǎng", "wǒ tèbié xiǎng"], ex: ["Míngnián wǒ hěn xiǎng zài lái.", "I would love to come back next year."] }
  wo_xiang: { t: "wǒ xiǎng", pos: phrase, en: ["I would like", "I'd like to"], forms: ["wǒ xiǎng", "wǒmen xiǎng"], ex: ["Wǒ xiǎng zài zhèr duō zhù yì tiān.", "I would like to stay here one more day."], n: "Softer than wǒ yào (I want)." }
  wo_geng_xiang: { t: "wǒ gèng xiǎng", pos: phrase, en: ["I would prefer", "I would rather"], forms: ["wǒ gèng xiǎng", "gèng xiǎng", "wǒ bǐjiào xiǎng", "wǒ níngyuàn", "níngyuàn", "wǒ háishi"], ex: ["Wǒ gèng xiǎng dāi zài jiā lǐ.", "I would rather stay at home."], n: "'Wǒ háishi ... ba' is 'I think I'd rather ...'." }
  jiu_tai_hao_le: { t: "jiù tài hǎo le", pos: phrase, en: ["it would be great", "it would be nice"], forms: ["jiù tài hǎo le", "nà jiù tài hǎo le", "jiù hǎo le", "huì hěn hǎo", "huì gèng hǎo"], ex: ["Nǐ néng lái jiù tài hǎo le.", "It would be great if you could come."], n: "After a wish or a condition: (rúguǒ) ... jiù tài hǎo le." }
  kongpa_bu_xing: { t: "kǒngpà bù xíng", pos: phrase, en: ["I am afraid not"], forms: ["kǒngpà bù xíng", "kǒngpà bù néng", "kǒngpà bú tài xíng", "kǒngpà", "bú tài fāngbiàn", "bù fāngbiàn"], ex: ["Míngtiān? Kǒngpà bù xíng.", "Tomorrow? I am afraid not."], n: "'Bú tài fāngbiàn' (it is not very convenient) is the polite way to say no." }
  wo_bu_neng: { t: "wǒ bù néng", pos: phrase, en: ["I can't", "I cannot"], forms: ["wǒ bù néng", "wǒmen bù néng", "bù néng lái", "lái bu liǎo", "wǒ lái bu liǎo", "wǒ bù xíng", "bù xíng", "qù bu liǎo", "wǒ qù bu liǎo"], ex: ["Duìbuqǐ, wǒ bù néng lái.", "Sorry, I can't come."], n: "'Wǒ qù bu liǎo' is 'I won't be able to go'." }
  mei_shijian: { t: "méi shíjiān", pos: phrase, en: ["I have no time", "I don't have time"], forms: ["méi shíjiān", "wǒ méi shíjiān", "méiyǒu shíjiān", "méi yǒu shíjiān", "gǎn shíjiān", "wǒ gǎn shíjiān", "yǒu jíshì", "wǒ yǒu jíshì"], ex: ["Bù hǎo yìsi, wǒ méi shíjiān.", "I'm sorry, I have no time."], n: "'Wǒ gǎn shíjiān' is 'I am in a hurry'; 'yǒu jíshì' is 'something urgent has come up'." }
  yihuir: { t: "yíhuìr", pos: adverb, en: ["later", "in a while"], forms: ["yíhuìr", "yíhuì", "děng yíhuìr", "guò yíhuìr", "wǎn yìdiǎnr", "wǎn yìdiǎn", "gǎitiān"], ex: ["Wǒ yíhuìr gěi nǐ dǎ diànhuà.", "I'll call you later."], n: "'Gǎitiān' is 'another day'." }
