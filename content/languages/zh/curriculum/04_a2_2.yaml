    where_work: { say: [gongsi, xuexiao, shangdian, yiyuan, zai_jia_gongzuo], examples: ["Wǒ zài yì jiā gōngsī gōngzuò.", "Wǒ zài jiā gōngzuò."] }
  work_day:
