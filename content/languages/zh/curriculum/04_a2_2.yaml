vocabulary:
  # invitations
  xiang_bu_xiang: { t: "xiǎng bu xiǎng", pos: phrase, en: ["would you like to", "do you want to"], forms: ["xiǎng bu xiǎng", "xiǎng bù xiǎng", "yào bu yào", "yào bù yào"], ex: ["Nǐ xiǎng bu xiǎng yìqǐ qù?", "Would you like to come along?"], n: "A verb, then bù, then the verb again asks a yes-or-no question." }
  wo_qing_ni: { t: "wǒ qǐng nǐ", pos: phrase, en: ["I invite you", "it's my treat"], forms: ["wǒ qǐng nǐ", "wǒ qǐng nín", "wǒ qǐngkè", "wǒ qǐng kè"], ex: ["Jīntiān wǒ qǐng nǐ chī fàn.", "Today dinner is on me."], n: "Who invites pays: wǒ qǐng nǐ hē kāfēi is 'let me buy you a coffee'." }
  zenmeyang: { t: "zěnmeyàng", pos: phrase, en: ["what about", "how about", "how is it"], forms: ["zěnmeyàng", "zěnme yàng", "hǎo bu hǎo"], ex: ["Míngtiān wǎnshang zěnmeyàng?", "What about tomorrow evening?"], n: "Put it after the suggestion: wǒmen qù gōngyuán, zěnmeyàng?" }
  zanmen: { t: "zánmen", pos: pronoun, en: ["let's", "we (you and I)"], forms: ["zánmen", "wǒmen qù", "wǒmen yìqǐ qù"], ex: ["Zánmen zǒu ba!", "Let's go!"], n: "Zánmen is 'we' with the listener included; ba at the end makes it a suggestion." }
  zai_nar_jianmian: { t: "zài nǎr jiànmiàn", pos: phrase, en: ["where shall we meet"], forms: ["zài nǎr jiànmiàn", "zài nǎlǐ jiànmiàn", "jǐ diǎn jiànmiàn", "shénme shíhou jiànmiàn", "jiànmiàn", "jiàn miàn"], ex: ["Míngtiān wǒmen zài nǎr jiànmiàn?", "Where shall we meet tomorrow?"] }
  leyi: { t: "lèyì", pos: adjective, en: ["gladly", "I'd love to"], forms: ["lèyì", "hěn lèyì", "wǒ hěn lèyì", "hěn xiǎng qù", "wǒ hěn xiǎng qù"], ex: ["Wǒ hěn lèyì bāng nǐ.", "I'd be glad to help you."], n: "'Wǒ hěn xiǎng qù' is 'I'd really like to go'." }
  dangran: { t: "dāngrán", pos: adverb, en: ["of course", "certainly"], forms: ["dāngrán", "dāng rán", "dāngrán kěyǐ"], ex: ["Dāngrán, wǒ yídìng lái.", "Of course, I'll definitely come."] }
  hao_zhuyi: { t: "hǎo zhǔyi", pos: phrase, en: ["good idea"], forms: ["hǎo zhǔyi", "zhǔyi bú cuò", "bú cuò de zhǔyi"], ex: ["Zhè shì ge hǎo zhǔyi.", "That's a good idea."] }
  dai_shenme: { t: "dài shénme", pos: phrase, en: ["bring something", "shall I bring something"], forms: ["dài shénme", "dài diǎnr shénme", "dài diǎn shénme", "dài shénme dōngxi", "dài dōngxi"], ex: ["Wǒ yào dài shénme ma?", "Should I bring anything?"], n: "A guest brings fruit or a small gift (lǐwù), and the host says it was not needed." }
  zhen_bu_qiao: { t: "zhēn bù qiǎo", pos: phrase, en: ["unfortunately", "what bad luck", "bad timing"], forms: ["zhēn bù qiǎo", "bù qiǎo", "bú tài qiǎo", "kěxī", "zhēn kěxī", "tài kěxī le"], ex: ["Zhēn bù qiǎo, wǒ míngtiān yǒu shì.", "Unfortunately, I have something on tomorrow."], n: "'Kěxī!' is 'what a pity!'." }
  wo_you_shi: { t: "wǒ yǒu shì", pos: phrase, en: ["I have something on", "I am busy"], forms: ["wǒ yǒu shì", "yǒu shì", "yǒu ānpái", "yǐjīng yǒu ānpái le", "yǒu yuē le", "wǒ yǒu yuē le"], ex: ["Xīngqīliù wǒ yǒu shì.", "I have something on on Saturday."], n: "'Yǒu ānpái' is 'I have plans'; a vague reason is the polite one." }
  hen_mang: { t: "hěn máng", pos: phrase, en: ["busy", "I am busy"], forms: ["hěn máng", "wǒ hěn máng", "tài máng le", "fēicháng máng"], ex: ["Zhè ge xīngqī wǒ hěn máng.", "This week I am busy."] }
  gaitian: { t: "gǎitiān", pos: adverb, en: ["another day", "another time"], forms: ["gǎitiān", "gǎi tiān", "xià cì", "xià yí cì", "huàn yì tiān"], ex: ["Wǒmen gǎitiān zài liáo ba.", "Let's talk another day."], n: "'Xià cì' is 'next time'." }
  # comparisons
  haishi: { t: "háishi", pos: conjunction, en: ["or (in a question)", "which"], forms: ["háishi", "hái shi"], ex: ["Nǐ yào chá háishi kāfēi?", "Would you like tea or coffee?"], n: "Háishi asks the listener to choose; huòzhě is the 'or' of statements." }
  na_ge_geng: { t: "nǎ ge gèng", pos: phrase, en: ["which one is more"], forms: ["nǎ ge gèng", "něi ge gèng", "nǎ ge bǐjiào", "něi ge bǐjiào"], ex: ["Nǎ ge gèng hǎochī?", "Which one is tastier?"] }
  bi: { t: "bǐ", pos: preposition, en: ["than", "compared with"], forms: ["bǐ"], ex: ["Jīntiān bǐ zuótiān rè.", "Today is hotter than yesterday."], n: "A bǐ B + adjective, with no hěn: wǒ bǐ nǐ gāo, not wǒ bǐ nǐ hěn gāo." }
  geng: { t: "gèng", pos: adverb, en: ["more", "even more"], forms: ["gèng"], ex: ["Zhè ge fángjiān gèng dà.", "This room is bigger."] }
  pianyi: { t: "piányi", pos: adjective, en: ["cheap", "cheaper"], forms: ["piányi", "pián yi", "piányi yìdiǎn"], ex: ["Gōngjiāochē bǐ chūzūchē piányi.", "The bus is cheaper than a taxi."], n: "'Piányi yìdiǎn ba?' is how to haggle: 'a bit cheaper?'." }
  gui: { t: "guì", pos: adjective, en: ["expensive", "dear"], forms: ["guì", "bǐjiào guì"], ex: ["Fēijī piào bǐ huǒchē piào guì.", "A plane ticket is dearer than a train ticket."] }
  geng_hao: { t: "gèng hǎo", pos: phrase, en: ["better"], forms: ["gèng hǎo", "hǎo yìdiǎn", "hǎo yìxiē", "bǐjiào hǎo"], ex: ["Jīntiān wǒ hǎo yìdiǎn le.", "I feel a bit better today."] }
  geng_cha: { t: "gèng chà", pos: phrase, en: ["worse"], forms: ["gèng chà", "chà yìdiǎn", "gèng bù hǎo", "gèng zāogāo", "bù rú"], ex: ["Jīntiān wǒ gèng bù shūfu le.", "I feel worse today."], n: "A bù rú B: A is not as good as B." }
  zui_hao: { t: "zuì hǎo", pos: phrase, en: ["the best"], forms: ["zuì hǎo", "zuì hǎo de", "zuì bàng", "zuì hǎochī", "zuì hǎochī de"], ex: ["Zhè jiā de miàntiáo zuì hǎochī.", "This place's noodles are the best."] }
  zui: { t: "zuì", pos: adverb, en: ["most", "the most"], forms: ["zuì"], ex: ["Zhè ge zuì piányi.", "This one is the cheapest."], n: "Zuì before any adjective makes the superlative: zuì dà, zuì guì." }
  yiyang: { t: "yíyàng", pos: adjective, en: ["the same", "as ... as"], forms: ["yíyàng", "yí yàng", "yíyàng de"], ex: ["Wǒ gēn wǒ māma yíyàng gāo.", "I am as tall as my mother."], n: "A gēn B yíyàng + adjective: 'A is as ... as B'." }
  chabuduo: { t: "chàbuduō", pos: adjective, en: ["about the same", "almost"], forms: ["chàbuduō", "chà bu duō", "chà bù duō"], ex: ["Jiàgé chàbuduō.", "The prices are about the same."] }
  bu_yiyang: { t: "bù yíyàng", pos: phrase, en: ["different", "not the same"], forms: ["bù yíyàng", "bù yí yàng", "bù yíyàng de", "bù tóng", "bù tóng de"], ex: ["Yánsè bù yíyàng.", "The colour is different."] }
  # travel
  fangjian: { t: "fángjiān", pos: noun, en: ["room", "hotel room"], forms: ["fángjiān", "fáng jiān", "yí ge fángjiān", "dānrénjiān", "dānrén jiān", "shuāngrénjiān", "shuāngrén jiān", "biāozhǔnjiān", "biāojiān"], ex: ["Fángjiān zài sān lóu.", "The room is on the third floor."], n: "'Dānrénjiān' is a single, 'shuāngrénjiān' a double; floors are counted from the ground floor, yī lóu." }
  ge_wanshang: { t: "ge wǎnshang", pos: phrase, en: ["nights (counted)", "night"], forms: ["ge wǎnshang", "yì wǎn", "liǎng wǎn", "sān wǎn", "sì wǎn", "jǐ wǎn"], ex: ["Wǒ yào zhù liǎng wǎn.", "I'd like to stay two nights."], n: "Wǎn counts nights directly: zhù sān wǎn, or sān ge wǎnshang." }
  mingzi_shi: { t: "míngzi shì", pos: phrase, en: ["the name is", "in the name of"], forms: ["míngzi shì", "míngzi jiào"], ex: ["Yùdìng de míngzi shì Lǐ Míng.", "The booking is in the name of Li Ming."], n: "Chinese names put the family name first: Wáng Lì is Mr or Ms Wáng." }
  huai_le: { t: "huài le", pos: phrase, en: ["it is broken", "it doesn't work"], forms: ["huài le", "huàile", "bù néng yòng", "yòng bu liǎo"], ex: ["Diàndēng huài le.", "The light doesn't work."], n: "'Bù néng yòng' is 'can't be used'." }
  re_shui: { t: "rè shuǐ", pos: noun, en: ["hot water"], forms: ["rè shuǐ", "rèshuǐ", "méiyǒu rè shuǐ"], ex: ["Yùshì méiyǒu rè shuǐ.", "There is no hot water in the bathroom."] }
  tai_chao: { t: "tài chǎo", pos: phrase, en: ["too noisy", "too much noise"], forms: ["tài chǎo", "tài chǎo le", "hěn chǎo", "fēicháng chǎo", "zàoyīn"], ex: ["Wǎnshang wàimiàn tài chǎo le.", "At night it is too noisy outside."] }
  huan_fangjian: { t: "huàn fángjiān", pos: phrase, en: ["to change rooms"], forms: ["huàn fángjiān", "huàn ge fángjiān", "huàn yí ge fángjiān", "huàn yì jiān"], ex: ["Wǒ xiǎng huàn fángjiān.", "I would like to change rooms."] }
  zaocan: { t: "zǎocān", pos: noun, en: ["breakfast"], forms: ["zǎocān", "zǎo cān", "zǎofàn", "zǎo fàn"], ex: ["Zǎocān qī diǎn kāishǐ.", "Breakfast starts at seven."], n: "'Bāo zǎocān ma?' is 'is breakfast included?'." }
  tuifang: { t: "tuìfáng", pos: verb, en: ["to check out", "to leave the room"], forms: ["tuìfáng", "tuì fáng"], ex: ["Wǒ shí èr diǎn yǐqián tuìfáng.", "I'll check out before twelve."] }
  wandian: { t: "wǎndiǎn", pos: verb, en: ["to be late", "delayed"], forms: ["wǎndiǎn", "wǎn diǎn", "wǎndiǎn le"], ex: ["Fēijī wǎndiǎn le.", "The plane is delayed."], n: "For trains, buses and planes; a person who is late is chídào." }
  # used_to
  xiao_shihou: { t: "xiǎo shíhou", pos: phrase, en: ["as a child", "when I was little"], forms: ["xiǎo shíhou", "xiǎoshíhou", "xiǎo de shíhou", "xiǎoshíhòu"], ex: ["Xiǎo shíhou wǒ zhù zài Chéngdū.", "As a child I lived in Chengdu."], n: "The time word does what the imperfect does in European languages: the verb stays as it is." }
  yiqian: { t: "yǐqián", pos: noun, en: ["before", "in the past", "used to"], forms: ["yǐqián", "yǐ qián", "cóngqián", "cóng qián"], ex: ["Wǒ yǐqián bù hē kāfēi.", "I didn't use to drink coffee."], n: "After a time it is 'before': shí diǎn yǐqián, before ten." }
  gou: { t: "gǒu", pos: noun, en: ["dog"], forms: ["gǒu", "xiǎo gǒu", "yì zhī gǒu"], ex: ["Wǒ jiā yǒu yì zhī gǒu.", "We have a dog at home."], n: "Animals are counted with zhī." }
  mao: { t: "māo", pos: noun, en: ["cat"], forms: ["māo", "xiǎo māo", "yì zhī māo"], ex: ["Nà zhī māo hěn pàng.", "That cat is very fat."] }
  zixingche: { t: "zìxíngchē", pos: noun, en: ["bicycle", "bike"], forms: ["zìxíngchē", "zìxíng chē", "dānchē", "jiǎotàchē"], ex: ["Wǒ qí zìxíngchē shàngxué.", "I cycle to school."], n: "Counted with liàng; one rides it: qí." }
  ti_zuqiu: { t: "tī zúqiú", pos: phrase, en: ["to play football"], forms: ["tī zúqiú", "tī zú qiú", "tī qiú"], ex: ["Wǒmen zài gōngyuán tī zúqiú.", "We play football in the park."], n: "Football is 'kicked': tī." }
  wanr: { t: "wánr", pos: verb, en: ["to play", "to have fun"], forms: ["wánr"], ex: ["Háizimen zài wàimiàn wánr.", "The children are playing outside."], n: "The southern and written form is wán." }
  mei_ge_xiatian: { t: "měi ge xiàtiān", pos: phrase, en: ["every summer"], forms: ["měi ge xiàtiān", "měi nián xiàtiān", "měi ge dōngtiān", "měi nián", "měi ge xīngqītiān", "měi ge xīngqīliù", "měi ge zhōumò", "měi ge yuè"], ex: ["Měi ge xiàtiān wǒmen qù shān shang.", "Every summer we went to the mountains."], n: "Měi + a measure word + noun; nián and tiān take none: měi nián, měi tiān." }
  na_shihou: { t: "nà shíhou", pos: phrase, en: ["back then", "at that time"], forms: ["nà shíhou", "nà ge shíhou", "nàshíhou"], ex: ["Nà shíhou wǒ hěn xiǎo.", "Back then I was very small."] }
  yiqian_you: { t: "yǐqián yǒu", pos: phrase, en: ["there used to be", "there was"], forms: ["yǐqián yǒu", "yǐqián zhèr yǒu", "nà shíhou yǒu", "cóngqián yǒu"], ex: ["Zhèr yǐqián yǒu yí ge cài shìchǎng.", "There used to be a vegetable market here."] }
  xianzai: { t: "xiànzài", pos: noun, en: ["now"], forms: ["xiànzài", "xiàn zài"], ex: ["Xiànzài wǒ zhù zài Shànghǎi.", "Now I live in Shanghai."] }
  meiyou_le: { t: "méiyǒu le", pos: phrase, en: ["no longer there", "there is no longer"], forms: ["méiyǒu le", "méi le", "yǐjīng méiyǒu le", "bú zài le"], ex: ["Nà jiā shūdiàn méiyǒu le.", "That bookshop is no longer there."], n: "le at the end tells that something has changed." }
  # future
  wo_hui_qu: { t: "wǒ huì qù", pos: phrase, en: ["I will go"], forms: ["wǒ huì qù", "wǒmen huì qù", "huì qù"], ex: ["Míngtiān wǒ huì qù yīyuàn.", "Tomorrow I will go to the hospital."] }
  mingnian: { t: "míngnián", pos: noun, en: ["next year"], forms: ["míngnián", "míng nián", "xià yì nián"], ex: ["Míngnián wǒ huàn gōngzuò.", "Next year I am changing jobs."], n: "Qùnián is last year, jīnnián this year." }
  hui: { t: "huì", pos: verb, en: ["will", "is likely to"], forms: ["huì"], ex: ["Tā huì lái de.", "He will come."], n: "Huì is also 'can' for a skill learned: wǒ huì shuō Zhōngwén." }
  luxing: { t: "lǚxíng", pos: verb, en: ["to travel", "a trip"], forms: ["lǚxíng", "lǚ xíng", "lvxing", "lv xing", "qù lǚxíng"], ex: ["Wǒmen zuò huǒchē qù lǚxíng.", "We will travel by train."], n: "Typed without marks, ü is often v: lvxing." }
  dasuan_zuo_shenme: { t: "dǎsuan zuò shénme", pos: phrase, en: ["what will you do", "what are you going to do"], forms: ["dǎsuan zuò shénme", "dǎsuan gàn shénme", "huì zuò shénme", "yào zuò shénme"], ex: ["Nǐ míngtiān dǎsuan zuò shénme?", "What will you do tomorrow?"] }
  hen_nan: { t: "hěn nán", pos: phrase, en: ["difficult", "it is hard"], forms: ["hěn nán", "tài nán le", "fēicháng nán", "bù nán"], ex: ["Zhōngwén bú tài nán.", "Chinese is not too hard."] }
  rongyi: { t: "róngyì", pos: adjective, en: ["easy"], forms: ["róngyì", "hěn róngyì", "bù róngyì"], ex: ["Zhè ge wèntí hěn róngyì.", "This question is easy."] }
  keneng: { t: "kěnéng", pos: adverb, en: ["perhaps", "maybe", "probably"], forms: ["kěnéng", "kě néng", "yěxǔ", "yě xǔ", "dàgài", "huòxǔ"], ex: ["Wǒ kěnéng yě qù.", "Perhaps I'll go too."], n: "'Dàgài' is 'probably'." }
  wo_baozheng: { t: "wǒ bǎozhèng", pos: phrase, en: ["I promise"], forms: ["wǒ bǎozhèng", "bǎozhèng", "wǒ dāying nǐ", "dāying nǐ", "wǒ dāying nín"], ex: ["Wǒ bǎozhèng míngtiān lái.", "I promise to come tomorrow."], n: "'Wǒ dāying nǐ' is 'I give you my word'." }
  xie_xin: { t: "xiě xìn", pos: phrase, en: ["to write (a letter)", "to write to"], forms: ["xiě xìn", "xiěxìn", "fā wēixìn", "fā xìnxī", "fā duǎnxìn"], ex: ["Wǒ huì gěi nǐ xiě xìn.", "I will write to you."], n: "Most people now send a message on WeChat: fā wēixìn." }
  da_dianhua: { t: "dǎ diànhuà", pos: phrase, en: ["to phone", "to call"], forms: ["dǎ diànhuà", "dǎ ge diànhuà"], ex: ["Wǎnshang wǒ gěi nǐ dǎ diànhuà.", "I will call you this evening."], n: "Gěi + the person goes before the verb: gěi māma dǎ diànhuà." }
  bu_hui_wangji: { t: "bú huì wàngjì", pos: phrase, en: ["I will not forget"], forms: ["bú huì wàngjì", "wǒ bú huì wàngjì", "bú huì wàng", "wàng bu liǎo", "yǒngyuǎn bú huì wàngjì"], ex: ["Wǒ bú huì wàngjì zhè cì lǚxíng.", "I will not forget this trip."] }
  # work
  zuo_shenme_gongzuo: { t: "zuò shénme gōngzuò", pos: phrase, en: ["what do you do for a living", "what is your job"], forms: ["zuò shénme gōngzuò", "nǐ zuò shénme gōngzuò", "nín zuò shénme gōngzuò", "gàn shénme gōngzuò", "shì zuò shénme de", "nǐ shì zuò shénme de", "gàn shénme de"], ex: ["Nǐ àirén zuò shénme gōngzuò?", "What does your husband or wife do?"] }
  xuesheng: { t: "xuésheng", pos: noun, en: ["student", "pupil"], forms: ["xuésheng", "xué sheng", "dàxuéshēng", "dàxuésheng"], ex: ["Wǒ shì xuésheng.", "I am a student."], n: "'Dàxuéshēng' is a university student." }
  laoshi: { t: "lǎoshī", pos: noun, en: ["teacher"], forms: ["lǎoshī", "lǎo shī", "jiàoshī"], ex: ["Wǒ māma shì lǎoshī.", "My mother is a teacher."], n: "Also how a pupil addresses a teacher: Wáng lǎoshī." }
  zhiyuan: { t: "zhíyuán", pos: noun, en: ["office worker", "clerk", "employee"], forms: ["zhíyuán", "gōngsī zhíyuán", "bàngōngshì zhíyuán"], ex: ["Wǒ shì yínháng zhíyuán.", "I am a bank clerk."] }
  chushi: { t: "chúshī", pos: noun, en: ["cook", "chef"], forms: ["chúshī", "chú shī"], ex: ["Wǒ gēge shì chúshī.", "My brother is a cook."] }
  hushi: { t: "hùshi", pos: noun, en: ["nurse"], forms: ["hùshi", "hù shi"], ex: ["Tā zài yīyuàn dāng hùshi.", "She works as a nurse in a hospital."] }
  gongsi: { t: "gōngsī", pos: noun, en: ["company", "office"], forms: ["gōngsī", "gōng sī", "bàngōngshì"], ex: ["Wǒ zài yì jiā xiǎo gōngsī gōngzuò.", "I work for a small company."], n: "Zài + the place + gōngzuò: the place comes before the verb." }
  xuexiao: { t: "xuéxiào", pos: noun, en: ["school"], forms: ["xuéxiào", "xué xiào"], ex: ["Wǒ zài xuéxiào gōngzuò.", "I work in a school."] }
  shangdian: { t: "shāngdiàn", pos: noun, en: ["shop", "store"], forms: ["shāngdiàn", "shāng diàn"], ex: ["Wǒ zài yì jiā xié diàn gōngzuò.", "I work in a shoe shop."], n: "A particular kind of shop is ... diàn: xié diàn, shū diàn." }
  yiyuan: { t: "yīyuàn", pos: noun, en: ["hospital"], forms: ["yīyuàn"], ex: ["Wǒ zài yīyuàn gōngzuò.", "I work in a hospital."] }
  zai_jia_gongzuo: { t: "zài jiā gōngzuò", pos: phrase, en: ["to work from home", "I work from home"], forms: ["zài jiā gōngzuò", "zàijiā gōngzuò", "zài jiā shàngbān", "zài jiā bàngōng"], ex: ["Xīngqīwǔ wǒ zài jiā gōngzuò.", "On Fridays I work from home."] }
  shangban: { t: "shàngbān", pos: verb, en: ["to start work", "to go to work"], forms: ["shàngbān", "shàng bān", "kāishǐ gōngzuò", "kāishǐ shàngbān"], ex: ["Wǒ bā diǎn bàn shàngbān.", "I start work at half past eight."] }
  xiaban: { t: "xiàbān", pos: verb, en: ["to finish work", "to leave work"], forms: ["xiàbān", "xià bān"], ex: ["Wǒ liù diǎn xiàbān.", "I finish work at six."], n: "Shàng (up) to start, xià (down) to finish, as with classes: shàngkè, xiàkè." }
  wo_de_gongzuo: { t: "wǒ de gōngzuò", pos: phrase, en: ["my job", "my work"], forms: ["wǒ de gōngzuò"], ex: ["Wǒ de gōngzuò hěn máng.", "My job is very busy."] }
  xiang_dang: { t: "xiǎng dāng", pos: phrase, en: ["I would like to become", "want to be"], forms: ["xiǎng dāng", "xiǎng chéngwéi", "yào dāng"], ex: ["Wǒ xiǎng dāng chúshī.", "I would like to become a cook."], n: "Dāng + a job is 'to work as', 'to be'." }
  yinwei: { t: "yīnwèi", pos: conjunction, en: ["because"], forms: ["yīnwèi", "yīn wèi"], ex: ["Wǒ bù qù, yīnwèi wǒ hěn lèi.", "I'm not going, because I'm tired."], n: "Often paired: yīnwèi ..., suǒyǐ ... (because ..., so ...)." }
  you_yisi: { t: "yǒu yìsi", pos: adjective, en: ["interesting", "fun"], forms: ["yǒu yìsi", "yǒuyìsi", "hěn yǒu yìsi", "méi yìsi"], ex: ["Zhè běn shū hěn yǒu yìsi.", "This book is very interesting."], n: "'Méi yìsi' is 'boring'." }
  youyong: { t: "yǒuyòng", pos: adjective, en: ["useful"], forms: ["yǒuyòng", "yǒu yòng", "hěn yǒuyòng"], ex: ["Zhè ge gōngzuò hěn yǒuyòng.", "This job is useful."] }
  gongzi_gao: { t: "gōngzī gāo", pos: phrase, en: ["well paid", "the pay is high"], forms: ["gōngzī gāo", "gōngzī hěn gāo", "gōngzī bú cuò", "zhuàn qián duō", "zhèng qián duō"], ex: ["Zhè ge gōngzuò gōngzī bù gāo.", "This job is not well paid."] }
  xiang_dang_shenme: { t: "xiǎng dāng shénme", pos: phrase, en: ["what did you want to be", "what do you want to be"], forms: ["xiǎng dāng shénme", "xiǎng chéngwéi shénme", "xiǎng zuò shénme gōngzuò"], ex: ["Nǐ xiǎo shíhou xiǎng dāng shénme?", "What did you want to be when you were little?"], n: "Zhǎngdà yǐhòu is 'when I grow up'." }
