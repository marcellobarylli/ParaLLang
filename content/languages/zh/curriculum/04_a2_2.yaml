stage: a2_2
version: curriculum-a2-2-zh-v1
grammar:
  invitations: "xiǎng bu xiǎng + verb to invite (nǐ xiǎng bu xiǎng qù kàn diànyǐng?); wǒ qǐng nǐ for 'my treat'; zánmen + verb + ba for 'let's', ... zěnmeyàng? for 'what about'; hǎo a, dāngrán, hěn lèyì to accept; zhēn bù qiǎo and wǒ yǒu shì to decline politely, gǎitiān for another day."
  comparisons: "A bǐ B + adjective (Běijīng bǐ Shànghǎi lěng), with no hěn in a bǐ sentence; gèng for 'even more'; there is no irregular 'better': bǐ ... hǎo, gèng hǎo, and A bù rú B for 'A is not as good as B'; zuì for the superlative (zuì guì, zuì hǎo); A gēn B yíyàng (+ adjective) for 'as ... as' and 'the same', bù yíyàng for 'different'; A háishi B? for 'which of the two'."
  travel: "A room is counted with ge or jiān (yí ge shuāngrénjiān) and nights with wǎn (zhù liǎng wǎn); wǒ yùdìngle, míngzi shì ... for a booking; ... huài le and ... bù néng yòng for what is broken, méiyǒu rè shuǐ; questions with jǐ diǎn and bāo ... ma? (bāo zǎocān ma?)."
  used_to: "Chinese has no imperfect: a time word does the work (xiǎo shíhou, yǐqián, nà shíhou) and the verb stays as it is (wǒ xiǎo shíhou zhù zài Chéngdū); měi + a measure word for habits (měi ge xiàtiān, měi nián); yǐqián yǒu ... for 'there used to be', xiànzài méiyǒu le for 'no longer'."
  future: "No future tense: a time word with huì ('will', 'is likely to') or dǎsuan says it (míngnián wǒ huì qù Zhōngguó; míngtiān huì xià yǔ); kěnéng and dàgài for 'perhaps' and 'probably'; wǒ bǎozhèng, wǒ dāying nǐ for promises; huì ... de for a firm 'will' (wǒ huì huílái de)."
  work: "shì + a job (wǒ shì lǎoshī, wǒ shì yí ge hùshi); zài + place + gōngzuò, with the place before the verb (wǒ zài xuéxiào gōngzuò); shàngbān and xiàbān for starting and finishing work; wǒ xiǎng dāng + a job for 'I would like to become'."
lessons:
  invitations_invite:
    invite: { say: [xiang_bu_xiang, wo_qing_ni], examples: ["Nǐ xiǎng bu xiǎng qù kàn diànyǐng?", "Wǒ qǐng nǐ chī wǎnfàn.", "Wǒ qǐng nín hē kāfēi, hǎo ma?"] }
    suggest: { say: [zenmeyang, zanmen], examples: ["Zánmen qù kàn diànyǐng ba!", "Xīngqīliù zěnmeyàng?", "Wǒmen qù chī huǒguō, zěnmeyàng?"] }
    where_meet: { say: [zai_nar_jianmian], examples: ["Wǒmen zài nǎr jiànmiàn?", "Wǒmen jǐ diǎn jiànmiàn?"] }
  invitations_accept:
    accept: { say: [leyi, dangran], examples: ["Hǎo a, wǒ hěn xiǎng qù!", "Dāngrán, hěn lèyì."] }
    good_idea: { say: [hao_zhuyi], examples: ["Hǎo zhǔyi!", "Zhè shì ge hǎo zhǔyi."] }
    bring: { say: [dai_shenme], examples: ["Wǒ yào dài diǎnr shénme ma?", "Xūyào wǒ dài shénme ma?"] }
  invitations_decline:
    decline: { say: [zhen_bu_qiao, wo_bu_neng], examples: ["Zhēn bù qiǎo, wǒ bù néng qù.", "Bù hǎoyìsi, xīngqīliù wǒ lái bu liǎo."] }
    excuse: { say: [wo_you_shi, hen_mang], examples: ["Wǒ hěn máng.", "Wǒ yǐjīng yǒu ānpái le."] }
    another_time: { say: [gaitian], examples: ["Wǒmen gǎitiān ba?", "Xià cì zài qù ba."] }
  comparisons_more:
    ask_which: { say: [haishi, na_ge_geng], examples: ["Běijīng dà háishi Shànghǎi dà?", "Nǎ ge gèng guì?"] }
    bigger_than: { say: [bi, geng], examples: ["Běijīng bǐ Shànghǎi dà.", "Wǒ de fángzi bǐ nǐ de xiǎo.", "Zhè jiān gèng dà."] }
    cheaper: { say: [[bi, geng], [pianyi, gui]], examples: ["Huǒchē bǐ fēijī piányi.", "Zhè ge gèng piányi.", "Yú bǐ ròu guì."] }
  comparisons_better:
    better: { say: [geng_hao, bi], examples: ["Zhè ge gèng hǎo.", "Zhè jiā fàndiàn bǐ nà jiā hǎo."] }
    worse: { say: [geng_cha], examples: ["Zhè ge gèng chà.", "Jīntiān de tiānqì bù rú zuótiān."] }
    the_best: { say: [zui_hao, zui], examples: ["Zhè jiā de jiǎozi zuì hǎochī.", "Zhè ge zuì hǎo.", "Tā shì zuì bàng de."] }
  comparisons_same:
    as_as: { say: [yiyang], examples: ["Wǒ gēge gēn wǒ yíyàng gāo.", "Zhè jiān fángjiān gēn nà jiān yíyàng dà."] }
    same: { say: [chabuduo, yiyang], examples: ["Zhè liǎng ge chàbuduō.", "Tāmen shì yíyàng de."] }
    different: { say: [bu_yiyang], examples: ["Tāmen bù yíyàng.", "Zhè liǎng ge yánsè bù yíyàng."] }
  travel_room:
    room: { say: [fangjian], examples: ["Wǒ yào yí ge shuāngrénjiān.", "Nǐmen yǒu dānrénjiān ma?"] }
    nights: { say: [ge_wanshang], examples: ["Liǎng ge wǎnshang.", "Wǒ zhù sān wǎn."] }
    booking: { say: [yuding, mingzi_shi], examples: ["Wǒ yùdìngle yí ge fángjiān, míngzi shì Wáng Lì.", "Wǒ dìngle yí ge fángjiān, míngzi shì Sam."] }
  travel_problem:
