    change_room: { say: [huan_fangjian], examples: ["Wǒ kěyǐ huàn fángjiān ma?", "Néng bu néng huàn yí ge fángjiān?"] }
  travel_ask:
    breakfast: { say: [zaocan], examples: ["Bāo zǎocān ma?", "Zǎocān jǐ diǎn kāishǐ?"] }
    checkout: { say: [tuifang], examples: ["Jǐ diǎn yǐqián tuìfáng?", "Wǒ děi jǐ diǎn tuìfáng?"] }
    delayed: { say: [wandian], examples: ["Huǒchē wǎndiǎn le ma?", "Huǒchē wǎndiǎn duō jiǔ?"] }
  used_to_child:
    was_like: { say: [xiao_shihou], examples: ["Wǒ xiǎo shíhou hěn hàixiū.", "Xiǎo shíhou wǒ hěn tiáopí."] }
    lived: { say: [yiqian, xiao_shihou], examples: ["Wǒ yǐqián zhù zài yí ge xiǎo zhèn.", "Xiǎo shíhou wǒ gēn fùmǔ zhù zài Lúndūn."] }
    had: { say: [gou, mao, zixingche, yiqian, xiao_shihou], examples: ["Wǒ xiǎo shíhou yǒu yì zhī gǒu.", "Wǒ yǐqián yǒu yí liàng hóngsè de zìxíngchē."] }
  used_to_habits:
    used_to: { say: [ti_zuqiu, wanr, xiao_shihou, yiqian], examples: ["Wǒ xiǎo shíhou chángcháng gēn gēge tī zúqiú.", "Wǒ yǐqián chángcháng qù nǎinai jiā wánr."] }
    how_often: { say: [mei_ge_xiatian], examples: ["Měi ge xiàtiān wǒmen qù hǎibiān.", "Měi ge xīngqītiān wǒmen zài nǎinai jiā chī fàn."] }
    liked: { say: [xiao_shihou, yiqian, na_shihou], examples: ["Wǒ xiǎo shíhou hěn xǐhuan kàn shū.", "Yǐqián wǒ bù xǐhuan shàngxué."] }
  used_to_place:
    there_was: { say: [yiqian_you], examples: ["Zhèr yǐqián yǒu yí ge diànyǐngyuàn.", "Yǐqián zhèr yǒu hěn duō xiǎo shāngdiàn."] }
    it_was: { say: [na_shihou], examples: ["Nà shíhou zhèr hěn ānjìng.", "Nà shíhou chéngshì bǐ xiànzài xiǎo."] }
    now: { say: [xianzai, meiyou_le], examples: ["Xiànzài zhèr yǒu yí ge chāoshì.", "Nà ge diànyǐngyuàn xiànzài méiyǒu le."] }
