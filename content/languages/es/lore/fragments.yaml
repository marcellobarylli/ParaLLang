# Round 030 (backlog A9): fragments of The Journey, found after an encounter and kept in the Spellbook. Optional to
# translate (parallang_obsidian/CHARACTERS.md, Journathan). Authored, not generated. No fragment contains an
# objective target of the pack (server test), so the Spellbook may show them at any time. `title`, `found` and
# `translation` are the same English text in every pack (tested). Pending a native speaker's review.
# Round 032: `after_conversations` unlocks a fragment by party conversations with the found_after character.
fragments:
  - id: journey_first_stitch
    title: The first stitch
    found_after: old_bookshop_bookworm
    found: "Folded inside the battered copy of The Journey that Marginalia sold you, in a hand that changes language halfway through a word."
    text: >-
      Cada vez que Journathan pasaba de una rama a la siguiente, un hilo se quedaba detrás de él. Veinte inviernos de travesías:
      veinte inviernos de hilos. Dicen que los más antiguos todavía sostienen la trama del mundo. Quizá la primera
      puntada fue suya.
    translation: >-
      Each time Journathan passed from one branch to another, a thread stayed behind him. Twenty winters of crossings:
      twenty winters of threads. They say the oldest still hold up the weave of the world. Perhaps the first stitch
      was his.
    glossary:
      - { word: "rama", meaning: "branch" }
      - { word: "hilo", meaning: "thread" }
      - { word: "travesías", meaning: "crossings" }
      - { word: "todavía", meaning: "even now, yet" }
      - { word: "sostienen", meaning: "they hold up" }
      - { word: "trama", meaning: "weave; also plot" }
      - { word: "puntada", meaning: "stitch" }
  - id: journey_sirens
    title: The Sirens
    found_after: cracked_fountain_letharger
    found: "Scratched into the rim of the fountain, under the plaque, at exactly the height of the corner of your eye."
    text: >-
      Las sirenas cantaban en los márgenes de la vista, donde el ojo nunca llega del todo. Journathan se hizo atar
      al mástil del barco: deseaba escuchar sin desviarse hacia ellas. Los marineros, con cera en los oídos, remaban
      y no oían nada. El canto, dicen, era siempre el mismo estribillo, repetido sin fin.
    translation: >-
      The Sirens sang at the edges of sight, where the eye never quite reaches. Journathan had himself tied to the
      ship's mast: he wanted to listen without steering towards them. The sailors, wax in their ears, rowed and
      heard nothing. The song, they say, was always the same refrain, repeated forever.
    glossary:
      - { word: "márgenes", meaning: "edges" }
      - { word: "se hizo atar", meaning: "had himself tied" }
      - { word: "mástil", meaning: "mast" }
      - { word: "desviarse", meaning: "to turn aside, to steer off" }
      - { word: "cera", meaning: "wax" }
      - { word: "remaban", meaning: "they rowed" }
      - { word: "estribillo", meaning: "refrain" }
  - id: journey_shroud
    title: The shroud
    found_after: the_rift_errata
    found: "Left behind when the Rift narrowed to a hairline: a loose thread, and the words that were stitched along it."
    text: >-
      En su isla, la esposa de Journathan tejía un sudario de día y lo deshacía de noche. Los pretendientes creían
      que ganaba tiempo. En verdad mantenía separadas las ramas del mundo, puntada a puntada, hasta que él
      volviera.
    translation: >-
      On her island, Journathan's wife wove a shroud by day and unpicked it by night. The suitors believed she was
      buying time. In truth she was holding the branches of the world apart, stitch by stitch, until he came
      back.
    glossary:
      - { word: "tejía", meaning: "she wove" }
      - { word: "sudario", meaning: "shroud" }
      - { word: "deshacía", meaning: "she undid, unpicked" }
      - { word: "pretendientes", meaning: "suitors" }
      - { word: "ganaba tiempo", meaning: "she was buying time" }
      - { word: "separadas", meaning: "apart, separated" }
      - { word: "hasta que", meaning: "until" }
  - id: journey_dead_branch
    title: The word for it
    found_after: imp_coffee_greeting
    after_conversations: 3
    found: "On your third coffee break, Gerald recites a passage he swears he learned as a barista in the Dead Branch."
    text: >-
      En la Rama Muerta, Journathan bebió algo oscuro y amargo, servido en tazas diminutas. Quien lo probaba lloraba.
      La palabra para decirlo ya no existe: murió con la rama, y hoy no la recuerda ni un diccionario.
    translation: >-
      In the Dead Branch, Journathan drank something dark and bitter, served in very small cups. Whoever tasted it
      wept. The word for it no longer exists: it died with the branch, and today not even a dictionary remembers it.
    glossary:
      - { word: "Rama Muerta", meaning: "Dead Branch" }
      - { word: "bebió", meaning: "he drank (pretérito of beber)" }
      - { word: "amargo", meaning: "bitter" }
      - { word: "tazas", meaning: "cups" }
      - { word: "probaba", meaning: "tasted" }
      - { word: "lloraba", meaning: "wept" }
      - { word: "ni", meaning: "not even" }
      - { word: "diccionario", meaning: "dictionary" }
  - id: journey_forbidden_herd
    title: The forbidden herd
    found_after: butchers_stall_charcutier
    after_conversations: 3
    found: "On your third tasting, Mortimer lowers his voice and recites the one passage of The Journey he refuses to slice."
    text: >-
      En la isla del Sol pastaban rebaños sagrados. Journathan dijo a sus compañeros que no los tocaran. Pero el hambre
      venció al juramento: asaron las reses, y la carne mugía en el asador. Desde entonces, quien corta la carne
      pide permiso.
    translation: >-
      On the island of the Sun grazed sacred herds. Journathan told his companions not to touch them. But hunger was
      stronger than the oath: they roasted the beasts, and the meat lowed on the spit. Since then, whoever cuts meat
      asks permission.
    glossary:
      - { word: "pastaban", meaning: "grazed" }
      - { word: "rebaños", meaning: "herds" }
      - { word: "juramento", meaning: "oath" }
      - { word: "asaron", meaning: "they roasted" }
      - { word: "mugía", meaning: "lowed, mooed" }
      - { word: "asador", meaning: "spit (for roasting)" }
      - { word: "permiso", meaning: "permission" }
  - id: journey_lotus
    title: The lotus
    found_after: cracked_fountain_letharger
    after_conversations: 3
    found: "On your third slow walk, Flick stops (of course) and recites a passage of The Journey it insists is about someone else."
    text: >-
      En una playa tibia, algunos marineros de Journathan comieron la flor del loto. Olvidaron el rumbo, el regreso,
      hasta las ganas de partir. «Cinco minutos», decían, tumbados en la arena, y luego otros cinco. Journathan tuvo
      que arrastrarlos a las naves, y ellos lloraban.
    translation: >-
      On a lukewarm beach, some of Journathan's sailors ate the lotus flower. They forgot the course, the return, even
      the wish to leave. "Five minutes," they said, lying on the sand, and then five more. Journathan had to drag them
      to the ships, and they wept.
    glossary:
      - { word: "tibia", meaning: "lukewarm" }
      - { word: "loto", meaning: "lotus" }
      - { word: "rumbo", meaning: "course, heading" }
      - { word: "hasta", meaning: "even; also until" }
      - { word: "tumbados", meaning: "lying down" }
      - { word: "arena", meaning: "sand" }
      - { word: "arrastrarlos", meaning: "to drag them" }
  - id: journey_old_dog
    title: The old dog
    found_after: old_bookshop_bookworm
    after_conversations: 3
    found: "On your third reading, Marginalia turns to a page she keeps folded down and reads it without looking."
    text: >-
      Journathan volvió a su isla vestido de mendigo, y los suyos no lo reconocieron. Solo un perro viejo, echado sobre
      el estiércol delante de la puerta, levantó las orejas y movió la cola. Lo había esperado todo aquel tiempo. Luego
      cerró los ojos, contento.
    translation: >-
      Journathan came back to his island dressed as a beggar, and his own people did not know him. Only an old dog,
      lying on the dung heap before the door, raised its ears and moved its tail. It had waited for him all that time.
      Then it closed its eyes, content.
    glossary:
      - { word: "mendigo", meaning: "beggar" }
      - { word: "reconocieron", meaning: "they recognised" }
      - { word: "perro", meaning: "dog" }
      - { word: "estiércol", meaning: "dung heap" }
      - { word: "levantó", meaning: "raised" }
      - { word: "cola", meaning: "tail" }
      - { word: "contento", meaning: "content, happy" }
