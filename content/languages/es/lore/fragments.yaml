# Round 030 (backlog A9): fragments of The Journey, found after an encounter and kept in the Spellbook. Optional to
# translate (parallang_obsidian/CHARACTERS.md, Journathan). Authored, not generated. No fragment contains an
# objective target of the pack (server test), so the Spellbook may show them at any time. `title`, `found` and
# `translation` are the same English text in every pack (tested). Pending a native speaker's review.
fragments:
  - id: journey_first_stitch
    title: The first stitch
    found_after: old_bookshop_bookworm
    found: "Folded inside the battered copy of The Journey that Marginalia sold you, in a hand that changes language halfway through a word."
    text: >-
      Cada vez que Journathan pasaba de una rama a otra, un hilo se quedaba detrás de él. Veinte inviernos de travesías:
      veinte inviernos de hilos. Dicen que los más antiguos todavía sostienen la trama del mundo. Quizá la primera
      puntada fue suya.
    translation: >-
      Each time Journathan passed from one branch to another, a thread stayed behind him. Twenty winters of crossings:
      twenty winters of threads. They say the oldest still hold up the weave of the world. Perhaps the first stitch
      was his.
    glossary:
      - { word: "rama", meaning: "branch" }
      - { word: "hilo", meaning: "thread" }
      - { word: "travesías", meaning: "crossings" }
      - { word: "todavía", meaning: "even now, yet" }
      - { word: "sostienen", meaning: "they hold up" }
      - { word: "trama", meaning: "weave; also plot" }
      - { word: "puntada", meaning: "stitch" }
  - id: journey_sirens
    title: The Sirens
    found_after: cracked_fountain_letharger
    found: "Scratched into the rim of the fountain, under the plaque, at exactly the height of the corner of your eye."
    text: >-
      Las sirenas cantaban en los márgenes de la vista, donde el ojo nunca llega del todo. Journathan se hizo atar
      al mástil del barco: deseaba escuchar sin desviarse hacia ellas. Los marineros, con cera en los oídos, remaban
      y no oían nada. El canto, dicen, era siempre el mismo estribillo, repetido sin fin.
    translation: >-
      The Sirens sang at the edges of sight, where the eye never quite reaches. Journathan had himself tied to the
      ship's mast: he wanted to listen without steering towards them. The sailors, wax in their ears, rowed and
      heard nothing. The song, they say, was always the same refrain, repeated forever.
    glossary:
      - { word: "márgenes", meaning: "edges" }
      - { word: "se hizo atar", meaning: "had himself tied" }
      - { word: "mástil", meaning: "mast" }
      - { word: "desviarse", meaning: "to turn aside, to steer off" }
      - { word: "cera", meaning: "wax" }
      - { word: "remaban", meaning: "they rowed" }
      - { word: "estribillo", meaning: "refrain" }
  - id: journey_shroud
    title: The shroud
    found_after: the_rift_errata
    found: "Left behind when the Rift narrowed to a hairline: a loose thread, and the words that were stitched along it."
    text: >-
      En su isla, la esposa de Journathan tejía un sudario de día y lo deshacía de noche. Los pretendientes creían
      que ganaba tiempo. En verdad mantenía separadas las ramas del mundo, puntada a puntada, hasta que él
      volviera.
    translation: >-
      On her island, Journathan's wife wove a shroud by day and unpicked it by night. The suitors believed she was
      buying time. In truth she was holding the branches of the world apart, stitch by stitch, until he came
      back.
    glossary:
      - { word: "tejía", meaning: "she wove" }
      - { word: "sudario", meaning: "shroud" }
      - { word: "deshacía", meaning: "she undid, unpicked" }
      - { word: "pretendientes", meaning: "suitors" }
      - { word: "ganaba tiempo", meaning: "she was buying time" }
      - { word: "separadas", meaning: "apart, separated" }
      - { word: "hasta que", meaning: "until" }
