version: marginalia-folded-page-es-v1
references:
  - id: rae-aqui
    title: "RAE, Diccionario de la lengua española: aquí"
    url: "https://dle.rae.es/aqu%C3%AD"
  - id: rae-solo-alone
    title: "RAE, Diccionario de la lengua española: solo"
    url: "https://dle.rae.es/solo"
entries:
  - id: aqui_estoy
    kind: phrase
    target: "aquí estoy"
    part_of_speech: phrase
    accepted_translations: ["here I am"]
    surface_variants: ["aquí estoy", "aqui estoy"]
    accent_insensitive: false
    example: { target: "¡Aquí estoy, Marginalia!", english: "Here I am, Marginalia!" }
    note: "'Aquí' (here) and 'estoy' (I am, of estar: where you are). 'Estoy aquí' says the same."
    reference_ids: [rae-aqui]
  - id: sola
    kind: word
    target: "sola"
    part_of_speech: adjective
    accepted_translations: ["alone"]
    surface_variants: ["sola"]
    accent_insensitive: false
    example: { target: "No estás sola.", english: "You are not alone." }
    note: "Feminine of 'solo' (alone), said to or about a woman. 'No estás sola' is 'you are not alone'."
    reference_ids: [rae-solo-alone]
