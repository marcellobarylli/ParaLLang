entries:
  - id: jamon
    kind: word
    target: "jamón"
    part_of_speech: noun
    accepted_translations: ["ham"]
    surface_variants: ["jamón", "jamon", "jamones"]
    accent_insensitive: true
    example:
      target: "Cien gramos de jamón, por favor."
      english: "A hundred grams of ham, please."
    reference_ids: [rae-jamon]
  - id: chorizo
    kind: word
    target: "chorizo"
    part_of_speech: noun
    accepted_translations: ["chorizo", "spicy sausage"]
    surface_variants: ["chorizo", "chorizos"]
    accent_insensitive: false
    example:
      target: "Quiero chorizo."
      english: "I want chorizo."
    note: "A cured pork sausage seasoned with paprika."
    reference_ids: [rae-chorizo]
  - id: salchicha
    kind: word
    target: "salchicha"
    part_of_speech: noun
    accepted_translations: ["sausage"]
    surface_variants: ["salchicha", "salchichas"]
    accent_insensitive: false
    example:
      target: "Dos salchichas, por favor."
      english: "Two sausages, please."
    reference_ids: [rae-salchicha]
  - id: pollo
    kind: word
    target: "pollo"
    part_of_speech: noun
    accepted_translations: ["chicken"]
    surface_variants: ["pollo", "pollos"]
    accent_insensitive: false
    example:
      target: "Quiero un pollo."
      english: "I want a chicken."
    reference_ids: [rae-pollo]
  - id: kilo
    kind: word
    target: "kilo"
    part_of_speech: noun
    accepted_translations: ["kilo", "kilogram"]
    surface_variants: ["kilo", "kilos"]
    accent_insensitive: false
    example:
      target: "Un kilo de salchichas."
      english: "A kilo of sausages."
    reference_ids: [rae-kilo]
  - id: gramos
    kind: word
    target: "gramos"
    part_of_speech: noun
    accepted_translations: ["grams"]
    surface_variants: ["gramos", "gramo"]
    accent_insensitive: false
    example:
      target: "Doscientos gramos de chorizo."
      english: "Two hundred grams of chorizo."
    note: "Singular gramo."
    reference_ids: [rae-gramo]
  - id: dos
    kind: word
    target: "dos"
    part_of_speech: numeral
    accepted_translations: ["two"]
    surface_variants: ["dos"]
    accent_insensitive: false
    example:
      target: "Dos salchichas."
      english: "Two sausages."
    reference_ids: [wiktionary-dos]
  - id: tres
    kind: word
    target: "tres"
    part_of_speech: numeral
    accepted_translations: ["three"]
    surface_variants: ["tres"]
    accent_insensitive: false
    example:
      target: "Tres pollos."
      english: "Three chickens."
    reference_ids: [wiktionary-tres]
  - id: cien
    kind: word
    target: "cien"
    part_of_speech: numeral
    accepted_translations: ["a hundred", "one hundred"]
    surface_variants: ["cien"]
    accent_insensitive: false
    example:
      target: "Cien gramos de jamón."
      english: "A hundred grams of ham."
    note: "Cien before a noun or on its own; ciento in compounds (ciento cincuenta)."
    reference_ids: [wiktionary-cien]
  - id: medio
    kind: word
    target: "medio"
    part_of_speech: adjective
    accepted_translations: ["half", "half a"]
    surface_variants: ["medio"]
    accent_insensitive: false
    example:
      target: "Medio kilo de chorizo."
      english: "Half a kilo of chorizo."
    reference_ids: [rae-medio]
