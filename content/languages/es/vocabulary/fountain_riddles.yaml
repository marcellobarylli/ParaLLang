# Round 011: The Cracked Fountain (commands, directions, time). Reference URLs follow the existing patterns and
# were not opened from the build container; listed for the owner's content review.
# Round 050 (backlog G5): telling the time (son las, es la una, mediodía, medianoche) and Flick's question.
version: fountain-riddles-es-v2
references:
  - id: rae-quieto
    title: 'Real Academia Española, Diccionario de la lengua española: quieto'
    url: https://dle.rae.es/quieto
  - id: rae-bastar
    title: 'Real Academia Española, Diccionario de la lengua española: bastar'
    url: https://dle.rae.es/bastar
  - id: rae-mirar
    title: 'Real Academia Española, Diccionario de la lengua española: mirar'
    url: https://dle.rae.es/mirar
  - id: rae-derecho
    title: 'Real Academia Española, Diccionario de la lengua española: derecho'
    url: https://dle.rae.es/derecho
  - id: rae-izquierdo
    title: 'Real Academia Española, Diccionario de la lengua española: izquierdo'
    url: https://dle.rae.es/izquierdo
  - id: rae-ahora
    title: 'Real Academia Española, Diccionario de la lengua española: ahora'
    url: https://dle.rae.es/ahora
  - id: rae-despues
    title: 'Real Academia Española, Diccionario de la lengua española: después'
    url: https://dle.rae.es/despu%C3%A9s
  - id: rae-manana
    title: 'Real Academia Española, Diccionario de la lengua española: mañana'
    url: https://dle.rae.es/ma%C3%B1ana
  - id: rae-hora
    title: 'Real Academia Española, Diccionario de la lengua española: hora'
    url: https://dle.rae.es/hora
  - id: rae-mediodia
    title: 'Real Academia Española, Diccionario de la lengua española: mediodía'
    url: https://dle.rae.es/mediod%C3%ADa
  - id: rae-medianoche
    title: 'Real Academia Española, Diccionario de la lengua española: medianoche'
    url: https://dle.rae.es/medianoche
entries:
  - id: quieto
    kind: word
    target: quieto
    part_of_speech: adjective
    accepted_translations:
      - still
      - keep still
      - stop
    surface_variants:
      - quieto
      - quieta
      - quietos
    accent_insensitive: false
    example:
      target: ¡Estate quieto!
      english: Keep still!
    note: '¡Quieto! on its own works as a command: hold still. Feminine quieta, plural quietos.'
    reference_ids:
      - rae-quieto
  - id: basta
    kind: word
    target: basta
    part_of_speech: interjection
    accepted_translations:
      - enough
      - stop
      - that is enough
    surface_variants:
      - basta
    accent_insensitive: false
    example:
      target: ¡Basta, por favor!
      english: Enough, please!
    reference_ids:
      - rae-bastar
  - id: mira
    kind: word
    target: mira
    part_of_speech: verb
    accepted_translations:
      - look
    surface_variants:
      - mira
    accent_insensitive: false
    example:
      target: ¡Mira la fuente!
      english: Look at the fountain!
    note: Imperative of mirar, informal tú form.
    reference_ids:
      - rae-mirar
  - id: derecha
    kind: word
    target: derecha
    part_of_speech: noun
    accepted_translations:
      - right
      - the right
    surface_variants:
      - derecha
    accent_insensitive: false
    example:
      target: Gira a la derecha.
      english: Turn right.
    note: 'A la derecha: to the right.'
    reference_ids:
      - rae-derecho
  - id: izquierda
    kind: word
    target: izquierda
    part_of_speech: noun
    accepted_translations:
      - left
      - the left
    surface_variants:
      - izquierda
    accent_insensitive: false
    example:
      target: Ve a la izquierda.
      english: Go left.
    note: 'A la izquierda: to the left.'
    reference_ids:
      - rae-izquierdo
  - id: ahora
    kind: word
    target: ahora
    part_of_speech: adverb
    accepted_translations:
      - now
      - right now
    surface_variants:
      - ahora
    accent_insensitive: false
    example:
      target: Ahora, no mañana.
      english: Now, not tomorrow.
    reference_ids:
      - rae-ahora
  - id: despues
    kind: word
    target: después
    part_of_speech: adverb
    accepted_translations:
      - later
      - afterwards
      - after
    surface_variants:
      - después
      - despues
    accent_insensitive: true
    example:
      target: Lo hago después.
      english: I'll do it later.
    reference_ids:
      - rae-despues
  - id: manana
    kind: word
    target: mañana
    part_of_speech: adverb
    accepted_translations:
      - tomorrow
    surface_variants:
      - mañana
      - manana
    accent_insensitive: true
    example:
      target: ¡Hasta mañana!
      english: See you tomorrow!
    note: Mañana also means morning (la mañana).
    reference_ids:
      - rae-manana
  - id: son_las
    kind: phrase
    target: son las
    part_of_speech: verb_phrase
    accepted_translations:
      - it is
      - it is o'clock
    surface_variants:
      - son las
    accent_insensitive: false
    example:
      target: Son las tres.
      english: It is three o'clock.
    note: "Hours are plural: son las dos, son las tres (las horas, the hours). One o'clock is singular: es la una."
    reference_ids:
      - rae-hora
  - id: es_la_una
    kind: phrase
    target: es la una
    part_of_speech: verb_phrase
    accepted_translations:
      - it is one o'clock
      - one o'clock
    surface_variants:
      - es la una
      - la una
    accent_insensitive: false
    example:
      target: Es la una, Flick.
      english: It is one o'clock, Flick.
    note: "Singular, because una (one) is one hour: es la una, but son las dos."
    reference_ids:
      - rae-hora
  - id: mediodia
    kind: word
    target: mediodía
    part_of_speech: noun
    accepted_translations:
      - midday
      - noon
    surface_variants:
      - mediodía
    accent_insensitive: false
    example:
      target: Es mediodía.
      english: It is midday.
    reference_ids:
      - rae-mediodia
  - id: medianoche
    kind: word
    target: medianoche
    part_of_speech: noun
    accepted_translations:
      - midnight
    surface_variants:
      - medianoche
    accent_insensitive: false
    example:
      target: Es medianoche.
      english: It is midnight.
    reference_ids:
      - rae-medianoche
  - id: que_hora_es
    kind: phrase
    target: qué hora es
    part_of_speech: question
    accepted_translations:
      - what time is it
    surface_variants:
      - qué hora es
    accent_insensitive: false
    example:
      target: ¿Qué hora es, Flick?
      english: What time is it, Flick?
    reference_ids:
      - rae-hora
