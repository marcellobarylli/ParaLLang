    accent_insensitive: false
    example: { target: "El café está delicioso.", english: "The coffee is delicious." }
    reference_ids: [rae-delicioso]
  - id: gracias
    kind: word
    target: "gracias"
    part_of_speech: interjection
    accepted_translations: ["thank you", "thanks"]
    surface_variants: ["gracias", "muchas gracias"]
    accent_insensitive: false
    example: { target: "Muchas gracias, Gerald.", english: "Thank you very much, Gerald." }
