entries:
  - id: bueno
    kind: word
    target: "bueno"
    part_of_speech: adjective
    accepted_translations: ["good", "tasty"]
    surface_variants: ["bueno", "buena", "buen", "buenísimo", "buenísima"]
    accent_insensitive: false
    example: { target: "El café está bueno.", english: "The coffee is good." }
    note: "Bueno agrees with its noun: el café está bueno, la taza está buena. Buenísimo means 'very good'. Before a masculine noun it shortens: un buen café."
    reference_ids: [rae-bueno]
  - id: delicioso
    kind: word
    target: "delicioso"
    part_of_speech: adjective
    accepted_translations: ["delicious", "tasty"]
