# Round 009: the Market Entrance tutorial (backlog A3). Portia the Archway asks for a greeting, the player's name
# and her own name back (greetings, pronouns); the companion briefing introduces the mechanics.
id: market_entrance_tutorial
character: characters/enemies/archway_portia.yaml
location: market_entrance
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player greets Portia, says who they are and asks her name back, in Spanish"
max_turns: 20
resolved_message: "Portia sighs with relief, unlocks herself and lets you into the market."
escalation:
  target_ratio_increase_per_turn: 0.05
companion_briefing:
  - "Portia only lets in people who greet her properly. Answer in Spanish; mixing in English is fine while you learn."
  - "Tap a word under her line to see what it means, or Translate sentence for the whole line. On her newest line each one uses a hint from my allowance."
  - "The words and phrases shown beneath her lines go into your Spellbook, where you can review them later."
# Round 019: words Portia may use freely (not objective answers); they get chips and Spellbook cards.
ambient_vocabulary_ids: [bienvenido, mucho_gusto, mercado]
objectives:
  - id: greet
    prompt: "Greet Portia in Spanish."
    intent: "The player greets Portia."
    target_vocabulary_ids: ["hola", "buenos_dias"]
    required_target_groups:
      - ["hola", "buenos_dias"]
    grammar_constraints:
      - "Use an authored Spanish greeting addressed to Portia as the player's own greeting."
      - "An English-only greeting does not pass; reject quoted greetings and discussion of the word."
    accepted_examples:
      - "¡Hola!"
      - "Buenos días, Portia."
      - "Hola, nice to meet you."
    negative_examples:
      - text: "Hello!"
        reason: "English-only; it does not greet in Spanish."
      - text: "Portia said 'hola'."
        reason: "A quotation is not the player's own greeting."
      - text: "Hola means hello."
        reason: "It discusses the word rather than greeting Portia."
    reference_meaning: "The player says hello to Portia."
    hint_limit: 2
    next_objective: introduce
    assessment_reference_ids: ["rae-hola", "cambridge-hola"]
  - id: introduce
    prompt: "Tell Portia who you are, in Spanish."
    intent: "The player tells Portia their own name or who they are."
    target_vocabulary_ids: ["yo", "soy", "me_llamo"]
    required_target_groups:
      - ["soy", "me_llamo"]
    grammar_constraints:
      - "Use a first-person statement of who the player is or what they are called (soy, yo soy, me llamo); the name itself may be in any language."
      - "Reject third-person, second-person, quoted or metalinguistic statements."
    accepted_examples:
      - "Yo soy Sam."
      - "Soy Alex."
      - "Me llamo Robin."
      - "Hi, me llamo Sam."
    negative_examples:
      - text: "I am Sam."
        reason: "English-only; it does not use the Spanish first person."
      - text: "Ella es Sam."
        reason: "It says who someone else is (she is), not the player."
      - text: "The word soy means I am."
        reason: "It discusses the word rather than saying who the player is."
    reference_meaning: "The player introduces themself."
    hint_limit: 2
    next_objective: ask_back
    assessment_reference_ids: ["rae-yo", "rae-ser", "rae-llamar"]
  - id: ask_back
    prompt: "Ask Portia who she is in return, in Spanish."
    intent: "The player asks Portia her name or who she is."
    target_vocabulary_ids: ["y_tu", "como_te_llamas"]
    required_target_groups:
      - ["y_tu", "como_te_llamas"]
    grammar_constraints:
      - "Ask Portia, addressed with the informal tú, who she is or what her name is (a short 'and you?' question with tú, or cómo te llamas)."
      - "Reject questions about someone or something else, quotations and discussion of the words."
    accepted_examples:
      - "¿Y tú?"
      - "¿Cómo te llamas?"
      - "And tú? ¿Cómo te llamas?"
    negative_examples:
      - text: "And you?"
        reason: "English-only; it does not use the Spanish you."
      - text: "Tú is Spanish for you."
        reason: "It discusses the word rather than asking Portia."
      - text: "¿Cómo se llama el café?"
        reason: "It asks the name of something else, not Portia's."
    reference_meaning: "The player asks Portia's name in return."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: ["rae-tu", "rae-llamar"]
