id: gerald_confidence
character: characters/enemies/imp_coffee.yaml
party_of: imp_coffee_greeting
# Round 047 (backlog G4): offered instead of the coffee break once Gerald has finished three conversations, after
# he has recited the Dead Branch passage.
after_conversations: 3
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player tells Gerald he is a friend and raises a toast with him, in Spanish"
max_turns: 20
resolved_message: "Gerald says the coffee is too bitter today. His eyes are a little wet. It is the steam, he says."
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: call_friend
    prompt: "Gerald is brooding over the word that died with the Dead Branch. Tell him he is your friend, using Spanish."
    intent: "Gerald has travelled with the player for several coffee breaks. Tonight he is quietly morose: in a line or two he mentions a dark, bitter drink from the Dead Branch, his old home, whose name died with it, so nobody remembers the word. The player may not know the story. He would never admit he wants to hear that the player considers him a friend, and he does not suggest the word for friend."
    target_vocabulary_ids: [amigo]
    required_target_groups:
      - [amigo]
    grammar_constraints:
      - "The player says, in their own words, with a Spanish word for friend, one of: Gerald is their friend (amigo, as Gerald is male); the player is Gerald's friend (amigo or amiga, by the player's own gender); the two of them are friends (amigos)."
      - "Reject English-only lines, negations (no eres mi amigo), quotations, definitions of the word, and lines about someone other than Gerald and the player."
    accepted_examples:
      - "Eres mi amigo."
      - "Gerald, eres un amigo."
      - "Somos amigos, Gerald."
      - "Soy tu amiga."
      - "You are my amigo."
    negative_examples:
      - text: "You are my friend."
        reason: "English-only; it does not use a Spanish word for friend."
      - text: "No eres mi amigo."
        reason: "A negation is not what the player is asked to say."
      - text: "Gerald, eres mi amiga."
        reason: "Gerald is male; amiga does not describe him."
      - text: "Amigo means friend."
        reason: "It discusses the word rather than telling Gerald."
    reference_meaning: "The player tells Gerald that he is their friend."
    hint_limit: 2
    next_objective: raise_toast
    assessment_reference_ids: [rae-amigo]
  - id: raise_toast
    prompt: "Raise your cups together. Make the toast, using Spanish."
    intent: "Gerald lifts his surgically attached espresso cup towards the player's cup, to the friendship and to the dead word, and waits for the player to make the toast. He does not say the toast first."
    target_vocabulary_ids: [salud]
    required_target_groups:
      - [salud]
    grammar_constraints:
      - "The player makes a Spanish toast as the cups touch, in their own words."
      - "Reject English-only toasts, quotations, and lines that only describe toasting."
    accepted_examples:
      - "¡Salud!"
      - "¡Salud, Gerald!"
      - "Salud, to the dead word."
    negative_examples:
      - text: "Cheers!"
        reason: "English-only; it does not use the Spanish toast."
      - text: "In Spain they say salud."
        reason: "It describes the toast rather than making it."
    reference_meaning: "The player makes a toast with Gerald."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: [rae-salud]
