id: flick_slow_walk
character: characters/enemies/letharger_flick.yaml
party_of: cracked_fountain_letharger
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: Player gets Flick moving and keeps it beside them, in Spanish
max_turns: 20
resolved_message: Flick moves. Now. Together with you. Historians will doubt it.
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: minutes
    prompt: 'Flick, now in your party, has sat down and wants five more minutes. Bargain: tell it how many minutes it gets, using a Spanish number.'
    intent: Flick, now travelling in the player's party, has sat down and asks, in one English sentence, for "five more minutes". In its greeting it does not introduce itself. The player answers with how many minutes Flick gets, as a Spanish number. Before the player names a number, Flick says no Spanish number itself, neither five nor any other; once the player has named one, Flick may haggle back with a different Spanish number of minutes. Flick does not say "vamos" or "juntos" itself before the player has.
    target_vocabulary_ids:
      - dos
      - tres
      - cuatro
      - cinco
      - seis
      - siete
      - ocho
      - nueve
      - diez
      - once
      - doce
    required_target_groups:
      - - dos
        - tres
        - cuatro
        - cinco
        - seis
        - siete
        - ocho
        - nueve
        - diez
        - once
        - doce
    grammar_constraints:
      - The player's own offer of a number of minutes from two to twelve, with the number as a Spanish word, alone or with the word for minutes; a tentative question or a correction (not five, two) is an offer too.
      - Agreeing to five passes; an agreement slip in the word for minutes passes, and feedback may correct it in English.
      - Reject English-only numbers, digits, numbers outside two to twelve, a number that is not an offer of minutes, refusals, quotations and talk about the word.
    accepted_examples:
      - ¡Dos minutos!
      - Diez minutos, ni uno más.
      - Tres.
      - ¿Tres minutos?
      - ¡No cinco, dos minutos!
    negative_examples:
      - text: Two minutes.
        reason: English-only; it does not use a Spanish number.
      - text: 2 minutos.
        reason: A digit, not the Spanish word.
      - text: Flick dice cinco.
        reason: It reports what Flick says rather than making an offer.
      - text: Tres horas.
        reason: Hours, not an offer of minutes.
      - text: Cien minutos.
        reason: A hundred is outside two to twelve.
    reference_meaning: The player tells Flick how many minutes it gets.
    hint_limit: 2
    next_objective: lets_go
    assessment_reference_ids:
      - wiktionary-seis
  - id: lets_go
    prompt: 'Flick, now in your party, has had its minutes. Get it moving: say let''s go, using Spanish.'
    intent: Flick, now travelling in the player's party, has had its minutes, and they are up. The player must get it moving. Flick does not say "vamos" or "juntos" itself before the player has.
    target_vocabulary_ids:
      - vamos
    required_target_groups:
      - - vamos
    grammar_constraints:
      - The player tells Flick in Spanish that they are going now.
      - Reject English-only answers, refusals, and quotations.
    accepted_examples:
      - ¡Vamos!
      - ¡Vamos, Flick!
      - Venga, vamos ahora.
    negative_examples:
      - text: Let's go.
        reason: English-only; it does not use the Spanish word.
      - text: No vamos.
        reason: It refuses to go.
      - text: Flick says vamos.
        reason: It reports someone else's words.
    reference_meaning: The player says let's go.
    hint_limit: 2
    next_objective: together
    assessment_reference_ids:
      - rae-ir
  - id: together
    prompt: Flick wanders off again. Tell it you go together, using Spanish.
    intent: Flick keeps drifting away; the player says they go together.
    target_vocabulary_ids:
      - juntos
    required_target_groups:
      - - juntos
    grammar_constraints:
      - The player says in Spanish that they go together.
      - Reject English-only answers, refusals, and talk about the word.
    accepted_examples:
      - Juntos.
      - ¡Vamos juntos!
      - Juntos, Flick.
    negative_examples:
      - text: Together.
        reason: English-only; it does not use the Spanish word.
      - text: No juntos.
        reason: It refuses to go together.
      - text: Juntos means together.
        reason: It discusses the word rather than saying it to Flick.
    reference_meaning: The player says they go together.
    hint_limit: 2
    next_objective: null
    assessment_reference_ids:
      - rae-junto
