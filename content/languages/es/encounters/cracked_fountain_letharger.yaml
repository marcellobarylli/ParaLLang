# Round 011: The Cracked Fountain (backlog A5). Flick the Letharger distracts the player with riddles; the player
# takes control: tells it to stop, tells it which way to go, and insists on now rather than later.
id: cracked_fountain_letharger
character: characters/enemies/letharger_flick.yaml
location: cracked_fountain
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player tells Flick to stop, tells it which way to go and insists on now, all in Spanish"
max_turns: 20
resolved_message: "Flick holds still for almost a whole second, points the way you told it, and is gone before you can look straight at it. The fountain is quieter, and the jingle has almost left your head."
# Round 025 (backlog B3): a containment notice for the Fountain's infohazard, Flick's jingle.
companion_briefing:
  - "Containment notice, the Cracked Fountain: one brainrot strain. Harm: low. Virulence: very high."
  - "Vector: a jingle. It only works on people who understand it. If you understood it, congratulations."
  - "Containment procedure: do not hum along."
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: stop
    prompt: "Flick will not hold still. Tell it to stop, in Spanish."
    intent: "The player tells Flick to stop or keep still, as a command in Spanish."
    target_vocabulary_ids: ["quieto", "basta"]
    required_target_groups:
      - ["quieto", "basta"]
    grammar_constraints:
      - "The player's own command to stop, keep still or that's enough, in Spanish."
      - "Other commands (look, listen) do not pass; reject quotations, remarks about Flick and English-only commands."
    accepted_examples:
      - "¡Quieto!"
      - "¡Basta, Flick!"
      - "¡Estate quieto, por favor!"
    negative_examples:
      - text: "¡Mira!"
        reason: "A command, but it tells Flick to look, not to stop."
      - text: "Stop moving!"
        reason: "English-only; the command must be in Spanish."
      - text: "Flick never says basta."
        reason: "A remark about Flick is not the player's own command."
    reference_meaning: "The player commands Flick to stop moving."
    hint_limit: 2
    next_objective: direction
    assessment_reference_ids: ["rae-quieto", "rae-bastar"]
  - id: direction
    prompt: "Flick has lost its way again. Tell it which way to go, in Spanish."
    intent: "The player tells Flick a direction to go, left or right, in Spanish."
    target_vocabulary_ids: ["derecha", "izquierda"]
    required_target_groups:
      - ["derecha", "izquierda"]
    grammar_constraints:
      - "The player's own direction for Flick, in Spanish; left or right passes."
      - "Reject a question back, quotations and English-only directions."
    accepted_examples:
      - "¡A la izquierda!"
      - "Ve a la derecha."
    negative_examples:
      - text: "Left."
        reason: "English-only; the direction must be in Spanish."
      - text: "¿Derecha o izquierda?"
        reason: "A question back is not a direction for Flick."
    reference_meaning: "The player gives Flick a direction."
    hint_limit: 2
    next_objective: now
    assessment_reference_ids: ["rae-derecho", "rae-izquierdo"]
  - id: now
    prompt: "Flick says you can do it later. Insist on now, in Spanish."
    intent: "The player refuses to put it off and says now, in Spanish. Flick keeps humming its jingle, \"¡Después, después, mañana!\" (later, later, tomorrow), a mild brainrot infohazard that makes listeners put things off. Repeating the jingle or agreeing to later does not pass; a refusal that names later or tomorrow and insists on now passes."
    target_vocabulary_ids: ["ahora"]
    required_target_groups:
      - ["ahora"]
    grammar_constraints:
      - "The player's own insistence on now, in Spanish."
      - "Agreeing to later or tomorrow does not pass; reject quotations and English-only answers."
    accepted_examples:
      - "¡No, ahora!"
      - "Ahora, Flick."
      - "Ahora, no mañana."
    negative_examples:
      - text: "Mañana."
        reason: "It agrees to put it off until tomorrow, which is what Flick wants."
      - text: "Vale, después."
        reason: "It agrees to later."
      - text: "Now!"
        reason: "English-only; the answer must be in Spanish."
      - text: "¡Después, después, mañana!"
        reason: "Humming Flick's jingle back puts it off; it does not insist on now."
    reference_meaning: "The player insists on doing it now."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: ["rae-ahora"]
