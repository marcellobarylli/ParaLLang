# Round 010: The Butcher's Stall (backlog A4). Mortimer the Charcutier calls everything jamón; the player names the
# real cut and says how much they want.
id: butchers_stall_charcutier
character: characters/enemies/charcutier_mortimer.yaml
location: butchers_stall
type: dialogue
initial_prompt_template: encounter/greeting.txt
turn_prompt_template: encounter/dialogue_turn.txt
defeat_condition:
  type: comprehension_and_response
  description: "Player asks for a meat that is not ham by its Spanish name and says how much they want"
max_turns: 20
resolved_message: "Mortimer weighs your order twice, wraps it in paper labelled with the wrong word, and lets you go."
escalation:
  target_ratio_increase_per_turn: 0.05
objectives:
  - id: name_meat
    prompt: "Mortimer says everything is ham. Ask him for a different meat, by its Spanish name."
    intent: "The player asks Mortimer for a meat other than ham, naming it in Spanish."
    target_vocabulary_ids: ["chorizo", "salchicha", "pollo"]
    required_target_groups:
      - ["chorizo", "salchicha", "pollo"]
    grammar_constraints:
      - "The player's own request for a meat that is not ham, with the meat named in Spanish."
      - "Asking for ham does not pass; reject quotations, remarks about what Mortimer says, and English-only requests."
    accepted_examples:
      - "Quiero chorizo, por favor."
      - "Dos salchichas, por favor."
      - "I'd like some pollo, please."
    negative_examples:
      - text: "Quiero jamón."
        reason: "It asks for ham, which Mortimer insists everything is; the objective is to name a different cut."
      - text: "I want sausage, please."
        reason: "English-only; the meat must be named in Spanish."
      - text: "Mortimer says it is all salchicha."
        reason: "A remark about what he says is not the player's own request."
    reference_meaning: "The player asks for a specific meat other than ham."
    hint_limit: 2
    next_objective: quantity
    assessment_reference_ids: ["rae-chorizo", "rae-salchicha", "rae-pollo"]
  - id: quantity
    prompt: "Tell Mortimer how much you want, in Spanish."
    intent: "The player says how much of the meat they want: a number or a half, with a unit of weight."
    target_vocabulary_ids: ["kilo", "gramos", "dos", "tres", "cien", "medio"]
    required_target_groups:
      - ["kilo", "gramos"]
    grammar_constraints:
      - "A quantity in Spanish: a number, un/una or a half, together with a unit of weight; a bare unit does not pass."
      - "The player's own order; reject price questions, quotations and English-only quantities."
    accepted_examples:
      - "Medio kilo, por favor."
      - "Un kilo."
      - "Doscientos gramos de chorizo, por favor."
      - "Dos kilos, please."
    negative_examples:
      - text: "Kilos."
        reason: "A bare unit is not a quantity."
      - text: "Two hundred grams."
        reason: "English-only; the quantity must be in Spanish."
      - text: "¿Cuánto cuesta un kilo?"
        reason: "It asks about a price rather than saying how much the player wants."
    reference_meaning: "The player states the amount they want to buy."
    hint_limit: 2
    next_objective: null
    assessment_reference_ids: ["rae-kilo", "rae-gramo", "rae-medio"]
